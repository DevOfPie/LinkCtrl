openapi: 3.0.3

# The contract for /api/v1.
#
# This document is hand-maintained and enforced by tests rather than generated
# or generating: internal/httpx has a parity test asserting every registered
# API route appears here (and nothing more), and the integration suite replays
# real requests through every operation, validating requests and responses
# against these schemas. A drift between this file and the implementation is a
# test failure, not a support ticket.

info:
  title: LinkCtrl API
  version: "1.0"
  description: |
    Self-hostable link management. Every capability of the dashboard is
    available here; the two surfaces call the same service layer.

    ### Authentication
    Two credentials work everywhere:
    * **API key** — `Authorization: Bearer lk_live_…`. Keys are minted in the
      dashboard or with `lctl apikey create`, and act as their owner limited to
      the scopes granted at creation, intersected with the owner's current
      role on every request.
    * **Session cookie** — set by `POST /auth/login`, primarily for the
      dashboard. Cookie-authenticated unsafe requests must be same-origin.

    If a request carries both, the bearer key wins.

    ### Errors
    Every error is an RFC 9457 problem document
    (`application/problem+json`). Validation failures carry a per-field
    `errors` array shaped for form rendering.

    ### Rate limits
    **Any** operation here may answer `429` with a `Retry-After` header once
    the per-address API limit is exceeded, so it is documented once rather
    than repeated on every path; the endpoints that verify a credential carry
    a second, much tighter limit and list it explicitly. One problem type
    returns `429` — `rate-limited`, meaning "you are going too fast" — and it
    carries `Retry-After`, which is worth waiting out. An account locked by
    repeated failed sign-ins answers `401` like every other credential
    failure, because a distinct answer for it would say whether the address
    named has an account here.

    Any operation may also answer `504` if it exceeds the server's
    per-request deadline.

    ### Privacy
    Unique-visitor figures are privacy-preserving estimates at daily
    resolution, and multi-day totals sum daily figures. The caveat travels
    with the data in every analytics response.
  license:
    name: MIT
    url: https://github.com/DevOfPie/LinkCtrl/blob/main/LICENSE

servers:
  - url: /api/v1

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: auth
    description: Registration, sign-in and session lifecycle
  - name: links
    description: Short links and their lifecycle
  - name: tags
    description: Workspace tags
  - name: folders
    description: >
      A workspace's folder tree: where links are filed. Guarded by the link
      permissions rather than by folder permissions of their own — a folder is
      where a link lives, in the sense a routing rule is where a link points.
  - name: campaigns
    description: >
      A workspace's campaigns: the label a link carries to say what body of work
      it belongs to. Guarded by the link permissions rather than by campaign
      permissions of their own, for the reason folders are. **No campaign
      analytics** — that stays a later phase; the links list filtered by
      campaign is what this surface answers with.
  - name: webhooks
    description: >
      Where this server sends a workspace's events. **The one surface on this API
      whose values make the instance itself open outbound connections**, which is
      why it carries permissions of its own — `webhooks.read` and
      `webhooks.write`, both owner and admin — rather than reusing the link
      permissions that guard folders, campaigns and QR codes. `webhooks.write` is
      not delegable to an API key.
  - name: automation
    description: >
      Standing instructions the scheduler runs unattended: when this happens in
      this workspace, do these things. Carries permissions of its own —
      `automation.read` and `automation.write`, both owner and admin — for the
      reason webhooks do, and one turn further: a webhook is an instruction to
      *report*, and a rule is an instruction to *act*. `automation.write` is not
      delegable to an API key. **There is no endpoint that evaluates a rule**;
      evaluation runs on the leader-elected scheduler and nowhere else.
  - name: qr
    description: >
      A link's QR code, as JSON and as a picture. `qr.svg` and `qr.png` are the
      two non-JSON responses this API has besides the spec document itself, and
      they are the same image at the same size.
  - name: rules
    description: >
      Routing rules: which visitors a link sends where, evaluated in priority
      order with the first match winning
  - name: split
    description: >
      Split testing: weighted and sequential arms, a fallback destination, and
      the per-arm enabled flag that is this product's feature flag
  - name: domain
    description: Settings for the hostname short links are served on
  - name: domains
    description: >
      Hostnames a workspace has registered. Ownership and management only —
      nothing is served on a registered hostname yet
  - name: analytics
    description: Rollup-backed statistics and recent activity
  - name: api-keys
    description: Programmatic credentials
  - name: audit
    description: What changed, who changed it, and when
  - name: disputes
    description: Appealing a blocked destination, and the queue that decides them
  - name: instance
    description: >
      Who administers the instance rather than a tenant in it. The account that
      claimed the instance holds `instance.admin`; it may confer instance-level
      review of disputed destinations on other accounts, and a holder of that
      review may not confer it onwards. None of these permissions is delegable
      to an API key, and no organization role carries any of them.
  - name: feeds
    description: >
      Whether this instance sends destinations to a third party, and to whom.
      Read-only by design
  - name: invitations
    description: Adding people to an organization
  - name: members
    description: Who is in an organization, at what role, and where that role reaches
  - name: organizations
    description: Creating an organization of your own, and tearing one down
  - name: notifications
    description: Your own in-app inbox
  - name: workspaces
    description: Which workspace you are acting in, and which you may switch to
  - name: meta
    description: The API describing itself

paths:
  /auth/setup:
    post:
      tags: [auth]
      operationId: setupInstance
      summary: Claim a fresh instance by creating the first account
      description: |
        Exists only while the instance has no users, then returns 404 forever.
        The first account is an owner and skips email verification: whoever can
        reach a fresh instance's setup endpoint deployed it.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/SetupCredentials"
      responses:
        "201":
          description: Instance claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Start creating an account
      description: |
        Open to anybody only when the instance's **effective** signup mode is
        `open`. That mode is `LINKCTRL_SIGNUP_MODE`, which the operator sets and
        nothing else can: there is no endpoint that changes it. Anything but
        `open` answers 403, and the refusal is the same whichever reason applies.

        **This creates no account.** The address is verified first, so the
        response is `202` and what exists afterwards is a pending registration
        and an emailed link. Following that link is what creates the user, an
        organization and a workspace, with the registrant as its owner — a
        self-registered account is a tenant of its own, unlike an invited one,
        which gets membership in the inviter's organization and nothing else.

        Because verification is by email, `open` requires a configured mailer.
        With none, the effective mode is `invite` and this endpoint refuses.

        **An address that already has an account gets the same `202`.** It used
        to answer `409`, which made this endpoint an oracle for whether an
        address is registered — reachable by anybody, since the endpoint is
        unauthenticated whenever the mode is `open`. Both answers now cost the
        same argon2 work and return the same body, and the person who owns the
        address is told by mail that somebody tried to register it. Nothing is
        written for a taken address, so a stranger cannot invalidate an
        outstanding verification link either.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "202":
          description: >-
            Verification sent; no account exists yet. Also the answer when the
            address already has an account, in which case the mail says so and
            the response does not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPending"
        "403":
          description: Registration is closed on this instance
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in and receive a session cookie
      description: |
        Every credential failure returns the same 401, whatever the cause —
        unknown address, wrong password, suspended account, or an account
        locked out by repeated failures. Same status, same problem type, same
        body, and the same argon2 cost, so neither the answer nor how long it
        took reveals which addresses are registered. The body names the
        lockout unconditionally, so somebody sitting out their own knows why
        waiting helps; it says the same thing when no lockout is in force.

        Two independent limits guard this endpoint and they are not the same
        thing. Repeated failures against one account lock it for fifteen
        minutes, which is invisible in the response by design. Too many
        attempts from one address are throttled whatever accounts they name,
        and that one answers 429 `rate-limited` with `Retry-After` — it is
        what credential stuffing across a leaked list looks like, and the
        per-account lockout would never see it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
                  description: Ignored on login; accepted so one credentials shape serves register and login.
      responses:
        "200":
          description: Signed in; the session cookie is on the response
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`__Host-linkctrl_session` (unprefixed over plain HTTP in development)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "401":
          description: |
            A credential failure, or a sign-in that stopped at the second factor
            (M53).

            The two are told apart by `type`. Every credential failure is
            `invalid-credentials` and says nothing more. A second factor is
            `mfa-required`, and carries `mfa_token` and `mfa_expires_at` as
            extension members — post them to `/auth/mfa/challenge` with a code.

            **A 401 rather than a 200 with a flag, deliberately.** A client that
            has never heard of a second factor treats this as a failed sign-in,
            which is correct: it has no session and must not proceed. A 200
            carrying `mfa_required: true` would be read as success by every
            client that checks the status code.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          description: |
            This address is being throttled (`rate-limited`); `Retry-After`
            says for how long. A locked account is **not** answered here — it
            is a 401 like every other credential failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: Succeeds even without a valid session, and always clears the cookie.
      security: []
      responses:
        "204":
          description: Session revoked, cookie cleared

  /auth/forgot:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Ask for a password reset link
      description: |
        Mails a single-use link to the address, if the address can be recovered
        on this instance.

        **The answer is `202` for every address**, with the same body and the
        same argon2 cost, whether or not the address has an account and whether
        or not that account can be recovered. Neither the response nor a
        stopwatch says which. The answer goes to the address by mail — an
        address that cannot be recovered receives a message saying no link was
        created, which is the stance `POST /auth/register` already takes: the
        channel that proves an address exists is the mailbox, and a status code
        reaches whoever typed the address into the form.

        The stated cost is that this sends mail to addresses that never
        registered. It is bounded by the login limiter and it is the same bound
        registration already accepted.

        **This endpoint requires a configured mailer and refuses without one.**
        It is the one place in this product that does not degrade when
        `SMTP_HOST` is unset: the mail is the mechanism, so a request that
        succeeded into a void would be worse than the lockout it was meant to
        cure. With no relay the answer is `503`, and the operator's route back
        into a locked-out account is setting the hash directly.

        Two accounts are refused, silently, and each gets the "no link created"
        mail: one whose status is not `active`, and one with no password to
        replace. A suspended account is not recoverable by the person who lost
        the password, and saying so is the operator's job.

        Shares the login limiter with `POST /auth/login`, deliberately, so an
        attacker cannot double their budget by alternating between the two.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: >-
            A message has been queued to the address. The same answer whether or
            not it has an account, and the body carries nothing that varies.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [reset_requested]
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoMailer"

  /auth/reset:
    post:
      tags: [auth]
      operationId: completePasswordReset
      summary: Spend a reset token and set a new password
      description: |
        Writes the new password through the same argon2 path
        `POST /auth/password` uses, then **revokes every session on the
        account** — including any the caller did not open, which is the whole
        point of a recovery. API keys are deliberately not revoked: a key is a
        separate credential with its own rotation story, and taking them out
        here would make recovery an outage.

        Every outstanding reset token for the account is spent at the same time,
        not only the one presented. A recovery that left a second live token
        behind would have recovered nothing.

        **`404` is the answer to every refusal, and never `410`.** A token that
        does not exist, one that has expired, one already used, an account whose
        status is not `active` and an account with no password are
        indistinguishable to a caller enumerating.

        `204` rather than a session: the caller signs in with the password they
        just set, which is also the proof they know it.

        The token travels in the body rather than in the path. A URL reaches the
        access log, the referrer header and the client's own history, and this
        one sets a password — the browser form has no choice, because a link in
        a mail is a URL, and a JSON client has no such excuse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token:
                  type: string
                  description: The token from the emailed link.
                new_password:
                  type: string
                  minLength: 12
      responses:
        "204":
          description: Password set; every session on the account revoked
        "404":
          description: |
            The link is not valid. Expired, already spent, never existed, or an
            account this mechanism refuses — the five are one answer on purpose.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NoMailer"

  /auth/mfa:
    get:
      tags: [auth]
      operationId: getMFAStatus
      summary: Whether this account has a second factor
      description: |
        `available` is the instance's answer rather than the account's: it is
        `false` when no `LINKCTRL_MFA_SECRET_KEY` is configured, which means
        nobody can enrol. An account that enrolled while a key was present and is
        read while it is absent reports `available: false` with `enabled: true`,
        which is a real state and the one an operator needs to see — those
        accounts sign in with a recovery code until the key comes back.
      responses:
        "200":
          description: The account's second factor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [auth]
      operationId: disableMFA
      summary: Turn the second factor off
      description: |
        The password **and** a code, because either alone is a downgrade somebody
        else can perform: a stolen session would otherwise remove the factor it
        was meant to be stopped by. `code` takes an authenticator code or a
        recovery code.

        Requires an interactive session — an API key is refused, on D87's limb
        that the session is the authority for operations whose subject is the
        person.

        Clearing the factor clears the stored secret and every recovery code in
        the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, code]
              properties:
                password:
                  type: string
                code:
                  type: string
                  description: An authenticator code, or a recovery code.
      responses:
        "204":
          description: The second factor is off
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This account has no second factor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/mfa/enrol:
    post:
      tags: [auth]
      operationId: beginMFAEnrolment
      summary: Offer a TOTP secret and the QR code that carries it
      description: |
        **Nothing is stored.** The account is untouched until `POST
        /auth/mfa/confirm` presents a code computed from this secret, so an
        enrolment that is started and abandoned leaves the account exactly as it
        was. Calling this twice offers two different secrets and at most one of
        them ever becomes real.

        `qr_svg` is the `otpauth://` URI drawn by the same generator the link
        pages use. It is here so a client has the picture without knowing how to
        encode one; `secret` is the same value in text, for anybody enrolling on
        the device they are reading — a phone cannot photograph its own screen.

        RFC 6238 with the parameters every authenticator app assumes: HMAC-SHA-1,
        six digits, a thirty-second period. They are in the URI and repeated in
        the body so a client never has to parse one to know the other.
      responses:
        "200":
          description: An enrolment offer
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri, qr_svg, digits, period]
                properties:
                  secret:
                    type: string
                    description: Base32, unpadded, as an authenticator app expects it.
                  uri:
                    type: string
                    description: The `otpauth://totp/…` URI.
                  qr_svg:
                    type: string
                    description: The URI drawn as an SVG document.
                  digits:
                    type: integer
                    example: 6
                  period:
                    type: integer
                    description: Seconds in one step.
                    example: 30
                  issuer:
                    type: string
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This account already has a second factor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            This instance has no `MFA_SECRET_KEY`, so a secret has nowhere safe
            to be kept.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/mfa/confirm:
    post:
      tags: [auth]
      operationId: confirmMFAEnrolment
      summary: Turn an offered secret into the account's second factor
      description: |
        `secret` is the value `POST /auth/mfa/enrol` returned and `code` is a
        current code computed from it. The secret is written, `mfa_enabled_at` is
        stamped and ten recovery codes are issued, all in one transaction — an
        account never has a factor without codes or codes without a factor.

        **`recovery_codes` is returned here and nowhere else.** Only their hashes
        are stored, so a client that discards this body has
        `POST /auth/mfa/recovery-codes` and nothing else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret, code]
              properties:
                secret:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Enrolled, with the recovery codes shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARecoveryCodes"
        "401":
          description: |
            The code is not valid. Codes last about thirty seconds and each one
            works once.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This account already has a second factor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: This instance has no `MFA_SECRET_KEY`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/mfa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateMFARecoveryCodes
      summary: Void the previous recovery codes and issue a new set
      description: |
        Every code goes, spent ones included: the previous set is void in full,
        and a count of leftovers from a void set would be a lie. The TOTP secret
        is unchanged — this is the answer to a lost piece of paper, not to a lost
        phone.
      responses:
        "200":
          description: A new set, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARecoveryCodes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This account has no second factor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/mfa/challenge:
    post:
      tags: [auth]
      operationId: completeSecondFactor
      summary: Finish a sign-in that stopped at the second factor
      description: |
        `POST /auth/login` answers `401` with an `mfa-required` problem carrying
        `mfa_token` when the password was right and the account has a second
        factor. This is where that token is spent, and the success body is
        `POST /auth/login`'s byte for byte — the same operation finished.

        `code` takes an authenticator code or a recovery code. A recovery code is
        single use, is audited, and notifies the account: a recovery code being
        spent means either the phone is gone or somebody else has it.

        **Failed attempts count against the account's own lockout**, the same
        counter and the same policy failed passwords use. A second factor with a
        budget of its own would hand an attacker who already has the password an
        unlimited supply of guesses.

        The pending token is single use and lives for minutes. A wrong code does
        not spend it — a typo would otherwise cost a full re-authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, code]
              properties:
                token:
                  type: string
                  description: The `mfa_token` from the sign-in refusal.
                code:
                  type: string
                  description: An authenticator code, or a recovery code.
      responses:
        "200":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "401":
          description: |
            The code is not valid, the sign-in can no longer be completed, or the
            account locked itself out while guessing. One answer for all of them.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the password and sign out every other session
      description: |
        Requires an interactive session — an API key is refused, because a
        leaked key must not be able to lock its owner out. The current session
        survives; all others are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        "204":
          description: Password changed, other sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /account:
    delete:
      tags: [auth]
      operationId: deleteAccount
      summary: Delete the authenticated account
      description: |
        Acts on the **calling account and no other**. There is no
        administrative delete-somebody-else: who may end another person's
        account is a permission-model question, and this endpoint does not
        answer it.

        Requires an interactive session — an API key is refused, for the reason
        a password change refuses one. The subject of this operation is the
        person, not the credential.

        **What happens immediately, in one transaction.** Sessions, API keys,
        memberships, notifications, outstanding password-reset tokens and any
        instance-level grants are removed; the account is marked deleted; the
        address becomes available for a new account. When this returns, no
        credential reaches the account.

        **What happens within the hour.** Records *about* you that ending the
        account does not remove keep their rows, because they are records of
        what happened rather than records of a person, and an hourly pass takes
        you out of them: the audit log and the destination-dispute queue, which
        carry no foreign key to the account at all; the invitations you
        redeemed and the notification your inviter received when you accepted,
        which belong to somebody else and so were never yours to delete. It
        replaces the actor snapshot **and the address held in a record's
        detail** with a fixed label, blanks the address on the invitations you
        redeemed — an empty value rather than a label, because redemption
        compares against that column — and clears the account's remaining
        fields. Until it runs, those still hold the address; access is already
        gone either way. `docs/SECURITY.md` states the bound, the enumeration,
        and the two addresses this deliberately leaves.

        **Two refusals**, both `409`, both naming what to do about it: the
        account that administers the instance (move the principal first), and
        the sole owner of an organization that still exists (hand it over or
        delete it first, and the detail says which organizations).

        Belonging to no organization is **not** a refusal. Handing over every
        organization you own alone is how most people arrive here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  description: >-
                    The account's own password, re-verified. In the body rather
                    than in a query parameter, which is why this DELETE carries
                    one: a password in a URL lands in access logs and browser
                    history.
      responses:
        "204":
          description: >-
            Account deleted. The session cookie is expired on this response;
            the residue is erased by the hourly pass.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The authenticated identity and its effective permissions
      description: |
        For an API key, `permissions` is the key's scopes intersected with the
        owner's current role — what this request can actually do, not what was
        granted at creation.
      responses:
        "200":
          description: The current identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /links:
    get:
      tags: [links]
      operationId: listLinks
      summary: List links with search, filters and keyset pagination
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Full-text over title/description, plus substring on alias and URL.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LinkStatus"
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, clicks]
            default: newest
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque, from `next_cursor` of the previous page.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
          description: Page size; out-of-range values fall back to the server default.
        - name: include_total
          in: query
          schema: { type: boolean }
          description: Counting costs a scan, so the total is opt-in.
        - name: tag
          in: query
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: true
          description: Repeatable; links matching any given tag id.
        - name: folder
          in: query
          schema: { type: string }
          description: >
            A folder id, or the word `none` for the links that are in no folder.
            One folder, not its subtree: the number returned has to match the
            `link_count` beside that folder in `GET /folders`. An unparseable
            value is ignored rather than matching nothing, so a bookmark to a
            deleted folder shows the links instead of suggesting they are gone.
        - name: campaign
          in: query
          schema: { type: string }
          description: >
            A campaign id, or the word `none` for the links carrying no
            campaign. Read exactly as `folder` above is, including that an
            unparseable value drops the filter rather than matching nothing.
        - name: domain
          in: query
          schema: { type: string, format: uuid }
          description: >
            A domain id: the links served on one hostname. No `none`
            counterpart, unlike `folder` — every link is on exactly one domain,
            so there is no third state to ask about. An id naming another
            workspace's hostname returns an empty page rather than a refusal,
            because a refusal would confirm the id names a real domain.
      responses:
        "200":
          description: One page of links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [links]
      operationId: createLink
      summary: Create a link
      description: |
        Destinations are restricted to http/https and may not point at
        private, loopback, link-local or cloud-metadata addresses.

        `password`, `max_clicks`, `one_time` and `require_signature` are the
        four gates a link can put in front of its destination. Each is off
        unless asked for. A gated link pays for its gate on every visit — an
        argon2id verification, or a durable counter write — and an ungated one
        pays nothing, which is why they are per link rather than per instance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Link created
          headers:
            Location:
              schema: { type: string }
              description: The public short URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    get:
      tags: [links]
      operationId: getLink
      summary: Fetch one link
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [links]
      operationId: updateLink
      summary: Edit a link without changing its identity
      description: |
        Partial update: absent fields are untouched. `expires_at` is
        three-valued — absent leaves the expiry alone, an empty string clears
        it, a timestamp sets it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLinkRequest"
      responses:
        "200":
          description: The updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [links]
      operationId: deleteLink
      summary: Soft-delete a link
      description: |
        The link stops redirecting immediately and stays restorable for 30
        days before it is purged. An alias that received traffic is never
        reissued after the purge.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/archive:
    post:
      tags: [links]
      operationId: archiveLink
      summary: Archive a link
      description: Stops redirecting but keeps the alias reserved and the analytics visible.
      parameters:
        - $ref: "#/components/parameters/LinkID"
      responses:
        "200":
          description: The archived link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/restore:
    post:
      tags: [links]
      operationId: restoreLink
      summary: Restore an archived link
      parameters:
        - $ref: "#/components/parameters/LinkID"
      responses:
        "200":
          description: The restored link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/sign:
    post:
      tags: [links]
      operationId: signLink
      summary: Mint a signed URL for a link
      description: |
        Returns a URL carrying an HMAC signature and an expiry. A link with
        `require_signature` set refuses any request that does not carry a valid,
        unexpired one; a link without it is unaffected, and signing such a link
        simply produces a URL that also works unsigned.

        **Format**, so a client can verify one without calling this:

            https://<link host>/<alias>?exp=<unix seconds>&sig=<signature>

        `sig` is the unpadded base64url encoding of HMAC-SHA256 over

            "lc1\n" + <domain uuid> + "\n" + <canonical alias> + "\n" + <exp>

        keyed by the workspace's signing secret. The expiry is inside the MAC, so
        it cannot be extended by editing the URL, and the domain id is inside it
        so a signature minted for one hostname does not verify on another. Both
        parameters are stripped before `forward_query` passes the visitor's query
        on to the destination, so a signature is never handed to whoever runs it.

        The workspace's signing secret is created on the first call and is never
        returned. Requires `links.update`, not `links.read`: a signature is what
        makes a gated link followable, so issuing one is handing out access.
      parameters:
        - $ref: "#/components/parameters/LinkID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl_seconds:
                  type: integer
                  format: int64
                  description: |
                    How long the signature stays valid. Defaults to 86400.
                    Refused above 2592000 (30 days) rather than clamped — a
                    signature is a bearer capability, and one that never expired
                    would be a permanent secret in whatever it was pasted into.
      responses:
        "201":
          description: The signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/rules:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    get:
      tags: [rules]
      operationId: listRoutingRules
      summary: List a link's routing rules
      description: |
        Returned in the order the redirect path evaluates them: ascending
        priority, ties broken by creation order, disabled rules included.

        The response also names the conditions this version supports and the
        one it refuses. Cookies are refused deliberately rather than missing:
        the redirect path sets no cookie and reads none, and a cookie condition
        would mean storing a per-visitor identifier the rest of the product
        does not keep. Twelve conditions ship; the thirteenth has a reason code.
      responses:
        "200":
          description: The link's rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [rules]
      operationId: createRoutingRule
      summary: Add a routing rule to a link
      description: |
        The rule's `url` is judged by every destination tier before the rule
        exists, exactly as the link's own destination is — a rule reached only
        by mobile visitors in one country is still somewhere a browser is sent.

        A rule with no conditions is refused: it would match every visitor and
        short-circuit every rule beneath it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoutingRuleRequest"
      responses:
        "201":
          description: The created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/rules/{ruleID}:
    parameters:
      - $ref: "#/components/parameters/LinkID"
      - $ref: "#/components/parameters/RoutingRuleID"
    patch:
      tags: [rules]
      operationId: updateRoutingRule
      summary: Edit a routing rule
      description: |
        Partial update: absent fields are untouched. `conditions` is replaced
        wholesale when present rather than merged, because merging would make
        removing a condition impossible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoutingRuleRequest"
      responses:
        "200":
          description: The updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [rules]
      operationId: deleteRoutingRule
      summary: Remove a routing rule
      description: Removes the rule and the destination it pointed at.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/split:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    get:
      tags: [split]
      operationId: getLinkSplit
      summary: A link's split test
      description: |
        The whole split rather than a page of arms, because a weighted arm's
        share is a fact about the set: `weight: 40` means nothing until you know
        what the others add up to, so `share` is computed against the enabled
        arms and returned beside it.

        Arms come back in rotation order — the order a sequential split visits
        them and the order the dashboard lists them — with the disabled ones
        included. The fallback, if there is one, is returned separately: it is
        not an arm, it is what stands in for the link's own destination when
        nothing else applies.
      responses:
        "200":
          description: The link's split test, and the kinds this version accepts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [split]
      operationId: createSplitVariant
      summary: Add an arm to a link's split test
      description: |
        The arm's `url` is judged by every destination tier before the arm
        exists, exactly as a routing rule's target and the link's own
        destination are. An arm receiving 5% of the traffic is still somewhere a
        browser is sent.

        **A link's arms are all one kind.** Adding a `sequential` arm to a link
        whose arms are `weighted` is refused with `kind`/`conflict`: "a share of
        the traffic, in rotation" has no meaning, and permitting the mix would
        mean the redirect path carrying a precedence rule for a state nobody
        meant to create. A link has at most one `fallback`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSplitVariantRequest"
      responses:
        "201":
          description: The created arm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitVariant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/split/{variantID}:
    parameters:
      - $ref: "#/components/parameters/LinkID"
      - $ref: "#/components/parameters/SplitVariantID"
    patch:
      tags: [split]
      operationId: updateSplitVariant
      summary: Edit a split-test arm
      description: |
        Partial update: absent fields are untouched. `enabled` is the feature
        flag — a disabled arm receives nothing on the next request and the
        remaining arms re-share its traffic, with nothing deleted and no
        attribution lost.

        `weight` is applied only to a `weighted` arm. Sending it to a sequential
        one is accepted and ignored rather than refused, because the column
        would hold a number the redirect path never reads.

        An arm's `kind` cannot be changed. Switching a running test from
        percentages to a rotation changes what its own history means; remove the
        arms and start a test that is honestly a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSplitVariantRequest"
      responses:
        "200":
          description: The updated arm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitVariant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [split]
      operationId: deleteSplitVariant
      summary: Remove a split-test arm
      description: |
        Removes the arm and the destination it pointed at. Clicks already
        attributed to that destination are kept, and the per-destination
        breakdown reports them as a destination that no longer exists — a
        running test's totals must not change because somebody tidied up.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/stats:
    get:
      tags: [analytics]
      operationId: getLinkStats
      summary: A link's analytics over a date window
      parameters:
        - $ref: "#/components/parameters/LinkID"
        - $ref: "#/components/parameters/FromDay"
        - $ref: "#/components/parameters/ToDay"
      responses:
        "200":
          description: Totals, a day series and per-dimension breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/clicks:
    get:
      tags: [analytics]
      operationId: getLinkClicks
      summary: Recent clicks on a link
      description: |
        The one endpoint that reads raw events rather than rollups; bounded
        and index-backed, so its cost does not grow with history. No addresses
        appear because none are stored.
      parameters:
        - $ref: "#/components/parameters/LinkID"
      responses:
        "200":
          description: The most recent clicks, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecentClick"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats/overview:
    get:
      tags: [analytics]
      operationId: getOverview
      summary: Workspace-wide totals and day series
      parameters:
        - $ref: "#/components/parameters/FromDay"
        - $ref: "#/components/parameters/ToDay"
      responses:
        "200":
          description: The workspace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /domain:
    get:
      tags: [domain]
      operationId: getDomain
      summary: Read the link domain's settings
      description: >
        The hostname short links are served on, and where its root redirects.
        `split_hosts` reports whether the dashboard and short links are on
        separate hosts; the root redirect only applies when they are.
      responses:
        "200":
          description: Domain settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [domain]
      operationId: updateDomain
      summary: Change the link domain's settings
      description: >
        Requires the `domains.write.instance` permission, held by the instance
        principal. This hostname is not any tenant's — it is the one every
        workspace's links are served on until it registers its own — and until
        0.2.0 the guard was `domains.write`, which the owner and admin roles
        hold, so on an instance with more than one organization every owner
        could repoint it. A workspace's own registered hostnames are
        administered through `/domains` and still use `domains.write`.


        Send whichever settings are
        being changed; an omitted field is left alone, and a body with none of
        them is refused with `422`. A body carrying both settings applies them in
        order — root redirect first, then bot blocking — and stops at the first
        refusal, so a rejected URL changes nothing while an accepted one followed
        by a rejected bot pair leaves the URL changed.


        `root_redirect_url` is validated exactly as a link's destination is:
        `http` or `https` only, with private, loopback, link-local, carrier-NAT
        and cloud-metadata addresses refused. An empty string clears it,
        restoring the `404` the root answers by default. It is refused with
        `422` on a single-host deployment, where the root belongs to the
        dashboard.


        `block_bots` refuses automated clients on every link that has not chosen
        for itself; `block_bots_enforced` additionally overrules the ones that
        chose to allow them. Enforcing without blocking is refused with `422`.
        Neither depends on the deployment being split-host. A refused client
        receives a `403` that names nothing, and detection is a user-agent
        heuristic with no bypass — see `bot_blocking` on a link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                root_redirect_url:
                  type: string
                  description: Absolute http(s) URL, or an empty string to clear.
                block_bots:
                  type: boolean
                  description: Refuse automated clients on links that have not chosen for themselves.
                block_bots_enforced:
                  type: boolean
                  description: >
                    Also refuse them on links set to allow. Requires block_bots.
      responses:
        "200":
          description: The updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /domains:
    get:
      tags: [domains]
      operationId: listDomains
      summary: The hostnames this workspace may use
      description: |
        The instance's default domain, whatever this organization owns, and
        whatever this workspace owns. Another workspace's hostname is **absent**
        rather than present and unmanageable — the registration is the only thing
        there is to disclose at this point, and disclosing it would answer "what
        has my neighbour registered".

        `manageable` says whether *this* caller may rename or remove the entry.
        It is a rendering hint for a client drawing controls; every write is
        re-judged on arrival.

        **Nothing registered here is served.** Every entry a workspace registers
        comes back with `verified` false, no router resolves a `Host` header
        against it, and an unrecognized host still gets the operational `404`.
        Proving control of a name and serving links on it arrive in a later
        release.
      responses:
        "200":
          description: Every domain the caller may use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [domains]
      operationId: createDomain
      summary: Register a hostname for this workspace
      description: |
        Requires the `domains.write` permission, and registers the hostname to
        the caller's current workspace.

        **One workspace owns a hostname.** A hostname is exactly one alias
        namespace, so a second registration of the same name — by any workspace
        on the instance — is refused with `hostname`/`conflict` rather than
        shared. The message names the collision and never its owner.

        The hostname is stored as typed, lowercased, with a trailing dot removed.
        A scheme or a path is refused (`hostname`/`not_a_hostname`), as is an IP
        address and a single-label name. Internationalized names are registered
        in their `xn--` form, because that is what DNS and a certificate carry.

        Stored **unverified**: nothing checks that the caller controls the name,
        and nothing is served on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
      responses:
        "201":
          description: The registered domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /domains/{domainID}:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    patch:
      tags: [domains]
      operationId: renameDomain
      summary: Change a registered hostname
      description: |
        The hostname is the only thing a registration has, and changing it is
        possible only because nothing is served on it yet: the domain's links,
        click history and reserved aliases all hang off its id and are untouched
        by the name.

        **Only the owning workspace.** `domains.write` held in another workspace
        buys nothing here: a caller who is not in the owning workspace gets
        `403`, not `404` — they are being told the hostname is not theirs, which
        is the true answer and the one that does not invite guessing.

        The instance's default domain is refused with
        `hostname`/`instance_default`: every workspace's links are on it and it
        is configured by the operator rather than registered here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
      responses:
        "200":
          description: The updated domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [domains]
      operationId: deleteDomain
      summary: Remove a registered hostname
      description: |
        Soft: the row stays, stops being listed, and the hostname becomes free
        for anybody on the instance to register again. Every historic click event
        and every reserved alias still points at the row, which is why it is not
        removed.

        Refused with `hostname`/`in_use` while any link is on the domain — every
        one of them would stop resolving. Refused with
        `hostname`/`instance_default` for the instance's default domain. Another
        workspace's hostname is `403`.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /domains/{domainID}/verify:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    post:
      tags: [domains]
      operationId: verifyDomain
      summary: Check the hostname's DNS challenge now
      description: |
        Reads the TXT record at `_linkctrl-challenge.<hostname>` and compares it
        with the domain's token. On success the hostname starts being served:
        the host router resolves aliases on it, and links may be created there.

        **This is the gate.** Until it passes, a Host header naming the hostname
        gets the operational 404 whoever points DNS at this instance — which is
        what stops a stranger registering somebody's name and serving links on
        it.

        Failure is `422` with `hostname`/`unverified` and a message naming the
        record that is missing or wrong, because that is something the caller
        fixes and retries. A process with no DNS resolver configured answers
        `503`.

        The check also runs on a cadence without anybody asking, and a hostname
        that stops passing it keeps serving for a bounded grace window and then
        stops. Both numbers are operator configuration; see the custom-domain
        runbook in `docs/deployment.md`.
      responses:
        "200":
          description: The domain, now verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "503":
          $ref: "#/components/responses/Unavailable"

  /domains/{domainID}/root-redirect:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    put:
      tags: [domains]
      operationId: setDomainRootRedirect
      summary: Where this hostname's own root sends a visitor
      description: |
        `https://<hostname>/` is a URL somebody will type. Empty is the default
        and answers 404, which says nothing about the instance.

        A `PUT` rather than a `PATCH` because the empty string has to mean
        "remove it", and on a `PATCH` every other field's empty value means
        "unchanged".

        Refused with `root_redirect_url`/`unverified` on a hostname that is not
        verified: nothing is served there, so its root has nowhere to send
        anybody. The destination goes through the same blocking tiers a link's
        does — a root redirect that skipped them would be a cleaner SSRF than the
        one they exist to prevent, because reaching it needs no alias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainRootRedirectRequest"
      responses:
        "200":
          description: The updated domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/qr:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    get:
      tags: [qr]
      operationId: getLinkQR
      summary: What the link's QR code says, and how it is drawn
      description: |
        The JSON view. `GET /links/{id}/qr.svg` beside it is the picture.

        `content` is exactly what the code encodes: the link's short URL with
        `?src=qr` on it. That parameter is what makes a scan countable — a
        camera sends no `Referer`, so without it every scan would arrive
        indistinguishable from somebody typing the URL. It is read by the
        redirect path, attributed through the existing `referrer` breakdown as
        the value `qr`, and is **not** stripped before the query reaches the
        destination.

        Every link has a code. `stored` is false for one whose style has never
        been set, which renders at the default rather than not at all.
      responses:
        "200":
          description: The code, its style, and the levels a style may name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [qr]
      operationId: setLinkQR
      summary: Set how the link's code is drawn
      description: |
        A PUT rather than a PATCH: the style is replaced whole and an omitted
        field means its default, which makes `{"style": {}}` the way back to
        plain black on white.

        A style changes the drawing and never the content. Colours are
        `#rgb` or `#rrggbb` and nothing else — a stored style becomes the
        attributes of an SVG this server generates, so the vocabulary is closed
        rather than passed through.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetQRRequest"
      responses:
        "200":
          description: The code, as it will now be drawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [qr]
      operationId: deleteLinkQR
      summary: Put the link's code back to the default style
      description: |
        Not "delete the QR code" — there is no such thing to delete, because
        every link has one. A link that had no stored style still answers 204:
        "draw this at the default" was already true.
      responses:
        "204":
          description: Back to the default style
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/qr.svg:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    get:
      tags: [qr]
      operationId: getLinkQRSVG
      summary: The link's QR code, drawn
      description: |
        The vector form. `GET /links/{id}/qr.png` beside it is the same picture
        rasterised, and both are drawn from one matrix at one geometry, so they
        describe the same image at the same size.

        The SVG carries explicit pixel `width` and `height` as well as a
        `viewBox`, so *drawn at the set size* is what a browser actually does
        with it rather than something a stylesheet has to arrange.

        The picture paints its own background across the quiet zone rather than
        leaving it transparent. A QR code inverted onto a dark field is refused
        by a large share of scanners, and a transparent one inverts itself the
        moment it is placed on one.

        A path per format rather than content negotiation on `Accept`, because
        an `<img>` and a download both send an `Accept` header nobody chose.
      responses:
        "200":
          description: The code as an SVG document
          content:
            image/svg+xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/qr.png:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    get:
      tags: [qr]
      operationId: getLinkQRPNG
      summary: The link's QR code, as an image file
      description: |
        The raster form, and the one endpoint on this API that rasterises.

        **This is decision D11 reversed, and the reversal keeps its reasoning.**
        D11 said SVG only *because* no image encoder was in the dependency set
        and nothing should rasterise on a request. The encoder is now
        `image/png` from the Go standard library, so the dependency set has not
        moved; and the rasteriser runs only when somebody asks for a file, under
        a stated bound. Output stops at **2000 pixels** — a two-colour paletted
        bitmap, so the largest buffer a request can cause is 4,000,000 bytes —
        and a code whose stored style draws larger than that is refused with a
        `422` rather than drawn.

        Same content as `qr.svg`, same geometry, same caching. The response
        carries `Content-Disposition: attachment`, because a file somebody can
        save is the point of it.
      responses:
        "200":
          description: The code as a PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/qr/logo:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    put:
      tags: [qr]
      operationId: setLinkQRLogo
      summary: Upload the default code's logo
      description: |
        **The link's default code, addressed the way `qr.svg` and `qr.png`
        address it: without a slug.** The default code's identity is that it has
        none — its payload carries no code parameter, which is what every
        picture printed before per-code identity existed carries — so this is
        the shorthand for it rather than a second kind of logo.

        Everything `PUT /links/{id}/qr/codes/{slug}/logo` says applies here
        unchanged: one `multipart/form-data` part named `logo`, `links.update`,
        PNG and JPEG decided by the bytes, an SVG refused by name, the stored
        image re-encoded by this server, the same three bounds, and the same
        separate upload rate limit.

        The response is keyed `qr` rather than `code`, as every other
        `/links/{id}/qr` operation's is.
      requestBody:
        $ref: "#/components/requestBodies/QRLogoUpload"
      responses:
        "200":
          description: The default code, now carrying a logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [qr]
      operationId: deleteLinkQRLogo
      summary: Remove the default code's logo
      description: |
        **The image goes, and the code stays.** Idempotent, and it stays a `204`
        for a link whose default code has never been styled or uploaded to —
        that code has no stored row at all, so "it carries no logo" is already
        true. A link this workspace cannot see is still a `404`.
      responses:
        "204":
          description: The default code carries no logo
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/qr/codes:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    get:
      tags: [qr]
      operationId: listLinkQRCodes
      summary: Every QR code this link carries
      description: |
        A link may carry several codes — a print run and a shop window against
        the same destination — and this is all of them, the default code first.

        **The default code is the one with an empty `slug`.** Its payload
        carries no code parameter at all, which is the payload of every code
        this product drew before per-code identity existed, so it is what every
        already-printed picture of this link resolves to. It cannot be deleted
        and it is addressed through `/links/{id}/qr` rather than here.

        Every link has one whether or not a row holds it, so this list is never
        empty for a link that exists.
      responses:
        "200":
          description: The link's codes, and how many one link may hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCodeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [qr]
      operationId: createLinkQRCode
      summary: Add a named QR code to this link
      description: |
        The new code points at the same link — a code with a destination of its
        own would be a link, and this product already has links. What it buys is
        that a scan of it is told apart from a scan of the others.

        **The slug is generated and cannot be supplied.** It is printed inside
        the picture, so a caller-chosen one would be a name the caller has to
        keep unique across the link's codes and correct across every copy
        already in the world. `style` in the request is accepted for symmetry
        with the PUT below; omitting it starts the code at the style the link is
        already drawing at, so a second poster looks like the first one.

        `422` when the link already holds the maximum number of codes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QRCodeRequest"
      responses:
        "201":
          description: The code, with the slug its payload will carry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleQRCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/qr/codes/{slug}:
    parameters:
      - $ref: "#/components/parameters/LinkID"
      - $ref: "#/components/parameters/QRCodeSlug"
    get:
      tags: [qr]
      operationId: getLinkQRCode
      summary: One of the link's named codes
      responses:
        "200":
          description: The code, its style, and the levels a style may name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleQRCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [qr]
      operationId: setLinkQRCode
      summary: Replace a named code's label and style
      description: |
        A PUT rather than a PATCH, for the reason `PUT /links/{id}/qr` is one:
        the resource is replaced whole and an omitted field means its default.
        That applies to the label as well as to the style — omitting it clears
        the name — because a request that replaces a resource whole and quietly
        preserves one field is a shape nobody can predict.

        The slug is not writable. It is printed, and moving it would break every
        copy of the code already in the world.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QRCodeRequest"
      responses:
        "200":
          description: The code, as it will now be drawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleQRCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [qr]
      operationId: deleteLinkQRCode
      summary: Remove a named code
      description: |
        **What the code already recorded stays in the breakdown.** A scan
        arriving afterwards from a picture printed with this slug is recorded as
        the link's default code, because an unrecognised identity is recorded as
        no code rather than stored — so the removed code's history stops
        accumulating rather than being reassigned, and the rows it already
        earned are still reported, marked `removed`.

        The default code is not reachable here: it has no slug. Putting it back
        to plain black on white is `DELETE /links/{id}/qr`.
      responses:
        "204":
          description: The code is gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /links/{id}/qr/codes/{slug}/logo:
    parameters:
      - $ref: "#/components/parameters/LinkID"
      - $ref: "#/components/parameters/QRCodeSlug"
    put:
      tags: [qr]
      operationId: setLinkQRCodeLogo
      summary: Upload a named code's logo
      description: |
        **One of the two operations in this API that accept a file**, the other
        being the same operation against the link's default code at
        `PUT /links/{id}/qr/logo`. It takes a `multipart/form-data` body
        carrying one part named `logo`, and it is governed by `links.update` —
        the permission that already styles a code, because a logo is style and a
        code is a picture of the link's own URL.

        **PNG and JPEG, decided by the bytes.** Neither the part's filename nor
        its declared `Content-Type` is read: the decoder is chosen by the
        content, so a `.png` holding a JPEG is decoded as a JPEG and a file that
        is neither is refused whatever it is called. **An SVG is refused by
        name** — it is a document that can carry script and fetch other files,
        and accepting one would mean sanitising markup this product then serves.

        **What is stored is a PNG this server encoded**, never the bytes you
        sent. That strips metadata, and it means a polyglot file stops being
        one. Do not expect the response's `has_logo` to imply your exact bytes
        are retrievable — no operation here returns them.

        Three bounds, in this order, and each is a number rather than a promise:
        the request body stops at **1,048,576 bytes**; the image's declared
        dimensions must be at most **1024 pixels a side** and **262,144 pixels
        in total**, checked from the header before anything is decoded; and the
        re-encoded result must fit **1,060,000 bytes**. Exceeding any of them is
        a `422` naming which.

        Uploading again replaces what is there. Uploads are rate-limited
        separately from the rest of this API — see `UPLOAD_RATE_PER_MIN` — so a
        `429` here can arrive while other calls are still being served.
      requestBody:
        $ref: "#/components/requestBodies/QRLogoUpload"
      responses:
        "200":
          description: The code, now carrying a logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleQRCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [qr]
      operationId: deleteLinkQRCodeLogo
      summary: Remove a named code's logo
      description: |
        **The image goes, and the code stays.** The stored bytes are removed
        rather than merely dereferenced, so nothing is left behind for a sweep
        to find.

        Idempotent: a code that carries no logo answers `204` too, because
        "this code has no logo" is already true and reporting `404` would make
        the operation care whether one had ever been uploaded. A slug this link
        never issued is still a `404`.
      responses:
        "204":
          description: The code carries no logo
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/qr/codes/{slug}/image.svg:
    parameters:
      - $ref: "#/components/parameters/LinkID"
      - $ref: "#/components/parameters/QRCodeSlug"
    get:
      tags: [qr]
      operationId: getLinkQRCodeSVG
      summary: A named code, drawn
      description: |
        Everything `GET /links/{id}/qr.svg` says, for one named code. The
        picture differs from the default code's by the slug in its payload,
        which is what a scanner sends back and what makes this code's scans
        distinguishable from the rest.

        The path carries `image.svg` rather than ending in `{slug}.svg` for a
        mechanical reason: a route wildcard matches a whole path segment, so
        `{slug}.svg` is not a pattern that exists.
      responses:
        "200":
          description: The code as an SVG document
          content:
            image/svg+xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /links/{id}/qr/codes/{slug}/image.png:
    parameters:
      - $ref: "#/components/parameters/LinkID"
      - $ref: "#/components/parameters/QRCodeSlug"
    get:
      tags: [qr]
      operationId: getLinkQRCodePNG
      summary: A named code, as an image file
      description: |
        Everything `GET /links/{id}/qr.png` says, for one named code — including
        the 2000-pixel bound and the `422` for a stored style that draws larger.
      responses:
        "200":
          description: The code as a PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: The workspace's campaigns
      description: |
        Unpaginated and bounded instead: a campaign list is a picker as much as
        it is a page, and a picker that paginates is one nobody can choose from.

        `link_count` is the live links carrying the campaign, which has to mean
        the same thing as the number `GET /links?campaign={id}` returns.
      responses:
        "200":
          description: Every campaign in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Create a campaign
      description: |
        The slug is optional and is derived from the name when it is absent. It
        is folded to lowercase letters, digits and hyphens, because it is what a
        `?campaign=` filter names and a slug that does not survive being copied
        out of a browser bar is worth less than one that preserves the spelling.

        Two campaigns in a workspace may not share a slug, case-insensitively.

        **The dates describe the work and enforce nothing.** A link in a
        campaign that has ended still redirects: expiry is a property of the
        link, and a second weaker one on the campaign would give two answers to
        "why did this stop".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: The created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /campaigns/{campaignID}:
    parameters:
      - $ref: "#/components/parameters/CampaignID"
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: One campaign
      description: |
        `link_count` is zero here whatever the campaign holds. The number costs
        a grouped scan and the only caller of this endpoint is an edit form,
        which never shows one; the list is where it is read.
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Edit a campaign
      description: |
        Partial: an omitted field is unchanged. The two schedule bounds are the
        exception a PATCH cannot express on its own — `clear_starts_at` and
        `clear_ends_at` remove a bound, because a decoded `null` is
        indistinguishable from an absent field and guessing wrong either drops a
        schedule nobody asked to drop or refuses to drop one somebody did.

        An empty `slug` regenerates it from the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignRequest"
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [campaigns]
      operationId: deleteCampaign
      summary: Delete a campaign
      description: |
        **The links survive.** Every link carrying the campaign stops carrying
        it, in the same transaction; none is deleted, archived or moved.
        Deleting a label deletes no link.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: The workspace's webhooks
      description: |
        Unpaginated and bounded instead: a workspace registers at most twenty,
        because every enabled one turns each link write into another outbound
        connection.

        **The signing secret is not here.** It is returned exactly twice in this
        API's whole surface — from `POST /webhooks` and from
        `POST /webhooks/{webhookID}/rotate` — and is not stored anywhere it can
        be read back. A client that loses it rotates.

        The response carries the event vocabulary and the signature scheme
        alongside the list, so a client building a subscription editor or a
        receiver discovers both from the API rather than from the docs.
      responses:
        "200":
          description: Every webhook in the workspace, the vocabulary, and the signature scheme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Register a webhook
      description: |
        **The URL is judged by every destination tier before the row exists**,
        exactly as a link's destination is: the scheme allowlist, the private and
        obfuscated address refusals that cannot be switched off, the instance's
        blocklist, the heuristics, and the opt-in reputation feed if one is
        configured. A refusal is recorded as `destination.blocked` in the audit
        log, like any other.

        That check is necessary and not sufficient, and the difference is the
        point of this endpoint. A hostname that resolves publicly now can resolve
        to a private address by the time delivery happens, so **the address is
        checked again at the moment the connection is opened**, and no redirect
        is followed at all. See `docs/SECURITY.md`.

        The response is the only place the signing secret ever appears.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: The registered webhook, with its signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /webhooks/{webhookID}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      tags: [webhooks]
      operationId: getWebhook
      summary: One webhook
      responses:
        "200":
          description: The webhook, without its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Edit a webhook
      description: |
        Partial: an omitted field is unchanged. `events` is the exception worth
        naming — an empty array is a real request to subscribe to nothing, and it
        is refused with a message rather than stored, because a webhook
        subscribed to nothing is a URL this server would never call.

        A changed `url` goes through the full tier check again. A URL that was
        acceptable when it was registered and has since been blocked does not
        survive an edit that happened to change something else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: The webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Remove a webhook
      description: |
        The delivery log goes with it. A registration that has been removed and a
        log that still names it would be a record of where events *used to* go,
        which is a different and less useful thing than a record of where they go.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/{webhookID}/rotate:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Mint a new signing secret
      description: |
        **There is no overlap window.** The previous secret stops verifying
        immediately, because two valid secrets at once means a receiver that has
        been compromised keeps verifying for as long as the window lasts — the
        opposite of what somebody rotating a leaked secret wants. Update the
        receiver promptly; `webhook.secret_rotated` is in the audit log so the
        moment verification changed is findable.

        A POST because it mints a credential and returns it in the body. A GET
        that did that would be one a browser could be made to fetch.
      responses:
        "200":
          description: The webhook, with its new signing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/{webhookID}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        description: How many attempts to return, newest first.
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: One webhook's recent delivery attempts
      description: |
        A log, not a list: the recent rows are the interesting ones, and the
        window is bounded by `WEBHOOK_RETENTION_DAYS` on the instance.

        **The payload is not returned.** It is the event body the receiver was
        already sent, and returning it would make this endpoint a way to read
        every link change in the workspace through a permission granted for
        managing integrations.

        `response_code` is null when there was no response at all — a refused
        connection, a timeout, or this instance declining to open the socket
        because the name resolved to a private address.
      responses:
        "200":
          description: The recent attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /automation:
    get:
      tags: [automation]
      operationId: listAutomationRules
      summary: The workspace's automation rules
      description: |
        Unpaginated and bounded instead: a workspace holds at most twenty rules,
        because every enabled one is work the scheduler does on every tick.

        The response carries the trigger and action vocabularies alongside the
        list, so a client building a rule editor discovers what it may write from
        the API rather than from the docs — and it carries the **evaluation
        bounds**, which is what makes "why has my rule not fired yet" answerable
        without reading the source: how often the scheduler looks, how many rules
        one run considers, and how many subjects one rule handles per run.

        `last_fired_at` is a watermark rather than a diagnostic. A rule sees only
        subjects whose event time is after it, and it is set when the rule is
        created and when a paused rule is resumed — so a rule that has never
        matched anything and one that fired a moment ago carry the same kind of
        value.
      responses:
        "200":
          description: Every rule in the workspace, the vocabularies, and the evaluation bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [automation]
      operationId: createAutomationRule
      summary: Create an automation rule
      description: |
        **The rule is armed at creation.** It acts on what happens from this
        instant on, never on what already happened — a rule created this
        afternoon does not fire for every link that expired last year.

        `archive_link` is refused on `destination.blocked`, which has no link to
        archive. It is refused at write time rather than skipped at evaluation
        time, because a rule that saves and then never does what it says is worse
        than one that will not save.

        There is deliberately **no `disable` action**. `archived` and `disabled`
        produce the identical outcome on the redirect path, and `disabled` has no
        restore affordance — an automation writing it would create links in a
        state the dashboard offers no way out of.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationRuleRequest"
      responses:
        "201":
          description: The rule, armed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /automation/{automationID}:
    parameters:
      - $ref: "#/components/parameters/AutomationID"
    get:
      tags: [automation]
      operationId: getAutomationRule
      summary: One automation rule
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [automation]
      operationId: updateAutomationRule
      summary: Edit an automation rule
      description: |
        Partial: an omitted field is unchanged. The whole rule is re-validated
        rather than only what changed, because an action list that was legal
        against the old trigger can be illegal against the new one.

        **Switching `enabled` from false to true re-arms the rule** — the
        watermark moves to the current instant — so a rule paused for a month does
        not fire for a month of backlog the moment somebody resumes it. Switching
        it off leaves the watermark alone, because a disabled rule is not
        evaluated and the value is what a reader is shown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationRuleRequest"
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [automation]
      operationId: deleteAutomationRule
      summary: Remove an automation rule
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /folders:
    get:
      tags: [folders]
      operationId: listFolders
      summary: The workspace's folder tree
      description: |
        One flat, ordered list rather than nested objects. Depth-first — a
        folder is immediately followed by its descendants — with `depth` on each
        entry, which is what both consumers want: a client drawing the tree
        loops, and a client rebuilding the nesting has `parent_id`. Nested JSON
        would make the common case a recursive walk and would make the response
        shape depend on how deep somebody's folders happen to be.

        `link_count` is the links filed **directly** in the folder, never its
        descendants'. It has to mean the same thing as the number of links
        `GET /links?folder={id}` returns.
      responses:
        "200":
          description: Every folder in the workspace, and the depth cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [folders]
      operationId: createFolder
      summary: Create a folder
      description: |
        Two folders in the same place may not share a name, case-insensitively,
        and the tree may not go deeper than `max_depth`. Both are refused with
        422 rather than silently adjusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: The created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /folders/{folderID}:
    parameters:
      - $ref: "#/components/parameters/FolderID"
    patch:
      tags: [folders]
      operationId: updateFolder
      summary: Rename a folder
      description: |
        Renames only. Moving is `POST /folders/{folderID}/move`, and the split is
        deliberate: a move is the one folder operation that can make the tree
        stop being a tree, and `parent_id` is the one field whose null is a
        value — "the top level" — rather than "leave it alone", which is what a
        null means everywhere else on this API.

        The links in the folder do not move and are not touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
      responses:
        "200":
          description: The renamed folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [folders]
      operationId: deleteFolder
      summary: Delete a folder and the folders inside it
      description: |
        **The links survive.** Every link filed anywhere in the deleted branch
        becomes unfiled — `folder_id` goes to null — and nothing is removed from
        the link list. Losing links because a container was deleted is the
        failure this behaviour exists to prevent, and it is enforced by the
        schema rather than by this handler.

        The folders *inside* the one being deleted go with it. There is no
        undo: a folder holds no data of its own, so what is lost is a name and a
        shape.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /folders/{folderID}/move:
    parameters:
      - $ref: "#/components/parameters/FolderID"
    post:
      tags: [folders]
      operationId: moveFolder
      summary: Move a folder, and everything inside it
      description: |
        `parent_id` is required and explicitly nullable: null is the top level,
        and is the only way to get a folder back out of another one.

        **A folder can never become its own descendant.** Moving one into itself
        or into any folder inside it is refused with `parent_id`/`cycle` — the
        branch would stop being reachable from the top level, taking every link
        in it out of the tree.

        Two further refusals: the move may not push any part of the moved branch
        past `max_depth` (`parent_id`/`too_deep`), and the destination may not
        already hold a folder of the same name (`parent_id`/`conflict`). Moving a
        folder to where it already is succeeds and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderRequest"
      responses:
        "200":
          description: The moved folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: List the workspace's tags with usage counts
      responses:
        "200":
          description: All tags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tags/{id}:
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: Delete a tag, detaching it from every link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api-keys:
    get:
      tags: [api-keys]
      operationId: listAPIKeys
      summary: List your own API keys
      description: |
        Requires an interactive session. Revoked keys stay listed until a
        reaper removes them, because "which keys existed" is the question
        asked after an incident. The secret is never listed — only its hash
        is stored.

        **Every key you own, from every organization** (0.3.0). It used to be
        scoped to the organization you were acting in while revoking was scoped
        to you alone, and the two disagreeing was a weak existence oracle: a key
        invisible here still answered `204` to a `DELETE`. They ask the same
        question now — whose key is this — and an account-wide key has no
        organization to be filtered by. `organization_id` on each row is what
        tells them apart.
      responses:
        "200":
          description: Your keys, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [api-keys]
      operationId: createAPIKey
      summary: Mint an API key
      description: |
        Requires an interactive session — a key cannot mint keys, or revoking
        a leaked one would be meaningless. Scopes must be permissions you
        yourself hold; key management and organization deletion are never
        grantable. The response is the only time the token is shown.

        The key is bound to the workspace you are acting in unless you ask for
        `org_wide`, which leaves it unpinned — one workspace still resolved per
        request, the way a sign-in does — and needs an organization-wide
        membership to grant.

        An unpinned key is **account-wide** unless you also send
        `organization_id` (0.3.0): it belongs to your account and reaches the
        organizations your account belongs to, the way a personal access token
        does, rather than to the tenant you happened to be in when you minted it.
        Pin it if you want today's memberships frozen — that choice is
        irreversible, and it is the only one on this operation that is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: The key, including the token that will never be shown again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /api-keys/rotate:
    post:
      tags: [api-keys]
      operationId: rotateAPIKey
      summary: Replace the key that made this request
      description: |
        **Send this with an API key, not a session.** Rotation is a key
        replacing itself, which is the one key operation that needs no human:
        the credential in the `Authorization` header is the one being rotated,
        and there is no id to name. A session gets `403` — a session that wants
        another key mints one.

        The successor is *identical or narrower*: scopes are this key's, or a
        subset you name; the workspace binding is copied verbatim and cannot be
        changed; the reach is this key's, or `reach: organization` to pin an
        account-wide key to the organization this request resolved into; nothing
        widens. A pinned key asking for `reach: account` is refused. That second
        axis arrived with account-wide keys in 0.3.0 and is the same rule applied
        to tenancy. `apikeys.write` is still not a scope any key may hold, and
        that is what makes handing rotation to a credential safe.

        This key keeps working for `grace_seconds` and then stops, on every
        replica, whether or not the housekeeping job that writes its revocation
        has run. **A key rotates once**: asking again returns `409`.

        The accepted trade is stated rather than buried. Whoever holds a leaked
        secret can rotate it, so a leaked key can persist across rotations under
        a prefix its owner never issued. Every generation appears in the owner's
        key list and in the audit log, and each predecessor's window is bounded,
        which is what keeps that finite rather than permanent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateAPIKeyRequest"
      responses:
        "201":
          description: The successor, its token, and when this key stops working
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedAPIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A session tried to rotate. Only a key rotates, and only itself.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: This key already has a successor. A key rotates once.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"

  /api-keys/{id}:
    delete:
      tags: [api-keys]
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: |
        Takes effect on the key's next request; nothing about keys is cached.

        Your own key, or — holding `apikeys.write` from an organization-wide
        membership — any key issued into your organization, which is how an
        administrator stops a credential whose owner will not. Revoking
        somebody else's writes an `apikey.revoked` audit record; revoking your
        own does not, because you are the record.

        **Somebody else's account-wide key is narrowed, not destroyed** (0.3.0).
        Such a key belongs to an account that also acts in tenants you hold no
        authority over, so what this endpoint cuts is your organization out of
        its reach: the key stops resolving here and keeps working elsewhere, and
        the record is `apikey.reach_revoked` rather than `apikey.revoked`. You do
        not choose between the two — which happens is a property of the key, and
        offering the choice would be offering an outright revoke you may not
        have. Your own account-wide key is still revoked outright, because it is
        yours.

        A key you may not act on returns 404, not 403, so ids cannot be probed.
        An account-wide key whose owner holds no organization-wide membership in
        your organization answers the same way, because it does not reach you.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /audit:
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: Read the audit log, newest first
      description: |
        Records of administrative changes across the caller's organization:
        what changed, who changed it, and from which network.

        **Requires a session, not an API key.** `audit.read` is not delegable,
        so a bearer token can never hold it and this operation answers `403`
        for one however it was scoped. The log is the one place a network
        prefix is tied to a named person, and a token in a CI variable is the
        wrong custodian for that.

        Actors are stored as a snapshot taken when the event was written, so a
        record stays readable after the account it names is deleted. Since 0.3.0
        that is a lifecycle rather than a hypothetical: `DELETE /account` exists,
        and an hourly pass replaces the snapshot of an erased actor with the
        fixed label `deleted account`.

        `actor_id` is the acting user and it is **never cleared**, erasure
        included. It is absent only on records written by something that is not
        a person, such as the domain-verification job. That is deliberate and it
        is what makes an erased actor's entries still correlate with each other:
        the label is a constant, so it distinguishes nobody, and the id is the
        only thing that tells one erased actor from another. The id identifies
        nobody from inside this instance once the account is erased — see
        `docs/SECURITY.md` for what that does and does not claim.

        Addresses are never recorded. `ip_prefix` is a network — `/24` for
        IPv4, `/48` for IPv6 — which is enough to tell "the usual office" from
        "somewhere else" and not enough to identify a person.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque, from `next_cursor` of the previous page.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Page size; out-of-range values fall back to the server default.
      responses:
        "200":
          description: One page of audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /instance/reviewers:
    get:
      tags: [instance]
      operationId: listInstanceReviewers
      summary: Who reviews this instance's disputed destinations
      description: |
        The accounts holding instance-level review: they read the dispute queue
        and decide what is in it, across every organization on the instance.

        **Requires `instance.admin`**, which is the instance-level principal —
        the account that claimed the instance through `/auth/setup`. A reviewer
        it appointed cannot read this list: who else administers the instance is
        the principal's business, and a reviewer needs the queue rather than the
        roster.

        Not delegable to an API key.
      responses:
        "200":
          description: The reviewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstanceReviewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [instance]
      operationId: grantInstanceReviewer
      summary: Appoint an account to review disputed destinations
      description: |
        Confers `destinations.review` and `destinations.decide` on an existing
        account, instance-wide. It grants nothing inside any organization, and
        the account keeps every organization permission it already had.

        **There is no scope field, and that is the design.** What a grant
        confers is fixed; a caller who could name the scopes could name
        `instance.admin`, and a reviewer who could appoint the next reviewer
        would defeat the bound this operation exists under. Only the principal
        delegates, and what it delegates cannot delegate further.

        Idempotent: appointing somebody who already holds it answers `200` and
        changes nothing. `422` with `unknown` means no account on this instance
        has that address.

        Recorded as an **instance-wide** audit event, readable at
        `/instance/audit`.

        Requires `instance.admin`. Not delegable to an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  description: The address of an account on this instance.
      responses:
        "200":
          description: The reviewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceReviewer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /instance/reviewers/{id}:
    delete:
      tags: [instance]
      operationId: revokeInstanceReviewer
      summary: Withdraw instance-level review from an account
      description: |
        Removes both halves of the dispute permission. The account keeps
        everything its own organization gives it.

        **It cannot reach `instance.admin`.** Only what this surface confers can
        be withdrawn through it, so the instance can never be left with nobody
        able to appoint anybody — which would strand the dispute queue exactly
        as it was stranded before the principal existed.

        `404` means the account holds no instance-level review.

        Requires `instance.admin`. Not delegable to an API key.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The account to withdraw it from.
      responses:
        "204":
          description: Withdrawn
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /instance/audit:
    get:
      tags: [instance]
      operationId: listInstanceAuditLog
      summary: The audit log of acts that belong to no organization
      description: |
        Records of changes made **to the instance** rather than inside a tenant:
        the default domain's root redirect and bot policy, every dispute
        decision, and every change to who reviews them. All of these govern
        every organization on the instance, so they are recorded against none of
        them.

        They used to be filed under whichever organization the person happened
        to be acting in, which named a tenant with no claim to the change and
        hid it from every tenant it changed. `/audit` therefore no longer
        returns them, and this is where they went.

        **Requires `audit.read.instance`**, held by the instance principal
        alone — not by reviewers it appointed. Not delegable to an API key, for
        `audit.read`'s reason: these are the same columns carrying the same
        network prefixes tied to the same named actors.

        Same page shape and cursor vocabulary as `/audit`, and a separate
        ordering: a cursor from one names a position in the other's result set
        and must not be passed across.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque, from `next_cursor` of the previous page.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Page size; out-of-range values fall back to the server default.
      responses:
        "200":
          description: One page of instance-wide audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /feeds:
    get:
      tags: [feeds]
      operationId: getFeedDisclosure
      summary: What happens to the destinations you submit
      description: |
        Every blocking decision LinkCtrl makes is local by default: a host list
        compiled into the binary, a list held in this instance's own database,
        and rules that read a URL's own text. A destination can nevertheless
        leave, by **two** channels, and this operation answers for both.

        **The reputation feed is the operator's**, instance-wide, and unset in
        the shipped default. Switching it on means the destination you submit is
        sent to somebody else's server for a check — a deliberate exception to
        this product's promise that no destination leaves the box uninvited.

        **Webhooks are your workspace's**, and no operator setting turns them
        off. An owner or administrator there registers a URL of their own
        choosing, and the workspace's link events are posted to it carrying the
        destination — as typed for the five lifecycle events, defanged for a
        refusal. `webhooks.receiving` is whether that is happening in the
        workspace this credential acts in. It says nothing about any other
        workspace, and `enabled` says nothing about this one.

        It is the same disclosure the dashboard shows at `/feeds`, available to
        anyone with a credential because what it describes is what happens to
        their own data — including a credential holding no webhook scope, which
        is why the answer carries a count and never an address.

        **There is no write counterpart and there will not be one.** A feed is
        switched on by the operator, in this instance's configuration, and
        restarting it — no request to this API and nothing in the dashboard can
        change it. See decision D40. A webhook is registered through
        `/webhooks`, which is a different operation with a different permission.
      responses:
        "200":
          description: What leaves this workspace, and by which channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedDisclosure"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /disputes:
    post:
      tags: [disputes]
      operationId: fileDispute
      summary: Ask for a refused destination to be reviewed
      description: |
        Files a dispute about a destination this instance refused, and puts it
        in front of whoever holds `destinations.review` — the instance-level
        reviewers, who are named people rather than a role.

        **Only a low-confidence refusal can be disputed.** The tier is
        re-derived from the URL on the server, by the same evaluator that
        refused the link, so there is no field here that names a refusal, a
        tier, or a reason code — and therefore no way to claim one. Two kinds
        of refusal have no appeal path at all and answer `422` with
        `not_disputable`:

        * **Unappealable** — private, loopback, link-local and cloud-metadata
          addresses, and non-`http(s)` schemes. These protect the instance from
          being used as an SSRF proxy, and the party they protect is not the
          party appealing.
        * **High confidence** — the curated list compiled into the binary.
          Overruling it is meant to cost a rebuild, which a click is not.

        A destination nothing refuses answers `422` with `not_blocked`.

        `409` means the decision this would ask for is already queued. Two
        things produce it: an open dispute about the same host, and an open
        dispute about the same **blocklist entry** — so once somebody has
        appealed the row that says `evil.example`, `login.evil.example` and
        `mail.evil.example` are the same appeal and are refused as duplicates
        rather than filed again. A refusal with no row behind it is bounded by
        the host alone, because there is nothing else to count.

        Requires `links.create`: a dispute is the second half of an attempt the
        caller was already allowed to make, so it needs no grant of its own.

        **Nothing fetches the URL.** Not here, not in the queue, not ever. No
        preview, no screenshot, no liveness check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  description: The destination that was refused, as it was typed.
      responses:
        "201":
          description: The dispute, waiting for a decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"

    get:
      tags: [disputes]
      operationId: listDisputes
      summary: The review queue, newest first
      description: |
        Every dispute on the instance, not only those filed in the caller's own
        organization. The blocklist a decision acts on is instance-wide, so a
        queue scoped narrower would hide rows the same reader is nonetheless
        deciding for. `destinations.review` is what bounds who sees it, and it
        is held **instance-wide by named people** — no organization role carries
        it. The account that claimed the instance holds it, and may confer it on
        others through `/instance/reviewers`.

        **An API key may read this.** `destinations.review` is delegable: the
        queue discloses who filed a dispute and a defanged host, never an
        address or a network prefix, and reading it widens nobody's reach. The
        deciding half is a separate permission and is not delegable — see
        `/disputes/{id}/allow`.

        **Every destination in the response is defanged**, in `host_defanged`
        and `destination_defanged`. The scheme delimiter and every dot are
        bracketed and everything outside a narrow safe set is percent-escaped,
        so nothing here auto-links and nothing here is live markup. That is the
        stored form, not a rendering: a client cannot obtain the original from
        this API.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque, from `next_cursor` of the previous page.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: Page size; out-of-range values fall back to the server default.
        - name: open
          in: query
          schema: { type: boolean }
          description: "`true` returns only disputes nobody has decided yet."
      responses:
        "200":
          description: One page of disputes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /disputes/{id}/allow:
    post:
      tags: [disputes]
      operationId: allowDispute
      summary: Lift the blocklist entry that refused the destination
      description: |
        Deletes one row from the runtime low-confidence blocklist and closes the
        dispute as `allowed`. The person who filed it is notified in-app, and
        the decision is an audit event — an **instance-wide** one, recorded
        against no organization, because what it changes belongs to no
        organization. Read it at `/instance/audit`.

        **Requires `destinations.decide`, and a session rather than an API
        key.** That permission is not delegable: allowing a destination deletes
        a blocklist entry, after which the key that deleted it may point links
        there — a credential widening its own reach. This operation exists for a
        key, is documented for a key, and answers `403` to one however it was
        scoped; reading the queue is a separate permission and stays delegable.

        **The row it deletes is `blocked_host_defanged`, not
        `host_defanged`**, and the two differ whenever somebody was refused by
        a subdomain of a listed entry. It is fixed when the dispute is filed, so
        a more specific entry added in the meantime cannot retarget a decision
        you made about the entry you were shown.

        **It reaches the runtime list and nothing else.** The curated list is a
        compiled file and the unappealable refusals have no row anywhere, so
        there is no other entry this could remove — and there is no row anybody
        can add that makes a destination acceptable.

        Answers `409` rather than pretending to succeed when:

        * the refusal is `low_confidence.punycode_homograph` or
          `low_confidence.url_credentials`, which are computed from the URL
          every time it is judged and hold no row to delete. Such a dispute
          reports `liftable: false`;
        * the entry came from `LINKCTRL_DESTINATION_BLOCKLIST`, which boot
          reconciles back into the table — removing it here would revert at the
          next restart;
        * the dispute has already been decided.
      parameters:
        - $ref: "#/components/parameters/DisputeID"
      responses:
        "200":
          description: The decided dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /disputes/{id}/uphold:
    post:
      tags: [disputes]
      operationId: upholdDispute
      summary: Leave the refusal standing
      description: |
        Closes the dispute as `upheld`, changing no list. Available for every
        open dispute, including the ones `allow` cannot act on.

        **Requires `destinations.decide`, and a session rather than an API
        key**, for the reason `allow` gives: the two decisions are one
        permission, and a queue where a key could uphold but not allow would be
        a queue a key could empty.

        Still an audit event: "somebody looked and said no" is a different fact
        from "nobody has looked yet", and a log that recorded only the decisions
        which changed something could not tell them apart.
      parameters:
        - $ref: "#/components/parameters/DisputeID"
      responses:
        "200":
          description: The decided dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /invitations:
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Invite somebody into your organization
      description: |
        Issues a single-use, revocable, expiring grant of one membership.

        **The link is in this response and nowhere else.** Only a hash of the
        token is stored, exactly as for a session or an API key, so a lost link
        is re-issued by revoking and inviting again rather than recovered.

        **It is bound to the address it names.** Redemption compares the
        redeeming account's address against this one, so forwarding the link
        does not let somebody else join. That is what makes a copyable link
        safe to copy.

        **The role is capped at your own rank.** `owner` outranks `admin`
        outranks `editor` outranks `viewer`; asking for one above yours answers
        `403`. Omitting `role` invites at `viewer`, so a caller that did not
        think about it admits the least.

        **Issued with an API key, it is capped at `editor`** — `admin` and
        `owner` answer `403` whatever rank created the key. Redeeming produces
        an interactive account rather than a credential, and revoking the key
        does not revoke it.

        `emailed` is `false` on an instance with no SMTP relay configured. That
        is the default and not a failure — the link in this response is then the
        whole delivery mechanism.

        Requires `members.write`, which **is** delegable to an API key: a key
        may bring collaborators in, and the `editor` cap above is what keeps it
        from handing out more than a key may itself hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: The invitation, with the only copy of its link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

    get:
      tags: [invitations]
      operationId: listInvitations
      summary: The organization's invitations, newest first
      description: |
        Every invitation ever issued for this organization, including the ones
        that were revoked, expired or accepted — `status` tells them apart, and
        it is derived from the clock rather than stored, so an invitation that
        lapsed a second ago reads `expired` without a job having touched it.

        No token is returned. Only its hash is stored.

        Not paginated: an organization's invitations are a handful of rows by
        construction. Requires `members.write`.
      responses:
        "200":
          description: Every invitation for the caller's organization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /invitations/redeem:
    post:
      tags: [invitations]
      operationId: redeemInvitation
      summary: Accept an invitation
      description: |
        The one operation here that takes no credential — it is how somebody
        who has none acquires one. It carries the same tight per-address limit
        as sign-in, and shares that budget with `POST /auth/login`.

        `email` must be the address the invitation was issued to. If an account
        exists there, `password` authenticates it and the membership is added to
        it. If none exists, the account is created — unless
        `LINKCTRL_SIGNUP_MODE` is `closed`, where **no invitation creates an
        account** and only an existing one can join.

        Redemption creates a membership and nothing else: no personal
        organization and no workspace of your own. The account is otherwise
        ordinary, and can be granted the ability to own an organization later
        without needing a second one.

        **Every failure is the same `404`.** Unknown token, expired, revoked,
        already used, wrong address, wrong password, already a member, or an
        address with no account on a closed instance — one status, one body, and
        the same work spent on each. Anything else would answer "does this
        address have an account". The two `422`s are about the values you sent
        and disclose nothing: an address that is not an address, and a password
        below the twelve-character floor.

        No session is started. Call `POST /auth/login` with the same
        credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemInvitationRequest"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemedInvitation"
        "404":
          description: |
            The invitation cannot be redeemed. Deliberately indistinguishable
            from every other reason it could not be.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /invitations/{id}:
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: |
        The link stops working immediately.

        An invitation belonging to another organization answers `404`, the same
        as one that never existed, so ids cannot be probed. So does one that was
        already revoked or already accepted — an accepted invitation produced a
        member, and reporting "revoked" for it would claim something that did
        not happen. Removing a member is a different operation, and not one this
        version has.

        Requires `members.write`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: Everybody in your organization
      description: |
        One entry per **membership**, not per person. Somebody may hold an
        organization-wide membership and a workspace-scoped one at the same
        time, and under the union rule those add — so they appear twice, and
        collapsing them would hide the second grant behind the first.

        `workspace_id` absent means the membership covers every workspace in the
        organization, which is what registering and accepting an invitation both
        create. Present means it covers exactly that workspace, on top of
        whatever else the person holds.

        `manageable` is computed against *you*: it is true when you may re-role
        or remove that membership. Your own row is never manageable unless you
        are an owner, because the rule is "strictly below your own rank" and
        nobody is strictly below themselves.

        It is answered per row against the membership of yours whose scope
        covers that row, not against the role you resolve to where you are
        standing. A membership with no `workspace_id` is reachable only from a
        membership of your own with no `workspace_id`, so holding `admin` in one
        workspace lets you manage that workspace's memberships and none of the
        organization-wide ones — including your own.

        Not paginated: an organization's membership is a handful of rows by
        construction. Requires `members.read`, which owners and admins hold.
      responses:
        "200":
          description: Every membership in the caller's organization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [members]
      operationId: grantWorkspaceAccess
      summary: Give a member a role in one workspace
      description: |
        **This adds access and never narrows it.** Permissions resolve as the
        union of every membership matching a workspace, and the effective role
        is the lowest rank among them — so an organization-wide editor granted
        `admin` here is an admin in that workspace and an editor everywhere
        else. There is no operation that restricts somebody to a workspace, and
        this is not it.

        `members.write` is required **in the workspace named by
        `workspace_id`**, not merely somewhere in the organization — the same
        question renaming or deleting a workspace asks for `workspace.write`.
        So a workspace-scoped admin grants access in their own workspace and
        nowhere else, and cannot grant themselves into a second one.

        The person must already be a member of the organization — by **any**
        membership, organization-wide or scoped to a single workspace. Somebody
        with no membership at all is invited rather than granted, because a
        grant is not a way into an organization.

        This said an organization-wide membership was required, until 0.3.0. It
        never was: `GetOrganizationMember` admits either and orders
        `workspace_id NULLS FIRST` only to pick a label, and the service says so
        in as many words. An integrator reading the old sentence would have
        built a precondition this product does not have.

        The role is capped at your own rank, exactly as an invitation's is.
        Requires `members.write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantWorkspaceAccessRequest"
      responses:
        "201":
          description: The workspace-scoped membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /members/{id}:
    patch:
      tags: [members]
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        Two different bounds apply, and a `403` may mean either.

        **You may only manage ranks strictly below your own.** An admin re-roles
        editors and viewers, never another admin and never themselves — self is
        not strictly below self, so an admin who wants out asks an owner. Owners
        are the single exception: an owner may re-role any member including
        another owner, because an owner already holds everything and there is no
        escalation left to prevent.

        **You may not grant a role above your own.** An admin may promote an
        editor to admin — the same ceiling an invitation carries — and will then
        find they can no longer manage them, which follows from the first rule
        rather than contradicting it.

        Demoting the organization's last owner answers `409`. Requires
        `members.write`.
      parameters:
        - name: id
          in: path
          required: true
          description: The **membership** id, from `GET /members`.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/RoleSlug"
      responses:
        "204":
          description: Role changed, or already that role
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Refused because it would leave the organization without an owner.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Validation"

    delete:
      tags: [members]
      operationId: removeMember
      summary: End a membership
      description: |
        The membership, not the account. Their user row, their password and
        every other membership they hold survive, which is what makes this
        reversible by inviting them back rather than by restoring a backup.
        Links they created stay in the workspace.

        Removing a workspace-scoped membership withdraws the access that row
        added and leaves the organization-wide one alone.

        The same rank bound as re-roling applies, and removing the last owner
        answers `409`. Requires `members.write`.
      parameters:
        - name: id
          in: path
          required: true
          description: The **membership** id, from `GET /members`.
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Refused because it would leave the organization without an owner.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /organizations:
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an organization
      description: |
        Provisions the organization, its first workspace and an owner membership
        for you, in one transaction — the same path registration takes for the
        personal organization every account starts with, so an organization
        never exists without somewhere to work or somebody to own it.

        You become the owner. It is not settable: an organization created on
        somebody else's behalf is one nobody asked for.

        Requires `orgs.create`, which is granted to the `owner` role. On a
        default instance — closed signup, everybody else arriving by invitation —
        that means the account from the setup form and nobody else until an owner
        grants somebody the owner role.

        Your session is not moved. Call `POST /workspaces/{id}/switch` with the
        `workspace_id` in this response to start working in it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "201":
          description: The organization, and the workspace it was provisioned with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /organizations/{id}:
    delete:
      tags: [organizations]
      operationId: deleteOrganization
      summary: Delete the organization you are acting in
      description: |
        Removes the organization and everything the schema hangs off it: every
        workspace, every membership, every outstanding invitation, and every API
        key issued in it. **There is no soft delete, no restore and no export**,
        and one transaction does the whole thing — a partially deleted
        organization would leave members resolving into workspaces that no longer
        exist.

        `id` must be the organization you are currently acting in. Any other id
        is `404`, the same answer one that never existed gets, so an id cannot be
        probed and a mistyped one deletes nothing. To delete a different
        organization, switch into it first.

        **Refused while any of its workspaces holds a link**, archived ones
        included, and the links must be deleted first. This mirrors the same
        refusal on `DELETE /workspaces/{id}`: an organization-level cascade
        through those links would make the workspace-level rule bypassable by
        deleting one level up. There is no bulk delete, so emptying a large
        organization is a link at a time.

        **Also refused when it is the only organization on the instance.** An
        instance without one cannot be used or repaired from the dashboard.

        **Members left belonging to nothing are not a refusal.** Their accounts
        survive with no membership, and they are asked to create an organization
        of their own the next time they sign in.

        The audit trail survives: `organization.deleted` is recorded, carrying
        the name and slug of what was removed, and every earlier record this
        organization wrote stays in the table.

        Requires `org.delete`, held by the `owner` role alone. It is **not
        delegable to an API key** — an irreversible action belongs behind an
        interactive sign-in — so a bearer token never holds it and this endpoint
        answers a session.
      parameters:
        - name: id
          in: path
          required: true
          description: The organization you are acting in.
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Refused: the organization still holds links, or it is the instance's
            only one. `detail` says which.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Your own notifications, newest first
      description: |
        Always your own inbox. There is no permission for reading somebody
        else's, because there is no reason to have one — the query is scoped by
        user, not filtered afterwards.

        There is deliberately no endpoint that *creates* a notification. A
        notification records something the system observed; an API that could
        post one would make the inbox a thing callers assert into.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque, from `next_cursor` of the previous page.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: unread
          in: query
          schema: { type: boolean }
          description: "`true` returns only unread notifications."
      responses:
        "200":
          description: One page of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /notifications/unread:
    get:
      tags: [notifications]
      operationId: countUnreadNotifications
      summary: How many are unread
      description: |
        Separate from the list so a client polling the badge does not pay for a
        page of rows it will not render.
      responses:
        "200":
          description: The unread count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unread]
                properties:
                  unread: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/read:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark every notification read
      responses:
        "200":
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [marked_read]
                properties:
                  marked_read: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one notification read
      description: |
        Idempotent, and `read_at` is only ever set once, so "when did you first
        see this" survives a double click. Someone else's id is indistinguishable
        from one that does not exist — both answer `204` — so ids cannot be
        probed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Marked read (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [notifications]
      operationId: markNotificationUnread
      summary: Put one notification back in the unread list
      description: |
        The undo for the line above, and for the click-through the dashboard
        performs: opening a notification marks it read on the way past, so
        having read one by accident is a common state rather than a rare one.

        `read_at` is set back to `NULL`, which is what unread has always meant —
        no schema change, and no separate "unread" flag to disagree with the
        timestamp. The first-seen timestamp is discarded, deliberately, by the
        person it belongs to; `POST` deliberately never overwrites one, and this
        is the only way to lose it.

        Idempotent, and someone else's id is indistinguishable from one that
        does not exist — both answer `204`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Marked unread (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: The workspaces you may act in
      description: |
        Your own memberships, so there is no permission for it — the same
        reasoning as the notification inbox.

        **An API key sees the organizations it reaches, and no more** (0.3.0).
        A session sees every organization you belong to, because moving between
        them is what the switcher is for. A **pinned** key was issued for one
        and cannot act outside it, so it is not told the names of the others.
        An **account-wide** key acts in the organizations its owner belongs to,
        so those are exactly what it is told about — minus any an administrator
        has cut it out of, which is an organization it no longer works in.

        This description said *only the organization it was issued for* until
        0.3.0, which was the whole truth while every key was pinned. See
        `organization_id` on `APIKey` for the reach a key has.

        `current` marks the workspace this request is acting in. `default`
        marks the one pinned as where new sessions start; when nothing is
        pinned no entry carries it, and sign-in follows the workspace you used
        last.

        Not paginated. A person's memberships are a handful of rows by
        construction.
      responses:
        "200":
          description: Every workspace the caller may act in
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Add a workspace to your organization
      description: |
        The slug is derived from the name rather than supplied: two fields that
        have to agree is two fields somebody can make disagree, and the slug's
        only job is the per-organization uniqueness that makes a duplicate name
        a `422`.

        Requires `workspace.write` in the workspace you are currently acting in,
        which is the authority being exercised — there is no target workspace
        yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "201":
          description: The new workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationWorkspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /workspaces/{id}:
    patch:
      tags: [workspaces]
      operationId: renameWorkspace
      summary: Rename a workspace
      description: |
        Name and slug move together.

        Requires `workspace.write` **in that workspace**, not in the one you are
        acting in. The two can differ: a workspace-scoped membership grants a
        role in one workspace and nothing in the next, so the permission is read
        against the workspace being changed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: The renamed workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationWorkspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: |
        **Refused while the workspace holds any link at all**, archived ones
        included, and the links must be deleted first. Links, tags and folders
        cascade from a workspace and there is no trash to restore them from, so
        deleting one with links in it would be a redirect outage for every alias
        it held. An archived link keeps its alias and its click history, which is
        why archiving is not a way around this.

        **Also refused when it is the organization's only workspace.** Everybody
        in an organization resolves into one of its workspaces to act at all, so
        deleting the last one would leave every member unable to sign in.

        Both refusals are `409` with the reason in `detail`. Requires
        `workspace.write` in that workspace.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Refused: the workspace still holds links, or it is the
            organization's only one. `detail` says which.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /workspaces/default:
    put:
      tags: [workspaces]
      operationId: setDefaultWorkspace
      summary: Pin where new sessions start, or go back to last-used
      description: |
        `workspace_id: null` is a real value and the way back: it clears the
        pin, and sign-in follows the workspace you used last again. That is the
        state every account is in until somebody chooses otherwise.

        Applies to sessions created *after* it — the browser you set it from
        stays where it is.

        **Requires a session, not an API key.** This is an account preference,
        and a leaked key must not be able to decide where its owner's browser
        lands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id]
              properties:
                workspace_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: The workspace to pin, or `null` to follow last-used.
      responses:
        "204":
          description: Preference stored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /workspaces/{id}/switch:
    post:
      tags: [workspaces]
      operationId: switchWorkspace
      summary: Move this session into another workspace
      description: |
        Takes effect on the next request, and is remembered: the workspace
        becomes where your next sign-in starts, unless a pinned default says
        otherwise.

        A workspace you are not a member of answers `404`, the same as one that
        does not exist, so ids cannot be probed.

        **Requires a session, not an API key.** Half of what this does is move
        the calling session, and a key has none; the other half is remembering
        the choice against your account, which a key doing it would repoint for
        your next sign-in. Note that an organization-wide key is *not* insulated
        from the result: it names no workspace of its own and resolves one per
        request the way a sign-in does, so a switch you make in a browser moves
        its requests too unless you have pinned a default.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Switched
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /openapi.json:
    get:
      tags: [meta]
      operationId: getOpenAPIJSON
      summary: This document, as JSON
      security: []
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/json:
              schema:
                type: object

  /openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenAPIYAML
      summary: This document, as authored
      security: []
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key, `lk_live_…`. Scopes are intersected with the owner's role per request.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-linkctrl_session
      description: Set by `POST /auth/login`. Unsafe cross-origin requests are refused.

  parameters:
    QRCodeSlug:
      name: slug
      in: path
      required: true
      description: >
        The identity printed in the code's payload. The default code has none
        and is not addressable here.
      schema:
        type: string
        pattern: "^[a-z0-9]{1,16}$"
    LinkID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoutingRuleID:
      name: ruleID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SplitVariantID:
      name: variantID
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderID:
      name: folderID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignID:
      name: campaignID
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookID:
      name: webhookID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AutomationID:
      name: automationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainID:
      name: domainID
      in: path
      required: true
      schema: { type: string, format: uuid }
    DisputeID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The dispute being decided.
    FromDay:
      name: from
      in: query
      schema: { type: string, format: date }
      description: Inclusive, UTC. Defaults to 29 days before `to`. The window may not exceed 400 days.
    ToDay:
      name: to
      in: query
      schema: { type: string, format: date }
      description: Inclusive, UTC. Defaults to today.

  requestBodies:
    QRLogoUpload:
      required: true
      description: >
        The image, as one `multipart/form-data` part named `logo`. Shared by the
        default code's shorthand and the named-code collection, because they are
        one operation at two addresses — a second copy of this shape is a second
        thing that can disagree with the handler.
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [logo]
            properties:
              logo:
                type: string
                format: binary
                description: The image, as PNG or JPEG.
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 12
                description: Length is the only rule (NIST SP 800-63B).
              name:
                type: string
                description: Display name; defaults to the mailbox part of the email.

    SetupCredentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 12
                description: Length is the only rule (NIST SP 800-63B).
              name:
                type: string
                description: Display name; defaults to the mailbox part of the email.
              update_check:
                type: boolean
                description: |
                  The API's half of the first-run prompt the dashboard's setup
                  page shows: whether this instance may ask GitHub, once a day,
                  whether a newer LinkCtrl has been released.

                  **Omitted answers nothing**, which is a third state the
                  setting has: the check stays off, and the question is put to
                  the first account holding `instance.admin` that signs in to
                  the dashboard. A client written before this field existed
                  claims an instance exactly as it always did, and cannot agree
                  to an outbound connection on its operator's behalf by staying
                  silent.

                  What the check sends, in full: this server's source address,
                  and the version it is running, in the `User-Agent`. Nothing
                  else — no instance identifier, no deployment size, no link
                  counts, no configuration. The response is read for a version
                  and discarded.

                  `LINKCTRL_UPDATE_CHECK=false` on the deployment overrides this
                  downwards and cannot be overridden by it; a value sent to an
                  instance configured that way is accepted and has no effect.

                  There is no endpoint that changes the answer afterwards. It
                  is asked once, and the control that remains is the
                  environment variable.

  responses:
    Unauthorized:
      description: No valid credential, or the credential itself is being rejected
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated, but this identity may not do that; the detail names the missing permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: >
        The dependency needed for this operation is not present in this process.
        Not a refusal: the caller did nothing wrong and the operation may work
        later, or on a replica configured with it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Does not exist, or belongs to a workspace this identity cannot see
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The alias or resource already exists
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Validation:
      description: One or more fields are invalid; `errors` names each one
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: |
        Too many requests from this address. `Retry-After` carries the number of
        seconds to wait; it is a floor, not a promise.
      headers:
        Retry-After:
          description: Seconds until a request from this address will be accepted
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NoMailer:
      description: |
        This instance has no SMTP relay configured, so it cannot send the mail
        the operation depends on. `503` rather than `403` or `404`: the
        mechanism exists and is unavailable rather than forbidden or absent, and
        a client that retries after the operator configures a relay will
        succeed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    MFAStatus:
      type: object
      required: [available, enabled, recovery_codes_remaining]
      properties:
        available:
          type: boolean
          description: |
            Whether this **instance** can store a second factor at all, which is
            whether `LINKCTRL_MFA_SECRET_KEY` is configured.
        enabled:
          type: boolean
        enabled_at:
          type: string
          format: date-time
          nullable: true
        recovery_codes_remaining:
          type: integer
          format: int64
          description: Unspent codes. Zero on an account with no second factor.

    MFARecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        enabled:
          type: boolean
        recovery_codes:
          type: array
          description: |
            Shown once. Only their hashes are stored, so this is the only
            response that ever carries them.
          items:
            type: string

    Problem:
      type: object
      description: RFC 9457 problem details. Clients should branch on `type`, not prose.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Present on validation failures; one entry per invalid field.
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code:
                type: string
                description: >-
                  Machine-readable reason. Branch on this rather than on
                  `message`. A destination refused by the blocking tiers uses
                  `<tier>.<rule>` — `unappealable.*` can never be permitted on
                  any instance, `high_confidence.*` needs the instance rebuilt
                  with an edited list, and `low_confidence.*` can be overruled
                  by the instance owner. Codes for malformed input (`required`,
                  `too_long`, `invalid`, `no_scheme`, `no_host`) carry no
                  prefix. Not enumerated: later milestones add rules, and a
                  client must tolerate a code it has not seen.
                example: unappealable.private_address
              message: { type: string }

    AccountCreated:
      type: object
      additionalProperties: false
      required: [user_id, email, workspace_id]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        workspace_id:
          type: string
          format: uuid
          description: The auto-provisioned personal workspace.

    RegistrationPending:
      type: object
      additionalProperties: false
      required: [email, status, expires_at]
      description: |
        A registration waiting on its address. Nothing has been created: the
        account, its organization and its workspace are written when the emailed
        link is followed.
      properties:
        email:
          type: string
          format: email
          description: The normalized address the link was sent to.
        status: { type: string, enum: [verification_sent] }
        expires_at:
          type: string
          format: date-time
          description: When the link stops working. Registering again replaces it.

    SessionCreated:
      type: object
      additionalProperties: false
      required: [user_id, email, workspace_id, role, expires_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        workspace_id: { type: string, format: uuid }
        role: { type: string }
        expires_at:
          type: string
          format: date-time
          description: The session's absolute deadline; idle expiry may end it sooner.

    Me:
      type: object
      additionalProperties: false
      required: [user_id, email, name, workspace_id, role, permissions]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        workspace_id: { type: string, format: uuid }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }

    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, organization_id, organization_name, is_personal, current, default]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        organization_id: { type: string, format: uuid }
        organization_name:
          type: string
          description: |
            Carried because a workspace name is only unique inside an
            organization; two of them may both have a "Marketing".
        is_personal:
          type: boolean
          description: True for the organization created with the account.
        current:
          type: boolean
          description: The workspace this request is acting in.
        default:
          type: boolean
          description: |
            The pinned workspace, where new sessions start. No entry carries it
            while the account follows last-used.

    OrganizationWorkspace:
      type: object
      additionalProperties: false
      description: |
        A workspace of your own organization, as its management surface sees it.
        Distinct from `Workspace`, which is the switcher's shape and carries the
        organization because that list spans several; this one never leaves one.
      required: [id, name, slug, current, manageable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        current:
          type: boolean
          description: The workspace this request is acting in.
        manageable:
          type: boolean
          description: |
            Whether you may rename or delete it. Answered per row, because a
            workspace-scoped membership can grant `workspace.write` in one
            workspace and nothing in the next.

    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug, is_personal, workspace_id, workspace_name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: |
            Derived from the name with the id's first octets appended, because
            organization slugs are unique instance-wide and names are not.
        is_personal:
          type: boolean
          description: |
            False for everything created here. The flag marks the organization
            registration provisions alongside an account.
        workspace_id:
          type: string
          format: uuid
          description: The workspace provisioned with it, in the same transaction.
        workspace_name: { type: string }
        created_at: { type: string, format: date-time }

    RoleSlug:
      type: string
      enum: [owner, admin, editor, viewer]
      description: |
        The four built-in roles. Rank counts downward in authority — `owner` 10,
        `admin` 20, `editor` 30, `viewer` 40 — and every ceiling in this API is
        expressed against it.

    Member:
      type: object
      additionalProperties: false
      required: [id, user_id, email, name, role, role_rank, manageable, is_self, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The **membership** id, which is what every operation here acts on.
            Not the user's id.
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          $ref: "#/components/schemas/RoleSlug"
        role_rank:
          type: integer
          description: Lower binds tighter; carried so a client can compare without a lookup.
        workspace_id:
          type: string
          format: uuid
          description: |
            Absent when the membership covers every workspace in the
            organization. Present means it covers exactly that one, in addition
            to whatever else the person holds.
        workspace_name: { type: string }
        manageable:
          type: boolean
          description: Whether *you* may re-role or remove this membership.
        is_self:
          type: boolean
          description: Your own membership.
        created_at: { type: string, format: date-time }

    GrantWorkspaceAccessRequest:
      type: object
      additionalProperties: false
      required: [user_id, workspace_id, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: Somebody who already holds an organization-wide membership.
        workspace_id: { type: string, format: uuid }
        role:
          $ref: "#/components/schemas/RoleSlug"

    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80

    Domain:
      type: object
      additionalProperties: false
      required: [id, hostname, scope, is_default, verified, ssl_status, link_count, manageable, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        hostname:
          type: string
          maxLength: 253
          description: Lowercased, with no trailing dot.
        scope:
          type: string
          enum: [instance, organization, workspace]
          description: >
            Who owns the hostname. `instance` is the default domain every
            workspace shares; `workspace` is a hostname one workspace registered
            and administers. `organization` is a legal state of the schema that
            nothing registers yet.
        is_default:
          type: boolean
          description: The instance's default domain — the hostname every link is on today.
        verified:
          type: boolean
          description: >
            Whether the hostname's DNS challenge has passed. **This is the
            gate**: false means no router resolves an alias on the hostname,
            whoever points DNS at this instance, and links cannot be created on
            it.
        verified_at:
          type: string
          format: date-time
          description: Absent while `verified` is false.
        ssl_status:
          type: string
          enum: [none, pending, active, error]
          description: >
            What this instance knows about the certificate, which is less than
            the name suggests. It never speaks ACME: certificates are obtained
            by the operator's proxy. `none` is unverified, `pending` means this
            instance will answer the proxy's on-demand ask for the hostname, and
            `active` means that ask has been answered. `error` is never written.
        root_redirect_url:
          type: string
          format: uri
          description: >
            Where `https://<hostname>/` sends a visitor. Absent means the root
            answers 404.
        verification:
          $ref: "#/components/schemas/DomainVerification"
        link_count:
          type: integer
          format: int64
          description: >
            Links on this domain. Removing a domain is refused while it is
            non-zero.
        manageable:
          type: boolean
          description: >
            Whether **this** caller may rename or remove the entry. A rendering
            hint for a client drawing controls; every write is re-judged on
            arrival, so acting on a stale `true` still gets a `403`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DomainVerification:
      type: object
      additionalProperties: false
      required: [record_type, record_name, record_data]
      description: >
        The DNS challenge, and the state of the last check. Absent on the
        instance's default domain, which nobody verifies.
      properties:
        record_type: { type: string, enum: [TXT] }
        record_name:
          type: string
          description: >
            The fully-qualified name to publish under — the hostname with a
            `_linkctrl-challenge` label in front. Given in full rather than as a
            label to prepend, because this is copied into a DNS provider's form.
        record_data:
          type: string
          description: The value the record must carry.
        checked_at:
          type: string
          format: date-time
          description: When the last check ran, whatever it concluded.
        failing_since:
          type: string
          format: date-time
          description: >
            When the current run of failures began. Absent means the last check
            passed. A single success clears it.
        stops_at:
          type: string
          format: date-time
          description: >
            When the hostname stops being served if the record does not come
            back. Present only while the domain is both serving and failing,
            because it is a threat only in that state.
        error:
          type: string
          description: What the last failed check said.

    DomainRootRedirectRequest:
      type: object
      additionalProperties: false
      required: [root_redirect_url]
      properties:
        root_redirect_url:
          type: string
          maxLength: 2048
          description: >
            Where the bare hostname sends a visitor. Empty removes it, restoring
            the 404.

    DomainList:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
          description: The default domain first, then by hostname.

    CreateDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          maxLength: 253
          description: >
            The hostname on its own — no scheme, no path, no port. Lowercased
            and stripped of a trailing dot before it is stored.

    UpdateDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: { type: string, maxLength: 253 }

    Folder:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, depth, link_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        parent_id:
          type: string
          format: uuid
          description: Absent for a folder at the top level.
        name: { type: string, maxLength: 64 }
        depth:
          type: integer
          description: 1 for a folder with no parent. Computed, never stored.
        link_count:
          type: integer
          format: int64
          description: >
            The links filed directly in this folder, never its descendants' —
            the same number `GET /links?folder={id}` returns.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Campaign:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, slug, description, link_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, maxLength: 64 }
        slug:
          type: string
          maxLength: 48
          description: >
            Lowercase letters, digits and hyphens. Unique in the workspace,
            case-insensitively, because it is what a `?campaign=` filter names.
        description: { type: string, maxLength: 500 }
        starts_at:
          type: string
          format: date-time
          description: >
            Descriptive. Nothing consults it at redirect time, and a link in a
            campaign that has not started still redirects.
        ends_at:
          type: string
          format: date-time
          description: Descriptive, exactly as `starts_at` is.
        link_count:
          type: integer
          format: int64
          description: >
            The live links carrying this campaign — the same number
            `GET /links?campaign={id}` returns. Zero on `GET /campaigns/{id}`,
            which does not count.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CampaignList:
      type: object
      additionalProperties: false
      required: [campaigns]
      properties:
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/Campaign" }

    Webhook:
      type: object
      additionalProperties: false
      required: [id, workspace_id, url, events, description, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        url:
          type: string
          maxLength: 2048
          description: >
            Where events are POSTed. http or https only, and never a private,
            loopback or link-local address — checked here and again at the
            address the name resolves to when the connection is opened.
        events:
          type: array
          description: >
            The subscription, from the closed vocabulary. Stored deduplicated
            and sorted, so two subscriptions that mean the same thing compare
            equal.
          items: { $ref: "#/components/schemas/WebhookEvent" }
        description: { type: string, maxLength: 200 }
        enabled:
          type: boolean
          description: >
            A disabled webhook queues nothing. Switching one off stops new
            deliveries being created rather than creating and discarding them;
            anything already queued still goes out.
        secret:
          type: string
          description: >
            The signing key, 64 lowercase hex characters. **Present only on the
            response to `POST /webhooks` and `POST /webhooks/{id}/rotate`**, and
            absent everywhere else — it is not stored anywhere it can be read
            back. Use the string exactly as given as the HMAC key; do not
            hex-decode it first.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookEvent:
      type: string
      description: >
        One event name. The vocabulary is closed and deliberately small: five for
        a link's lifecycle, one for a destination that was refused, and one for an
        automation rule that fired. `automation.fired` is the only event a
        workspace can cause this server to emit on purpose, and nothing triggers
        on it — which is what stops a rule that emits a webhook being a rule that
        fires a rule.
      enum:
        - link.created
        - link.updated
        - link.archived
        - link.restored
        - link.deleted
        - destination.blocked
        - automation.fired

    WebhookList:
      type: object
      additionalProperties: false
      required: [webhooks, events, signature]
      properties:
        webhooks:
          type: array
          items: { $ref: "#/components/schemas/Webhook" }
        events:
          type: array
          description: The whole vocabulary, so a subscription editor needs no hard-coded list.
          items: { $ref: "#/components/schemas/WebhookEvent" }
        signature:
          type: object
          description: >
            How to verify a delivery, so a receiver can be written from the API
            alone. The full worked example is in `docs/usage.md`.
          additionalProperties: true

    AutomationTrigger:
      type: string
      description: >
        What a rule watches for. The vocabulary is closed and deliberately tiny:
        a large trigger set is untestable and becomes the place surprises live.
      enum:
        - link.expired
        - link.max_clicks
        - destination.blocked

    AutomationAction:
      type: string
      description: >
        What a rule does when it fires. `notify` writes one in-app notification
        per firing to the organization's owners; `webhook` emits one
        `automation.fired` event to the workspace's subscribed webhooks;
        `archive_link` archives the matched links and is legal only on a trigger
        whose subject is a link. There is no `disable` action, by decision D10.
      enum:
        - notify
        - webhook
        - archive_link

    AutomationTriggerConfig:
      type: object
      additionalProperties: false
      description: >
        The threshold. Nothing is discarded while it is unmet — matches
        accumulate across runs until the count is reached, because a threshold
        that discarded what it counted could never be reached one subject at a
        time.
      properties:
        min_count:
          type: integer
          minimum: 0
          maximum: 25
          default: 1
          description: >
            How many subjects must accumulate before the rule fires. Zero and one
            both mean "fire on the first". Capped at the per-run match cap: a
            higher threshold would be a rule that validates, saves, displays and
            never fires.

    AutomationRule:
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, trigger, trigger_config, actions, enabled, last_fired_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        trigger: { $ref: "#/components/schemas/AutomationTrigger" }
        trigger_config: { $ref: "#/components/schemas/AutomationTriggerConfig" }
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/AutomationAction" }
        enabled: { type: boolean }
        last_fired_at:
          type: string
          format: date-time
          nullable: true
          description: >
            The watermark. A rule sees only subjects whose event time is after
            this instant, and the claim that fires a rule advances it before any
            action runs — which is what stops a rule firing twice for one
            subject. Set at creation and on resume, so a rule that has never
            matched anything still carries a value.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AutomationRuleList:
      type: object
      additionalProperties: false
      required: [rules, triggers, actions, evaluation]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/AutomationRule" }
        triggers:
          type: array
          description: The whole trigger vocabulary, so a rule editor needs no hard-coded list.
          items: { $ref: "#/components/schemas/AutomationTrigger" }
        actions:
          type: array
          description: The whole action vocabulary.
          items: { $ref: "#/components/schemas/AutomationAction" }
        evaluation:
          type: object
          description: >
            Where evaluation happens and what bounds one run. Advertised because
            "why has my rule not fired yet" is otherwise a question only the
            source answers.
          additionalProperties: true

    CreateAutomationRuleRequest:
      type: object
      additionalProperties: false
      required: [name, trigger, actions]
      properties:
        name: { type: string, maxLength: 120 }
        trigger: { $ref: "#/components/schemas/AutomationTrigger" }
        trigger_config: { $ref: "#/components/schemas/AutomationTriggerConfig" }
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/AutomationAction" }
        enabled:
          type: boolean
          default: true
          description: Absent means enabled, which is what a rule somebody just wrote should be.

    UpdateAutomationRuleRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        trigger: { $ref: "#/components/schemas/AutomationTrigger" }
        trigger_config: { $ref: "#/components/schemas/AutomationTriggerConfig" }
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/AutomationAction" }
        enabled: { type: boolean }

    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url: { type: string, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WebhookEvent" }
        description: { type: string, maxLength: 200 }
        enabled:
          type: boolean
          default: true
          description: Absent means enabled, which is what a webhook somebody just registered should be.

    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          description: >
            Replaces the subscription entirely. An empty array is refused rather
            than stored.
          items: { $ref: "#/components/schemas/WebhookEvent" }
        description: { type: string, maxLength: 200 }
        enabled: { type: boolean }

    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, event, status, attempts, created_at]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: "#/components/schemas/WebhookEvent" }
        status:
          type: string
          description: >
            `failed` is in the column's constraint and nothing writes it — a
            delivery that has spent its attempts becomes `abandoned`, which says
            the same thing more precisely. Treat the two alike if one ever
            appears.
          enum: [pending, delivered, failed, abandoned]
        attempts:
          type: integer
          format: int32
          description: >
            Counted when the delivery is claimed, before anything is sent, so a
            process that dies mid-delivery spends an attempt rather than
            retrying forever.
        response_code:
          type: integer
          format: int32
          nullable: true
          description: >
            What the receiver answered, or null when there was no response at
            all — a refused connection, a timeout, or this instance declining to
            open the socket because the name resolved somewhere private.
        last_error:
          type: string
          description: The failure in words, bounded. Absent on a delivery that succeeded first time.
        next_attempt_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }

    CreateCampaignRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        slug:
          type: string
          maxLength: 48
          description: Derived from the name when absent or empty.
        description: { type: string, maxLength: 500 }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }

    UpdateCampaignRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64 }
        slug:
          type: string
          maxLength: 48
          description: An empty value regenerates the slug from the name.
        description: { type: string, maxLength: 500 }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        clear_starts_at:
          type: boolean
          description: Removes the start bound. Wins over `starts_at`.
        clear_ends_at:
          type: boolean
          description: Removes the end bound. Wins over `ends_at`.

    QRStyle:
      type: object
      additionalProperties: false
      description: >
        How a code is drawn. Every field is optional and an omitted one is its
        default, so `{}` is plain black on white.
      properties:
        foreground:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
          description: Default `#000000`.
        background:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
          description: >
            Default `#ffffff`, and always painted. It covers the quiet zone as
            well as the code, so the picture does not take the colour of
            whatever it is placed on.
        level:
          type: string
          enum: [L, M, Q, H]
          description: >
            Error correction, as ISO/IEC 18004 names the levels. Default `M`. A
            higher level survives more damage and packs the code tighter at the
            same printed size.

            **This field is API-only.** The dashboard stopped offering it at
            M49: it is a scannability tradeoff a dashboard user has no basis to
            make and a script might, so it is chosen here and carried forward
            unchanged by a save from the panel.

            **A code carrying a logo is always `H`, and a request naming
            anything else is accepted and overridden rather than refused.** A
            logo covers modules and `H` is the level that makes covering them
            survivable, so it is not a preference while there is one. This
            request replaces the style whole, and an omitted `level` means its
            default — so refusing would answer `422` to a caller changing a
            colour on a code whose logo it never mentioned. Nothing is silent
            about it: the response to this request, and every later `GET`,
            report `H`. Removing the logo leaves the level where it is, because
            lowering it would redraw a picture that may already be printed.
        margin:
          type: integer
          minimum: 0
          maximum: 16
          description: >
            The quiet zone, in modules. Default 4, which is the minimum
            ISO/IEC 18004 specifies. Together with `scale` this decides `size`;
            the dashboard asks for `size` and resolves it to these two, and
            since 2026-08-12 it always resolves this one to 4 — a wider quiet
            zone is white a poster does not need, so the dashboard spends the
            rounding on `scale` instead. A caller that wants more asks for it
            here; up to 16 is stored and drawn as given, on every read and every
            image, with no fit consulted.

            **A later save from the dashboard's size control re-fits it to 4.**
            That control is one number and it resolves through the same
            arithmetic every time, so a code whose stored quiet zone is wider
            keeps it only until somebody sets a size on that code from the
            dashboard — at which point the drawn size moves too, by at most half
            the step between two sizes that keep the modules whole, and the
            dashboard reports the new size the way it reports any snap. Nothing
            on this API does that: `PUT /links/{id}/qr` writes what it is given.
        scale:
          type: integer
          minimum: 2
          maximum: 68
          description: >
            Pixels per module. Default 8. `(module count + 2 × margin) × scale`
            is the output size in pixels, which the SVG carries as explicit
            `width` and `height` and the PNG is rasterised at. The SVG's drawing
            is also in module units inside a `viewBox`, so a consumer sizing the
            element with CSS still gets the same code at any size.

            The ceiling was 32 until 2026-08-12 and is now derived from the
            2000px raster bound: the smallest symbol is 21 modules, the default
            quiet zone adds eight, and 2000 ÷ 29 is 68. That is the largest
            pixels-per-module the dashboard's size control can resolve to, so
            every size it offers is a style this endpoint accepts. A large
            `scale` with a large `margin` still draws past 2000px, and the
            image endpoints answer `422` for that as they always have.

    QRCode:
      type: object
      additionalProperties: false
      required: [link_id, slug, label, content, style, stored, size, has_logo]
      properties:
        id:
          type: string
          format: uuid
          description: >
            The stored row. Absent for a default code nobody has styled or
            named, which has no row yet. Reported for completeness; the slug is
            what addresses a code.
        link_id: { type: string, format: uuid }
        slug:
          type: string
          description: >
            The identity this code prints in its payload, as `&qrc=<slug>`
            beside `?src=qr`. **Empty for the link's default code**, whose
            payload carries no code parameter at all — which is what every
            picture drawn before per-code identity existed carries, and why an
            already-printed code goes on being counted as the same code it
            always was. Generated, never chosen, and never rewritten.
        label:
          type: string
          description: >
            What the workspace calls this code. Free text, never in a URL and
            never in the picture; the redirect path never sees it. Empty for a
            code nobody has named.
        content:
          type: string
          description: >
            Exactly what the picture encodes: the link's short URL carrying
            `?src=qr`, and `&qrc=<slug>` for a named code.
        style: { $ref: "#/components/schemas/QRStyle" }
        stored:
          type: boolean
          description: >
            False for a link whose style has never been set, which renders at
            the default rather than not at all.
        size:
          type: integer
          description: >
            The output size in pixels this style draws this content at — the
            width and the height, since a code is square. **Read-only and
            derived**: the stored style holds a quiet zone in modules and a
            scale in pixels per module, and how many pixels those come to
            depends on how many modules the content encodes to. Set it by
            setting `margin` and `scale`; the dashboard asks for this number
            instead and resolves it to those two against the link's own module
            count.
        has_logo:
          type: boolean
          description: >
            Whether an image has been uploaded against this code. **A boolean
            rather than the image, and there is no operation anywhere in this
            document that returns the bytes** — the two that exist replace one
            and remove one. Every code can carry one, the default included: it
            is addressed at `/links/{id}/qr/logo`, the same shorthand `qr.svg`
            and `qr.png` use, because the default code's identity is having no
            slug rather than having a reserved one.

            **When this is true, both picture endpoints draw the image into the
            middle of the code**: a centred square one fifth of the symbol's
            width — 4% of its area — with the modules under it destroyed and
            `level` forced to `H` so they can be recovered. The fraction is a
            cap derived from what `H` corrects, and the logo is centred because
            the derivation holds for no other placement. **The drawn size is
            held where it was**: `H` packs more modules into the symbol, so
            `margin` and `scale` are re-fitted against the larger one to keep
            the picture at the size the code was already drawn at — a code near
            the raster ceiling would otherwise cross it and its PNG would start
            answering `422`. Module quantisation means the result is the
            nearest achievable size rather than always the identical integer.
            This read *a code can grow when a logo is added* until 0.3.0.

    QRCodeResponse:
      type: object
      additionalProperties: false
      required: [qr, levels]
      properties:
        qr: { $ref: "#/components/schemas/QRCode" }
        levels:
          type: array
          description: The error-correction levels a style may name.
          items: { type: string, enum: [L, M, Q, H] }

    QRCodeList:
      type: object
      additionalProperties: false
      required: [codes, max]
      properties:
        codes:
          type: array
          items:
            $ref: "#/components/schemas/QRCode"
          description: The link's codes, default first, then in creation order.
        max:
          type: integer
          description: >
            How many codes one link may carry. The bound exists because each
            code is a value in the link's own analytics breakdown, and a link
            with a thousand of them is a link whose analytics page cannot be
            drawn.

    SingleQRCodeResponse:
      type: object
      additionalProperties: false
      required: [code, levels]
      properties:
        code: { $ref: "#/components/schemas/QRCode" }
        levels:
          type: array
          description: The error-correction levels a style may name.
          items: { type: string, enum: [L, M, Q, H] }

    QRCodeRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 60
          description: >
            What to call this code. Omitted means unnamed; on a PUT, omitting it
            clears an existing name.
        style: { $ref: "#/components/schemas/QRStyle" }

    SetQRRequest:
      type: object
      additionalProperties: false
      required: [style]
      properties:
        style: { $ref: "#/components/schemas/QRStyle" }

    FolderList:
      type: object
      additionalProperties: false
      required: [folders, max_depth]
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
          description: Depth-first; a folder is immediately followed by its descendants.
        max_depth:
          type: integer
          description: >
            How many levels the tree may have. Carried in the response so a
            client building a folder picker learns the limit rather than
            hard-coding it.

    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
          description: >
            Trimmed. Control characters are refused rather than escaped. Unique
            among the folders in the same place, case-insensitively.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Absent or null puts the folder at the top level.

    UpdateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }

    MoveFolderRequest:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Where the folder goes. **Null is the top level**, and is the only way
            to take a folder back out of another one — which is why this field is
            required rather than optional.

    LinkStatus:
      type: string
      enum: [active, archived, expired, disabled]

    Tag:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        link_count: { type: integer, format: int64 }

    RoutingRule:
      type: object
      additionalProperties: false
      required: [id, link_id, priority, url, conditions, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        link_id: { type: string, format: uuid }
        priority:
          type: integer
          format: int32
          description: >
            Lower wins, and the first matching rule short-circuits. Ties break
            on creation order, so two rules at the same priority still evaluate
            the same way on every replica.
        url:
          type: string
          format: uri
          description: >
            Where a matching visitor is sent. Judged by every destination tier
            before the rule is stored, exactly as the link's own destination is.
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        enabled:
          type: boolean
          description: A disabled rule is kept and listed but never evaluated.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoutingRuleList:
      type: object
      additionalProperties: false
      required: [items, conditions, refused]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoutingRule"
        conditions:
          type: array
          items: { type: string }
          description: The condition names this version supports.
        refused:
          type: array
          description: >
            Conditions refused by decision rather than missing by omission, with
            the reason code a validation error would carry.
          items:
            type: object
            additionalProperties: false
            required: [condition, code, reason]
            properties:
              condition: { type: string }
              code: { type: string }
              reason: { type: string }

    RuleConditions:
      type: object
      additionalProperties: false
      description: |
        Every condition present must hold, and within one condition any listed
        value matches — AND across the keys, OR inside them. An empty object is
        refused: it would match every visitor and short-circuit every rule
        beneath it.

        Values are compared case-insensitively. A condition tested against a
        value the request does not have — no GeoIP database, no referrer, an
        address in nobody's range — does not match, so an unresolvable request
        falls through to the link's own destination rather than being routed on
        the strength of a blank.

        There is no `cookies` condition and its absence is deliberate; sending
        one is refused with the code `cookies_not_supported`.
      properties:
        country:
          type: array
          items: { type: string, minLength: 2, maxLength: 2 }
          description: ISO 3166-1 alpha-2. Needs a GeoIP database; without one, never matches.
        region:
          type: array
          items: { type: string }
          description: >
            ISO 3166-2 subdivision code. Needs a GeoIP *City* database. Resolved
            transiently on the redirect path and never stored against a click.
        city:
          type: array
          items: { type: string }
          description: >
            English city name. Needs a GeoIP City database. Resolved transiently
            and never stored, for the same reason region is not.
        language:
          type: array
          items: { type: string, maxLength: 8 }
          description: The first subtag of Accept-Language, e.g. `en` for `en-GB`.
        browser:
          type: array
          items: { type: string }
          description: As the click classifier buckets it — Chrome, Firefox, Safari, Edge, Other.
        os:
          type: array
          items: { type: string }
        device:
          type: array
          items:
            type: string
            enum: [desktop, mobile, tablet, bot, unknown]
        referrer:
          type: array
          items: { type: string }
          description: The referrer's host only. The rest of a referrer is discarded at the edge and is never available here.
        query:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: >
            Query parameters the visitor arrived with. An empty value list means
            "the parameter is present at all".
        utm:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: The same test against `utm_`-prefixed parameters, with the prefix left off the key.
        time:
          $ref: "#/components/schemas/RuleTime"
        returning:
          type: boolean
          description: |
            Within-day returning visitor: true requires somebody seen on this
            link earlier today, false requires somebody who was not.

            **Today ends at midnight UTC, and a visitor from yesterday is new
            again.** That is the whole meaning, not an approximation of a
            longer-lived one — a durable answer would need a cookie or a
            per-person identifier kept across days, and this product keeps
            neither. With no Redis configured every visitor reads as new.

    RuleTime:
      type: object
      additionalProperties: false
      description: >
        Evaluated against the clock at request time, never against the moment
        the link was cached. Needs days, a window, or both.
      properties:
        days:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
        from:
          type: string
          description: "`HH:MM` in `tz`. A window whose `to` is earlier than its `from` wraps past midnight."
        to:
          type: string
        tz:
          type: string
          description: >
            IANA name, e.g. `Europe/London`. Empty is UTC. A name rather than an
            offset, because an offset is wrong for half the year.

    CreateRoutingRuleRequest:
      type: object
      additionalProperties: false
      required: [url, conditions]
      properties:
        url: { type: string, format: uri }
        priority:
          type: integer
          format: int32
          description: Defaults to 100 when omitted or zero.
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        enabled:
          type: boolean
          description: Defaults to true.

    UpdateRoutingRuleRequest:
      type: object
      additionalProperties: false
      description: Absent fields are untouched. `conditions` replaces the whole set when present.
      properties:
        url: { type: string, format: uri }
        priority: { type: integer, format: int32 }
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        enabled: { type: boolean }

    SplitVariant:
      type: object
      additionalProperties: false
      required: [id, link_id, kind, url, weight, share, enabled, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        link_id: { type: string, format: uuid }
        kind:
          type: string
          enum: [weighted, sequential, fallback]
        url:
          type: string
          format: uri
          description: >
            Where this arm sends people. Judged by every destination tier before
            the arm is stored.
        weight:
          type: integer
          format: int32
          description: >
            The arm's share of a weighted split, relative to the other enabled
            arms, so 60/40 and 600/400 are the same test. Carried but never read
            for the other two kinds.
        share:
          type: number
          format: double
          description: >
            `weight` as a percentage of the enabled weighted arms. Computed for
            the reader rather than stored, because it changes whenever any
            *other* arm changes. Zero for a sequential split, where every enabled
            arm receives one visitor in N.
        enabled:
          type: boolean
          description: >
            The feature flag. A disabled arm is kept and listed but never
            chosen, and the remaining arms re-share its traffic.
        position:
          type: integer
          format: int32
          description: The arm's place in the rotation. Assigned once, on creation.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Split:
      type: object
      additionalProperties: false
      required: [kind, variants]
      properties:
        kind:
          type: string
          description: >
            The kind of this link's arms, or "" when it has none. A link's arms
            are all one kind.
          enum: ["", weighted, sequential]
        variants:
          type: array
          description: In rotation order, disabled arms included.
          items:
            $ref: "#/components/schemas/SplitVariant"
        fallback:
          $ref: "#/components/schemas/SplitVariant"

    SplitResponse:
      type: object
      additionalProperties: false
      required: [split, kinds, fallback]
      properties:
        split:
          $ref: "#/components/schemas/Split"
        kinds:
          type: array
          items: { type: string }
          description: The arm kinds this version accepts.
        fallback:
          type: string
          description: The kind name a fallback destination is created under.

    CreateSplitVariantRequest:
      type: object
      additionalProperties: false
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [weighted, sequential, fallback]
        url: { type: string, format: uri }
        weight:
          type: integer
          format: int32
          description: Weighted arms only. 0 parks an arm without deleting it.
        enabled:
          type: boolean
          description: Defaults to true.

    UpdateSplitVariantRequest:
      type: object
      additionalProperties: false
      description: Absent fields are untouched. `kind` cannot be changed.
      properties:
        url: { type: string, format: uri }
        weight: { type: integer, format: int32 }
        enabled: { type: boolean }

    DestinationSplit:
      type: object
      additionalProperties: false
      required: [destination_id, url, weight, is_primary, clicks, unique_visitors, visitors_known, share]
      properties:
        destination_id: { type: string, format: uuid }
        url: { type: string }
        weight: { type: integer, format: int32 }
        is_primary:
          type: boolean
          description: >
            The link's own destination. Its clicks are a remainder rather than a
            reading — a click that went there carries no destination id, so the
            per-destination rollup has no row for it — which is why this is the
            only row that can be `approximate`.
        removed:
          type: boolean
          description: >
            Clicks attributed to a destination that has since been deleted. They
            are reported rather than dropped.
        approximate:
          type: boolean
          description: >
            This row's clicks include traffic the per-destination rollup has not
            attributed yet. Only ever the link's own destination, and only while
            something has been attributed elsewhere: the totals recompute every
            60 seconds and the per-destination breakdown every 15 minutes, so
            between them this row holds its own clicks plus any split-arm clicks
            of the last quarter-hour. Absent means the figure is settled.
        clicks: { type: integer, format: int64 }
        unique_visitors: { type: integer, format: int64 }
        visitors_known:
          type: boolean
          description: >
            Whether unique_visitors is a measurement. False on the link's own
            destination, always: unique visitors are counted per destination by
            the rollup, and this is the row the rollup does not write, so its
            unique_visitors is 0 because nothing counted rather than because
            nobody came.
        share:
          type: number
          format: double
          description: This destination's percentage of the link's non-bot clicks.

    Link:
      type: object
      additionalProperties: false
      required:
        [id, workspace_id, alias, short_url, url, status, tags, forward_query,
         forward_path, bot_blocking, has_password, one_time, require_signature,
         click_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        alias:
          type: string
          description: Lowercase-canonical; resolution is case-insensitive.
        short_url: { type: string, format: uri }
        url:
          type: string
          format: uri
          description: The destination.
        title: { type: string }
        description: { type: string }
        status:
          $ref: "#/components/schemas/LinkStatus"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        folder_id:
          type: string
          format: uuid
          description: >
            Where the link is filed. Absent for a link in no folder, which every
            link starts as. The id and not the name: a name here would be stale
            the moment somebody renamed the folder, and `GET /folders` answers
            names once rather than on every row of every page.
        campaign_id:
          type: string
          format: uuid
          description: >
            The campaign the link belongs to. Absent for a link carrying none.
            The id and not the name, for the reason `folder_id` gives — and a
            different question from it: a folder is where the link lives, a
            campaign is what it is for, so a link may carry both.
        forward_query:
          type: boolean
          description: When true, a visitor's query string is merged into the destination on redirect. The destination's own parameters win on conflict.
        forward_path:
          type: boolean
          description: >
            When true, path segments after the alias are appended to the
            destination, so `/{alias}/pricing` reaches the destination's own
            `/pricing`. When false, anything after the alias is a 404 — the same
            answer an unknown alias gets, so it reveals nothing about which
            aliases exist. Dot segments are refused rather than resolved, and
            forwarding never changes the destination's scheme or host.
        bot_blocking:
          $ref: "#/components/schemas/BotBlocking"
        expires_at: { type: string, format: date-time }
        has_password:
          type: boolean
          description: |
            Whether the link is password-protected. A boolean and never the
            password or its hash: a management API that returned either would
            make every reader of a link a holder of its secret.
        max_clicks:
          type: integer
          format: int64
          description: The click ceiling, if there is one. The limit, never the remainder.
        one_time:
          type: boolean
          description: Whether the link may be followed once.
        require_signature:
          type: boolean
          description: Whether the link refuses requests without a valid signature.
        clicks_consumed:
          type: integer
          format: int64
          description: |
            How much of the click budget has been spent, exactly. Present only on
            a single-link read of a link that has a budget — it is a second query,
            and a page of links would be a second query each. Unlike `click_count`
            this is the number the gate itself reads.
        click_count:
          type: integer
          format: int64
          description: |
            Approximate — written in batches with the click events, an unclean
            shutdown can lose one batch. **Deliberately not what the max-click
            gate counts**; see `clicks_consumed`.
        last_click_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time }

    BotBlocking:
      type: string
      enum: [inherit, on, off]
      description: >
        Whether this link refuses automated clients. `inherit` is the default
        and takes the domain's answer, which on a fresh instance is "allow".


        This is the link's own setting, not what is in effect: a domain with
        `block_bots_enforced` blocks regardless, and `off` is refused with `422`
        while that holds rather than being stored and ignored.


        A refused client receives `403` with a body naming nothing, identical
        whatever state the link is in, so being blocked reveals no more than a
        `404` would. There is no challenge or bypass: a person the user-agent
        heuristic misjudges cannot get through, and nobody is notified.

    DomainSettings:
      type: object
      additionalProperties: false
      required: [hostname, split_hosts, block_bots, block_bots_enforced]
      properties:
        hostname:
          type: string
          description: The default domain's stored hostname.
        root_redirect_url:
          type: string
          description: >
            Where the link domain's root sends a visitor. Absent when unset, in
            which case the root answers 404.
        split_hosts:
          type: boolean
          description: >
            True when the dashboard and short links are served on separate
            hostnames. The root redirect applies only then; setting it otherwise
            is refused.
        block_bots:
          type: boolean
          description: >
            The domain's own answer for automated clients, inherited by every
            link whose `bot_blocking` is `inherit`.
        block_bots_enforced:
          type: boolean
          description: >
            True when the domain's answer overrules a link that set
            `bot_blocking` to `off`. Only meaningful with `block_bots` true, and
            the pair cannot be stored any other way.

    FeedDisclosure:
      type: object
      additionalProperties: false
      required: [enabled, webhooks]
      description: >
        What happens to a destination you submit, by both of the channels one
        can leave by.

        `enabled` is the **operator's** channel and is instance-wide: a
        third-party reputation feed, unset in the shipped default. `webhooks` is
        **your workspace's** and is not the operator's to switch off — a
        registration made by an owner or administrator there, receiving the
        workspace's link events, which carry the destination.

        `enabled: false` was once the whole answer and was not: a workspace with
        a webhook registered was told nothing left. Read both fields, and read
        neither as a statement about the other — this instance having no feed
        says nothing about another workspace's webhooks, and your workspace
        having none says nothing about anybody else's.
      properties:
        enabled:
          type: boolean
          description: >
            True when destinations are sent to a third party for a reputation
            check. Instance-wide, and set by the operator alone.
        webhooks:
          $ref: "#/components/schemas/WebhookDisclosure"
        third_party:
          type: string
          description: >
            Who the destinations go to, in words, as the operator named them.
            Required alongside the endpoint: an instance cannot be configured to
            send destinations somewhere it cannot name.
          example: Google Safe Browsing
        endpoint:
          type: string
          description: >
            Where they are sent: the scheme, host and path, and nothing else. A
            feed URL often carries the operator's API key in its query string,
            and this disclosure is readable by every account on the instance, so
            the value is assembled from the parts that are safe to publish
            rather than filtered. A query string, a fragment and URL userinfo
            therefore never appear; a credential written into the path does, and
            configuration validation refuses one written into the userinfo.
        method:
          type: string
          enum: [GET, POST]
        timeout_seconds:
          type: number
          description: >
            How long a check may take before it fails open. A check that fails
            open accepts the destination: the built-in tiers had already
            accepted it, and a third party's outage must not decide that this
            instance may not create links.

    WebhookDisclosure:
      type: object
      additionalProperties: false
      required: [receiving, count]
      description: >
        Whether anything your workspace registered receives the destinations you
        submit. Scoped to the workspace this credential acts in, and to no other.

        Note what is **not** here: no URL, no name, no id. Reading who a
        workspace posts to needs `webhooks.read`; being told that your
        destinations leave needs nothing, because it is a fact about your own
        data rather than about the workspace's configuration. A credential with
        no webhook scope still gets a true answer here.
      properties:
        receiving:
          type: boolean
          description: >
            True when at least one enabled registration in this workspace is
            subscribed to an event whose payload carries a destination — the
            five link-lifecycle events, which carry the URL as typed, and
            `destination.blocked`, which carries the refused attempt defanged.
            `automation.fired` carries neither and does not count.

            Published rather than left to be derived from `count`, so a client
            and this product cannot disagree about what the predicate is.
        count:
          type: integer
          format: int64
          description: >
            How many such registrations there are. Not how many exist: a
            registration that is switched off, or subscribed only to
            `automation.fired`, receives no destination and is not counted here.
          example: 1

    LinkPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        next_cursor:
          type: string
          description: Opaque keyset cursor; present when `has_more`.
        has_more: { type: boolean }
        total:
          type: integer
          format: int64
          description: Present only when `include_total=true` was requested.

    CreateLinkRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: http or https only; private and metadata address ranges are refused.
        alias:
          type: string
          description: Optional; generated when absent. Lowercased, dots refused, reserved words refused.
        title: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
          description: Tag names; created in the workspace as needed.
        expires_at:
          type: string
          format: date-time
          description: Must be in the future. The link answers 410 past it.
        forward_query:
          type: boolean
          description: Off by default. Merges the visitor's query string into the destination on redirect; the destination's own parameters win.
        forward_path:
          type: boolean
          description: Off by default. Appends the visitor's extra path segments to the destination; with it on the alias answers every path beneath itself.
        password:
          type: string
          description: |
            Protects the link with a password. Write-only: it is hashed with
            argon2id on arrival and no response returns it or its hash. Minimum
            12 characters, the same floor an account password has — this hash
            sits in the same database dump. A visitor gets a challenge page and
            submits the password back to the link's own URL; nothing is issued
            to their browser, so returning later means typing it again.
        max_clicks:
          type: integer
          format: int64
          minimum: 1
          description: |
            Refuses the link with 410 once it has been followed this many times.
            Counted by a durable Postgres counter, not by `click_count`, which is
            approximate and asynchronous. HEAD requests never consume a click.
        one_time:
          type: boolean
          description: |
            The same gate as `max_clicks: 1`. When both are set, the smaller
            wins.
        require_signature:
          type: boolean
          description: |
            Refuses any request without a valid, unexpired signature. See
            `POST /links/{id}/sign` for the format.
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Files the new link. Absent or null leaves it unfiled. A folder in
            another workspace is refused with `folder_id`/`not_found`.
        campaign_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Labels the new link. Absent or null leaves it unlabelled. A campaign
            in another workspace is refused with `campaign_id`/`not_found`.
        domain_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The hostname to serve the link on. Absent or null takes the
            workspace's own default — its verified hostname if it has one, and
            the instance default otherwise.

            It must be **verified**: an unverified hostname is refused with
            `domain_id`/`unverified`, because a link created there would be a
            short URL that resolves nowhere. Another workspace's hostname is
            `403`. `short_url` is built from whichever hostname is chosen.

    UpdateLinkRequest:
      type: object
      additionalProperties: false
      description: Absent fields are untouched. An empty-string `expires_at` clears the expiry.
      properties:
        url: { type: string, format: uri }
        alias:
          type: string
          description: Changing it breaks anything pointing at the old alias; the old one is freed.
        title: { type: string }
        description: { type: string }
        expires_at:
          type: string
          description: RFC 3339 timestamp, or empty string to clear.
        tags:
          type: array
          items: { type: string }
          description: Replaces the full tag set.
        forward_query:
          type: boolean
          description: Toggles query forwarding for the link.
        forward_path:
          type: boolean
          description: Toggles deep-link path forwarding for the link.
        bot_blocking:
          $ref: "#/components/schemas/BotBlocking"
        password:
          type: string
          description: |
            Sets or removes the link's password. An **empty string removes it**;
            an absent key leaves it alone. The distinction is not decoration: a
            form that posts every field cannot re-send a password nobody can
            read, so an empty box has to mean "no change" and removal has to be
            asked for explicitly. Write-only — nothing reads one back.
        max_clicks:
          type: integer
          format: int64
          description: |
            Sets or removes the click ceiling. **Zero removes it**; an absent key
            leaves it alone. A ceiling of zero is refused everywhere else, which
            is what makes it unambiguous as the removal sentinel.
        one_time:
          type: boolean
          description: Toggles the one-time gate.
        require_signature:
          type: boolean
          description: Toggles the signed-URL requirement.
        folder_id:
          type: string
          description: |
            Files the link, or takes it out of every folder. **An empty string
            unfiles it**; an absent key leaves it where it is. Spelled the way
            `expires_at` above spells its removal rather than inventing a second
            idiom on one type — and without an explicit removal a filed link
            could never be unfiled.
        campaign_id:
          type: string
          description: |
            Labels the link, or takes it out of its campaign. **An empty string
            removes the label**; an absent key leaves it alone. Spelled exactly
            as `folder_id` above spells the same three states.

    DayPoint:
      type: object
      additionalProperties: false
      required: [day, clicks, unique_visitors, bot_clicks]
      properties:
        day: { type: string, format: date }
        clicks: { type: integer, format: int64 }
        unique_visitors: { type: integer, format: int64 }
        bot_clicks: { type: integer, format: int64 }

    Totals:
      type: object
      additionalProperties: false
      required: [clicks, unique_visitors, bot_clicks]
      properties:
        clicks: { type: integer, format: int64 }
        unique_visitors: { type: integer, format: int64 }
        bot_clicks: { type: integer, format: int64 }

    DimensionValue:
      type: object
      additionalProperties: false
      required: [value, clicks, unique_visitors]
      properties:
        value:
          type: string
          description: Empty string means unknown, stated rather than dropped.
        clicks: { type: integer, format: int64 }
        unique_visitors: { type: integer, format: int64 }

    LinkStats:
      type: object
      additionalProperties: false
      required: [link_id, from, to, totals, series, dimensions, destinations, qr_codes, caveat]
      properties:
        link_id: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          $ref: "#/components/schemas/Totals"
        series:
          type: array
          description: Only days with traffic appear; absent days are zero.
          items:
            $ref: "#/components/schemas/DayPoint"
        dimensions:
          type: object
          description: Keyed by dimension (device, browser, os, country, referrer, language).
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/DimensionValue"
        destinations:
          type: array
          nullable: true
          description: >
            The per-destination breakdown a split test is read from (M36). Null
            for a link that has never sent a click anywhere other than its own
            destination, which is every link on a default instance.
          items:
            $ref: "#/components/schemas/DestinationSplit"
        qr_codes:
          type: array
          nullable: true
          description: >
            The per-code breakdown (M50). Null for a link nobody has scanned and
            whose codes nobody has added to, which is every link on a default
            instance. **A filter over the `referrer` dimension rather than a
            rollup of its own** — a scan's code *is* its referrer value, `qr` for
            the default code and `qr:<slug>` for a named one — so the `referrer`
            breakdown above still reports every scan under the single value `qr`,
            unchanged by how many codes a link carries.
          items:
            $ref: "#/components/schemas/QRCodeSplit"
        caveat:
          type: string
          description: The honest limitation of cookie-free counting, attached to the numbers it qualifies.

    QRCodeSplit:
      type: object
      additionalProperties: false
      required: [slug, label, clicks, unique_visitors]
      properties:
        slug:
          type: string
          description: >
            Empty for the link's default code — the one whose payload carries no
            code parameter, and the one every picture printed before per-code
            identity existed resolves to.
        label:
          type: string
          description: What the workspace calls this code. Empty for one nobody named.
        removed:
          type: boolean
          description: >
            Scans attributed to a code that no longer exists. Reported rather
            than dropped: a link's history must not change because somebody
            retired a poster. The row stops growing when the code is deleted,
            because a payload naming a slug the link no longer has is recorded as
            the default code.
        clicks: { type: integer }
        unique_visitors: { type: integer }

    Overview:
      type: object
      additionalProperties: false
      required: [from, to, totals, series, caveat]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          $ref: "#/components/schemas/Totals"
        series:
          type: array
          items:
            $ref: "#/components/schemas/DayPoint"
        caveat: { type: string }

    RecentClick:
      type: object
      additionalProperties: false
      required: [occurred_at, is_bot]
      properties:
        occurred_at: { type: string, format: date-time }
        device: { type: string }
        browser: { type: string }
        os: { type: string }
        country:
          type: string
          description: Present only when a GeoIP database is configured.
        referrer:
          type: string
          description: Host only; query strings are discarded at ingest.
        is_bot: { type: boolean }

    APIKey:
      type: object
      additionalProperties: false
      required:
        [id, name, prefix, scopes, org_wide, organization_id,
         revoked_organizations, last_used_at, expires_at, revoked_at,
         rotated_at, grace_expires_at, successor_id, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: The public part, `lk_live_` plus eight characters. The secret is never shown again.
        scopes:
          type: array
          items: { type: string }
        org_wide:
          type: boolean
          description: |
            The workspace choice made when the key was created. `false` is a key
            bound to one workspace — the behaviour every key had before 0.2.0.
            `true` is a key that is not pinned to one, which only somebody with an
            organization-wide membership can issue.

            Not pinned is not *all at once*. There is no per-request workspace
            selector, so a request made with such a key resolves exactly one
            workspace the way a sign-in does — the owner's pinned default,
            otherwise the one they last used — bounded to one organization. It
            follows its owner's current choice, a switch made in a browser
            included.

            Which organization is `organization_id` below, and the two fields are
            not redundant: this one is about workspaces and that one is about
            tenants.
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The key's **reach** (0.3.0). Set is a key pinned to one organization
            for its whole life. `null` is an *account-wide* key: it reaches every
            organization its owner holds an organization-wide membership in, and
            each request resolves one of them the way a sign-in does.

            Account-wide is what an unpinned key created from 0.3.0 on is unless
            it was pinned deliberately, and pinning cannot be undone by rotation.
            Every key issued before 0.3.0 is pinned and stayed pinned; the
            migration changed no row's reach.

            Two consequences worth stating rather than discovering. An
            account-wide key reaches an organization its owner joins **after** the
            key was minted — that is what account-wide means, and somebody who
            wants a snapshot of today's memberships pins the key instead. And its
            permissions differ per organization: the scopes are intersected with
            the owner's role *there*, so the same key is more powerful in one
            tenant than another, and demoting its owner in one narrows it there
            and nowhere else.

            `false` on `org_wide` implies this is set: a workspace belongs to
            exactly one organization, so a workspace-bound key is pinned by
            construction.

            An account-wide key's reach is not the whole story on its own — see
            `revoked_organizations` below.
        revoked_organizations:
          type: array
          items: { $ref: '#/components/schemas/APIKeyOrgRevocation' }
          description: |
            The organizations an administrator has cut this key out of (0.3.0).

            An account-wide key reaches every organization its owner holds an
            organization-wide membership in, and an administrator of any of them
            may revoke its reach into *theirs* without touching the credential
            elsewhere — `DELETE /api/v1/api-keys/{id}` called by somebody who is
            not the owner. Afterwards the key authenticates, works everywhere
            else, and resolves into that organization never again. This array is
            the only place the owner can see that happened: the audit record is
            written in the administrator's organization, which the owner may hold
            no `audit.read` in.

            Always present, and empty for a **pinned** key however it was
            revoked. An organization is a pinned key's entire reach, so cutting
            it is an outright revoke and `revoked_at` is where that shows.
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Written asynchronously on a coarse cadence — 30 seconds — so it
            answers "is this key still in use" and not "was it used in the last
            few seconds". That tolerance is why the rotation grace window has a
            floor: a predecessor reading as idle may have been used up to
            30 seconds ago.
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        rotated_at:
          type: string
          format: date-time
          nullable: true
          description: When this key was replaced by a successor. Set on the predecessor only.
        grace_expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When a rotated predecessor stops authenticating. Enforced on every
            request from this value, so it holds whether or not housekeeping has
            written the matching `revoked_at`.
        successor_id:
          type: string
          format: uuid
          nullable: true
          description: The key this one was rotated into. A key rotates once, so there is at most one.
        created_at: { type: string, format: date-time }

    CreatedAPIKey:
      type: object
      additionalProperties: false
      description: |
        An APIKey plus the token. Spelled out rather than composed with allOf,
        because `additionalProperties: false` on the base would reject the very
        field this schema adds.
      required:
        [id, name, prefix, scopes, org_wide, organization_id,
         revoked_organizations, last_used_at, expires_at, revoked_at,
         rotated_at, grace_expires_at, successor_id, created_at, key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        org_wide: { type: boolean }
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: The key's reach. See `organization_id` on APIKey.
        revoked_organizations:
          type: array
          items: { $ref: '#/components/schemas/APIKeyOrgRevocation' }
          description: |
            Always empty here. Nothing can have barred a key that did not exist
            when the bar would have been written. Present because the shape of a
            key is one shape wherever it appears.
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        rotated_at: { type: string, format: date-time, nullable: true }
        grace_expires_at: { type: string, format: date-time, nullable: true }
        successor_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        key:
          type: string
          description: The full token. This response is the only place it ever appears.

    RotatedAPIKey:
      type: object
      additionalProperties: false
      description: |
        The successor, plus the fate of the key it replaced. Spelled out for the
        reason CreatedAPIKey is.
      required:
        [id, name, prefix, scopes, org_wide, organization_id,
         revoked_organizations, last_used_at, expires_at, revoked_at,
         rotated_at, grace_expires_at, successor_id, created_at, key,
         predecessor]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: The predecessor's name, carried over. A rotation is the same credential's next generation.
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        org_wide: { type: boolean }
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The successor's reach: the predecessor's, or narrower. `null` only
            when the key it replaced was already account-wide — a successor may
            not reach more organizations than its predecessor.
        revoked_organizations:
          type: array
          items: { $ref: '#/components/schemas/APIKeyOrgRevocation' }
          description: |
            **The predecessor's bars, carried onto the successor** — not empty,
            and this is the one key shape where it is not. A reach revocation
            names a key id and rotation mints a new one, so the rows are copied
            inside the rotation transaction; without that the bar would be
            escapable by the credential it was aimed at, using nothing but its
            own token. The `revoked_at` and the administrator behind each bar are
            the predecessor's, unchanged, so rotating does not re-date somebody
            else's decision.

            Empty in the two pinned directions, because neither has rows to
            carry: nothing bars a key whose one organization *is* its reach —
            cutting that reach revokes the key outright — and an account-wide key
            that rotates into a pinned successor is pinned to an organization it
            was by construction not barred from.
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            The predecessor's **lifetime**, measured from now — not its
            deadline, which would produce a successor expiring at the same
            instant as the key it replaced. A key created to live 30 days
            rotates into another that lives 30 days; a key with no expiry
            rotates into one with no expiry. This is the one dimension a
            rotation deliberately refreshes.
        revoked_at: { type: string, format: date-time, nullable: true }
        rotated_at: { type: string, format: date-time, nullable: true }
        grace_expires_at: { type: string, format: date-time, nullable: true }
        successor_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        key:
          type: string
          description: The successor's full token. This response is the only place it ever appears.
        predecessor:
          type: object
          additionalProperties: false
          required: [id, prefix, stops_working_at]
          properties:
            id: { type: string, format: uuid }
            prefix: { type: string }
            stops_working_at:
              type: string
              format: date-time
              description: The far edge of the grace window. After it the predecessor authenticates nothing.

    APIKeyOrgRevocation:
      type: object
      additionalProperties: false
      required: [organization_id, organization_name, revoked_at]
      description: |
        One organization cut out of an account-wide key's reach (0.3.0).
      properties:
        organization_id: { type: string, format: uuid }
        organization_name:
          type: string
          description: |
            Carried because the question this answers is asked in words — *why
            does my key work in Acme and not in Beta* — and a uuid answers it in
            none of them. It discloses nothing new: a bar can only exist on a key
            whose owner held an organization-wide membership there.
        revoked_at: { type: string, format: date-time }
      # Who did it is deliberately absent. The row records it, and naming an
      # administrator of another organization to a credential's holder is a
      # disclosure nothing asked for; the audit record in that organization is
      # where the actor is, for the people entitled to read it.

    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            Permission slugs you hold. Nine are never grantable to a key:
            `apikeys.read`, `apikeys.write`, `org.delete`, `audit.read`,
            `webhooks.write`, `automation.write`, `instance.admin`,
            `destinations.decide` and `audit.read.instance`. A key that can mint
            keys or delete an organization needs a human behind it; a webhook or
            an automation rule outlives the credential that created it; the audit
            log and its instance-wide surface disclose who acted from which
            network; deciding a disputed destination lifts an instance-wide
            blocklist entry, widening what the deciding key may point at; and
            `instance.admin` confers instance-level review, so a key holding it
            could grow the set that may delegate.
        expires_at:
          type: string
          format: date-time
          description: Optional; must be in the future. Absent means the key never expires.
        org_wide:
          type: boolean
          default: false
          description: |
            Ask for a key that is not pinned to the workspace you are acting in.
            Defaults to `false`, and refused with a `422` on the `org_wide` field
            unless you hold `apikeys.write` through an **organization-wide**
            membership — a role held in one workspace issues keys for that
            workspace.

            It does not act in every workspace at once: each request resolves a
            single workspace the way a sign-in does, bounded to one organization.
            See `org_wide` on the key itself.
        organization_id:
          type: string
          format: uuid
          description: |
            Pin the key to one organization (0.3.0). Omit it and an `org_wide`
            key is **account-wide**: it reaches every organization you hold an
            organization-wide membership in, including ones you join after the
            key is minted, which is what a personal access token does elsewhere.

            The only value accepted is the organization you are acting in;
            anything else is a `422` on this field. Minting into a tenant you are
            not currently in would need authority nothing has checked, and
            switching organization and creating it there is the same act with the
            authorization visible.

            Ignored when `org_wide` is `false`: a workspace-bound key is pinned to
            its workspace's organization by construction. Naming your own
            organization there is a no-op; naming a different one is still
            refused.

            Pinning cannot be undone. A pinned key may rotate into another pinned
            key and never into an account-wide one, so this field is the one
            irreversible choice on this form — which is why omitting it is the
            wide answer and supplying it is the narrow one.

    RotateAPIKeyRequest:
      type: object
      additionalProperties: false
      description: |
        Every field is optional and so is the body itself: `POST` with nothing
        rotates into an identical successor with the default grace window.
      properties:
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            Narrows the successor. Omit for scopes identical to this key's. A
            scope this key does not already hold is refused rather than trimmed —
            a successor is identical or narrower, never wider.
        grace_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          default: 3600
          description: |
            How long both secrets verify. Bounded on both sides. The floor is ten
            times the `last_used_at` flush cadence, so "has anything still used
            the old key" is answerable before the window closes; the ceiling is
            what keeps a rotated-away credential's life finite.
        reach:
          type: string
          enum: [organization, account]
          description: |
            Narrows the successor's tenancy (0.3.0), which is the second axis of
            *identical or narrower*. Omit to copy this key's reach, which is what
            an unattended rotation sends.

            `organization` pins the successor to the organization this request
            resolved into. Available to an account-wide key, and a no-op for one
            that is already pinned there.

            `account` asks for an account-wide successor. A no-op for a key that
            is already account-wide, and a `422` on this field for a pinned one:
            a successor may not reach more organizations than the key it
            replaces, and rotation is authorized by the key's own token, so
            widening would be a credential granting itself a tenant nobody signed
            in to authorize. It exists so that refusal can be *said* rather than
            being a shape the API declines to have a word for.

    InvitationStatus:
      type: string
      enum: [pending, expired, revoked, redeemed]
      description: |
        Derived from the row and the clock rather than stored, so `expired`
        needs no job to become true. Precedence is revoked, then redeemed, then
        expired: a revoked invitation that has also lapsed reads `revoked`,
        because that is what somebody did to it.

    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, invited_by, status, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email:
          type: string
          description: The address this invitation is bound to. Only it can redeem.
        role:
          type: string
          description: The role the membership will carry.
        invited_by:
          type: string
          description: |
            Who sent it, as an address. Empty once that account is gone — the
            invitation outlives it, the same way an audit record does.
        status:
          $ref: "#/components/schemas/InvitationStatus"
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        redeemed_at: { type: string, format: date-time }

    CreatedInvitation:
      type: object
      additionalProperties: false
      description: |
        An Invitation plus the two things that exist only in the response that
        made it. Spelled out rather than composed with allOf, for the reason
        CreatedAPIKey is: `additionalProperties: false` on the base would reject
        the very fields this schema adds.
      required: [id, email, role, invited_by, status, created_at, expires_at, url, emailed]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        invited_by: { type: string }
        status:
          $ref: "#/components/schemas/InvitationStatus"
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        redeemed_at: { type: string, format: date-time }
        url:
          type: string
          description: |
            The copyable link, and the only place the token ever appears. Give
            it to the person named in `email`; it works for nobody else.
        emailed:
          type: boolean
          description: |
            Whether a message was queued. `false` on an instance with no SMTP
            relay, which is the default and not a failure.

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: The address to invite. The invitation works for this one only.
        role:
          type: string
          enum: [owner, admin, editor, viewer]
          description: |
            At or below your own rank; above it answers `403`. Authenticated
            with an API key, `editor` and `viewer` are the only values accepted.
            Omitted means `viewer`.

    RedeemInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, email, password]
      properties:
        token:
          type: string
          description: The token from the invitation link's last path segment.
        email:
          type: string
          description: |
            The address the invitation was issued to. Any other address is
            refused, and refused identically to every other failure.
        name:
          type: string
          description: |
            Used only when the account is being created; defaults to the local
            part of the address. Ignored when the account already exists.
        password:
          type: string
          minLength: 12
          description: |
            The password of the existing account, or the password of the account
            being created.

    RedeemedInvitation:
      type: object
      additionalProperties: false
      required: [user_id, organization_id, organization_name, role, account_created]
      properties:
        user_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        role: { type: string }
        account_created:
          type: boolean
          description: |
            True when the account did not exist and was made here. False means
            an account you already had gained a membership.

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_label, action]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_label:
          type: string
          description: |
            Who acted, snapshotted when the event was written so the record
            survives the account being deleted. Usually an email address;
            `system` for an action with no signed-in actor; `deleted account`
            once the account has been deleted and the hourly erasure pass has
            run, which is a constant and therefore identical for every erased
            actor.
        actor_id:
          type: string
          format: uuid
          description: >-
            The acting user. Absent on records written by something that is not
            a person — the domain-verification job, a migration. Never cleared,
            erasure included, which is what keeps one erased actor's entries
            distinguishable from another's.
        actor_api_key_id:
          type: string
          format: uuid
          description: |
            Present when the action was taken with an API key rather than
            interactively — the distinction that matters during an incident.
        action:
          type: string
          description: Dotted `noun.verb`, e.g. `domain.root_redirect_changed`.
        target_type:
          type: string
          description: The kind of object acted on. Absent for instance-wide settings.
        target_id: { type: string, format: uuid }
        workspace_id:
          type: string
          format: uuid
          description: |
            The workspace the action happened in. Absent for organization-level
            actions, which is most of the invitation and membership vocabulary.

            The log itself is **not** filtered by workspace — one that could be
            narrowed to wherever the reader happens to be standing would hide
            exactly the actions worth reviewing. This field is how a reader tells
            a link-scoped action apart afterwards: `link.bot_blocking_changed`
            names the link as its target and nothing else, where `workspace.*`
            actions carry the workspace as `target_id` already.
        ip_prefix:
          type: string
          description: |
            The network the change came from — `/24` for IPv4, `/48` for IPv6.
            Never a full address. Absent for actions taken outside a request,
            such as from the CLI.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Detail that varies by action, such as the old and new values of a
            setting. Shape is per-action and not part of this contract.

    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, title, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: Dotted `noun.event`, e.g. `audit.growth`.
        title: { type: string }
        body: { type: string }
        data:
          type: object
          additionalProperties: true
          description: |
            Per-kind detail, returned verbatim. `audit.growth` carries `bytes`
            and `threshold`, so a client can render the numbers without parsing
            them back out of the sentence. `update.available` carries `version`
            and `running`, for the same reason — and `version` is also what
            records that this reader has already been told about that release,
            so it is never repeated.
        workspace_id:
          type: string
          format: uuid
          description: |
            The workspace this notification belongs to. Absent when it belongs to
            the organization rather than to one workspace — a dispute decision,
            an audit-growth warning — and those are shown wherever the reader is
            acting.

            **The inbox is filtered by the workspace you are acting in since
            0.2.0.** Before that every notification was shown everywhere, while
            the column recording which workspace produced one was written and
            read by nothing.
        read_at:
          type: string
          format: date-time
          description: Absent while unread. Set once, on the first mark-read.
        created_at: { type: string, format: date-time }

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: string
          description: Opaque keyset cursor; present when `has_more`.
        has_more: { type: boolean }

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          description: Opaque keyset cursor; present when `has_more`.
        has_more: { type: boolean }

    InstanceReviewer:
      type: object
      additionalProperties: false
      required: [user_id, email, name, granted_at, can_decide]
      description: |
        One account holding instance-level review.

        There is no scope list here, for the reason the grant request has no
        scope field: what instance-level review is, is fixed.
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        granted_at:
          type: string
          format: date-time
          description: When they were appointed.
        granted_by:
          type: string
          format: uuid
          description: >
            Who appointed them. Absent for the account that claimed the
            instance, which nobody appointed.
        can_decide:
          type: boolean
          description: >
            Whether they hold the deciding half as well as the reading half.
            Normally true; the halves are separately revocable, so a list that
            folded them together would show a state the instance cannot be in.

    Dispute:
      type: object
      additionalProperties: false
      required:
        [id, host_defanged, destination_defanged, reason_code, status, filed_by,
         created_at, liftable]
      description: |
        One appeal against a blocked destination.

        **Both URL-shaped fields are defanged and there is no un-defanged form
        available anywhere in this API.** That is deliberate: this object is
        handed to whoever administers the instance, describing a destination a
        stranger chose, and a consumer written later must not be able to render
        it live by forgetting to escape it.
      properties:
        id: { type: string, format: uuid }
        host_defanged:
          type: string
          description: |
            The destination's host **as it was typed**, inert. `evil.example`
            reads `evil[.]example`.
        blocked_host_defanged:
          type: string
          description: |
            The `blocked_destinations` entry this dispute is about, inert —
            the row `allow` deletes, recorded when the dispute was filed.

            **It is often not `host_defanged`.** The runtime list matches on
            label boundaries, so a refusal at `login.evil.example` comes from
            the row that says `evil.example`, and that row is refused for every
            workspace on the instance. Render this one, not the host, wherever
            you offer the decision.

            Absent when no row produced the refusal: a punycode homograph,
            credentials before the host, and a reputation-feed verdict are all
            computed on every judgement. For the first two `liftable` is
            `false`; for a feed verdict the decision itself is the override and
            nothing is deleted.
        destination_defanged:
          type: string
          description: |
            The attempted URL, inert. Every `:` and `.` is bracketed and
            everything outside a narrow safe set is percent-escaped, so no
            `://` survives and nothing auto-links.
        reason_code:
          type: string
          description: |
            M30's `<tier>.<rule>`. Always a `low_confidence.` code, because no
            other tier can be disputed.
          example: low_confidence.operator_blocklist
        status:
          type: string
          enum: [open, allowed, upheld]
        filed_by:
          type: string
          description: |
            The address of whoever filed it, snapshotted when the dispute was
            written so it stays readable after the account is deleted.
        created_at: { type: string, format: date-time }
        decided_by:
          type: string
          description: Absent until somebody decides.
        decided_at: { type: string, format: date-time }
        liftable:
          type: boolean
          description: |
            Whether `allow` could do anything. `false` for a refusal computed
            from the URL rather than held as a blocklist row — a punycode
            homograph, or credentials before the host — where the honest
            decisions are `uphold` or a change to the rule.

    DisputePage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dispute"
        next_cursor:
          type: string
          description: Opaque keyset cursor; present when `has_more`.
        has_more: { type: boolean }
