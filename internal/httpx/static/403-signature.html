<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>This link needs a signed URL</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#fafafa; color:#18181b; }
  @media (prefers-color-scheme: dark) { body { background:#0a0a0a; color:#e4e4e7; } }
  main { text-align:center; padding:2rem; max-width:28rem; }
  h1 { font-size:3rem; margin:0 0 .5rem; font-weight:650; letter-spacing:-.02em; }
  p { margin:0; opacity:.7; }
</style>
</head>
<body>
<main>
  <h1>403</h1>
  <!--
    One message for four causes — no signature, a wrong one, an expired one, and
    a workspace with no key at all. Which of them applies is not the visitor's
    business, and telling them would turn this page into an oracle somebody could
    use to distinguish "the link exists and my signature has expired" from "my
    signature was never valid", one guess at a time.
  -->
  <p>This link can only be opened through a signed link that has not expired.</p>
</main>
</body>
</html>
