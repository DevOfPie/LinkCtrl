<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>This link needs a password</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#fafafa; color:#18181b; }
  @media (prefers-color-scheme: dark) { body { background:#0a0a0a; color:#e4e4e7; } }
  main { text-align:center; padding:2rem; max-width:24rem; width:100%; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; font-weight:650; letter-spacing:-.02em; }
  p { margin:0 0 1.5rem; opacity:.7; }
  form { display:flex; flex-direction:column; gap:.75rem; }
  input { font:inherit; padding:.6rem .75rem; border-radius:.5rem;
          border:1px solid #d4d4d8; background:#fff; color:inherit; }
  @media (prefers-color-scheme: dark) { input { background:#18181b; border-color:#3f3f46; } }
  button { font:inherit; font-weight:600; padding:.6rem .75rem; border:0;
           border-radius:.5rem; background:#18181b; color:#fafafa; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { background:#e4e4e7; color:#18181b; } }
  .err { color:#b91c1c; font-weight:600; opacity:1; }
  @media (prefers-color-scheme: dark) { .err { color:#f87171; } }
</style>
</head>
<body>
<main>
  <h1>This link needs a password</h1>
  <p class="err">That password is not right.</p>
  <!--
    No action attribute, deliberately. The form posts to the URL it was served
    from, which is the alias itself, so this page needs no template engine and
    no knowledge of the link it belongs to: it is the same bytes for every
    password link on the instance and is embedded in the binary before main
    runs.

    No CSRF token either, and that is D53 rather than an omission. This POST
    issues nothing — no cookie, no unlock token, no session — so a forged
    submission changes no state and cannot read the cross-origin Location it
    would receive. If anything is ever made to persist across clicks, that
    reasoning stops holding and the decision is revisited rather than inherited.
  -->
  <form method="post" autocomplete="off">
    <input type="password" name="password" aria-label="Password" autofocus required>
    <button type="submit">Continue</button>
  </form>
</main>
</body>
</html>
