<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · LinkCtrl</title>
  <link rel="stylesheet" href="/static/css/app.css?v=pnpIg4DzEwg">
  <link rel="icon" href="/static/favicon.svg?v=koRefkmuctk" type="image/svg+xml">
  
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
  <script src="/static/js/htmx.min.js?v=V9kZFRUzmSI" defer></script>
  
  <script src="/static/js/qr-size.js?v=gZNB-vBhtaI"></script>
  
  <script src="/static/js/addon-select.js?v=DZ84k30itTA" defer></script>
</head>
<body class="min-h-full bg-surface text-ink antialiased">

<main class="mx-auto max-w-6xl px-4 py-8">

<div class="mx-auto mt-16 max-w-sm">
  <div class="mb-8 text-center">
    <h1 class="text-2xl font-semibold tracking-tight">LinkCtrl</h1>
    <p class="mt-1 text-sm text-muted">Sign in to your dashboard</p>
  </div>
  <div class="rounded-lg border border-line bg-raised p-6 shadow-sm">
    <div class="mb-4 rounded-md border border-danger-line bg-danger-soft px-4 py-3 text-sm text-danger-ink">Nope.</div>
    
    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="/links">
      <div>
        <label for="email" class="block text-sm font-medium text-ink">Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username" value=""
               class="mt-1 block w-full rounded-md border border-line-strong px-3 py-2 text-sm focus:border-accent focus:outline-none">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-ink">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="mt-1 block w-full rounded-md border border-line-strong px-3 py-2 text-sm focus:border-accent focus:outline-none">
      </div>
      <button type="submit" class="w-full rounded-md bg-accent px-3 py-2 text-sm font-medium text-on-accent hover:bg-accent-hover">Sign in</button>
    </form>
    
    
  </div>
  
  
  
  <div class="mt-6 flex justify-center">
    
<form method="post" action="/theme">
  <input type="hidden" name="next" value="/dashboard">
  <div role="group" aria-label="Appearance"
       class="inline-flex items-center gap-1 rounded-lg border border-line bg-sunken p-1">
    


<button type="submit" name="theme" value="system"
        aria-current="true"
        class="rounded-md px-3 py-1 text-sm bg-raised font-medium text-ink shadow-sm">System</button>

    


<button type="submit" name="theme" value="light"
        
        class="rounded-md px-3 py-1 text-sm text-muted hover:text-ink">Light</button>

    


<button type="submit" name="theme" value="dark"
        
        class="rounded-md px-3 py-1 text-sm text-muted hover:text-ink">Dark</button>

  </div>
</form>

  </div>
</div>

</main>
</body>
</html>
