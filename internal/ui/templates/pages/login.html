{{define "content"}}
<div class="mx-auto mt-16 max-w-sm">
  <div class="mb-8 text-center">
    <h1 class="text-2xl font-semibold tracking-tight">LinkCtrl</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in to your dashboard</p>
  </div>
  <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    {{template "flash_error" .Error}}
    {{template "flash_ok" .Notice}}
    <form method="post" action="/login" class="space-y-4">
      {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username" value="{{.Email}}"
               class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500">Sign in</button>
    </form>
  </div>
</div>
{{end}}
