# Cross-shell equivalent of the Makefile, for contributors on Windows without
# make. Keep the two in sync; the Makefile is the reference.
version: "3"

vars:
  BIN: bin
  MODULE: github.com/DevOfPie/LinkCtrl
  TAILWIND_VERSION: v4.1.14
  # Keep in sync with the Makefile, which is the reference.
  HTMX_VERSION: v2.0.9
  HTMX_SHA256: 57d9191515339922bd1356d7b2d80b1ee3b29f1b3a2c65a078bb8b2e8fd9ae5f
  SWAGGER_UI_VERSION: v5.32.11
  SWAGGER_CSS_SHA256: ca238f7d7c2cf4480c1e77a9c3b9da915ab216e96ffd354e69076560c650c6de
  SWAGGER_JS_SHA256: fcb81e2c79e7e3b76ddb9bd7fc791552045040fde05c19d3f98f9213e7f7724d
  WORLDMAP_VERSION: 2.0.2
  WORLDMAP_SHA256: 2516c915867c7baf18ddec727aec46c315541a07cfb3d79a6559b05d5e94eee8
  WORLDMAP_FILE: assets/world-atlas/countries-110m.json
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || echo unknown
  DATE:
    sh: git log -1 --format=%cI 2>/dev/null || echo unknown
  LDFLAGS: >-
    -s -w
    -X '{{.MODULE}}/internal/build.version={{.VERSION}}'
    -X '{{.MODULE}}/internal/build.commit={{.COMMIT}}'
    -X '{{.MODULE}}/internal/build.date={{.DATE}}'

  # Which development instance these act on: test (disposable, the default) or
  # demo (long-lived). Separate compose projects, separate volumes, separate
  # ports — docs/dev-notes/instances.md. Override per invocation:
  #
  #   task up INSTANCE=demo
  #
  # The default is the disposable one on purpose; see the Makefile.
  INSTANCE: '{{.INSTANCE | default "test"}}'
  ENV_FILE: .env.{{.INSTANCE}}
  PROJECT: linkctrl-{{.INSTANCE}}

  # The dev database password is read from the instance's env file, which is
  # where compose reads it too and therefore what the database was initialised
  # with. A literal here is wrong for every instance that generated its own, and
  # the resulting "password authentication failed" reads as a broken database
  # rather than a stale variable. An exported POSTGRES_PASSWORD wins, for CI.
  #
  # A password with characters that are not URL-safe must be percent-encoded,
  # since this is assembled into a DSN.
  POSTGRES_USER: linkctrl
  POSTGRES_DB: linkctrl
  DB_PASSWORD:
    sh: 'if [ -n "$POSTGRES_PASSWORD" ]; then printf %s "$POSTGRES_PASSWORD"; else sed -n "s/^POSTGRES_PASSWORD=//p" .env.{{.INSTANCE | default "test"}} 2>/dev/null | head -1 | tr -d "\r"; fi'
  DB_PORT:
    sh: 'sed -n "s/^POSTGRES_PORT=//p" .env.{{.INSTANCE | default "test"}} 2>/dev/null | head -1 | tr -d "\r"'
  REDIS_PORT:
    sh: 'sed -n "s/^REDIS_PORT=//p" .env.{{.INSTANCE | default "test"}} 2>/dev/null | head -1 | tr -d "\r"'
  HTTP_PORT:
    sh: 'sed -n "s/^LINKCTRL_HTTP_PORT=//p" .env.{{.INSTANCE | default "test"}} 2>/dev/null | head -1 | tr -d "\r"'

  # Vars, not the global env block. Values there are not templated against these
  # vars, so the DSN silently came out as postgres://:@localhost:55432/ — which
  # is a valid URL, so it failed at connect time as the wrong Postgres user
  # rather than at parse time.
  DEV_DATABASE_URL: postgres://{{.POSTGRES_USER}}:{{.DB_PASSWORD}}@localhost:{{.DB_PORT}}/{{.POSTGRES_DB}}?sslmode=disable
  DEV_REDIS_URL: redis://localhost:{{.REDIS_PORT}}/0

  # Both the flags and the variables: the flags are for the calls in this file,
  # the variables for the scripts it invokes, whose own `docker compose` calls
  # would otherwise land on the default project.
  COMPOSE: docker compose -p {{.PROJECT}} --env-file {{.ENV_FILE}}

  # The platforms a release publishes. linux/amd64 and linux/arm64 are the
  # deployment targets; the darwin and windows builds exist so an operator can
  # run lctl against a remote database from their own machine.
  RELEASE_PLATFORMS: linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64
  DIST: dist

env:
  COMPOSE_PROJECT_NAME: linkctrl-{{.INSTANCE | default "test"}}
  COMPOSE_ENV_FILES: .env.{{.INSTANCE | default "test"}}

tasks:
  default:
    cmds: [task --list]

  # Postgres and Redis, for the commands that run on this host and talk to them
  # directly. Not the app: `task run` needs the port the app container holds, and
  # the integration suite builds its own server with httptest rather than calling
  # a container. The test instance is stopped when idle, so anything needing a
  # database has to be able to start one.
  require-stack:
    internal: true
    cmds:
      - "{{.COMPOSE}} ps --status running --services 2>/dev/null | grep -qx postgres
         || {{.COMPOSE}} up -d --wait postgres redis"

  # The whole stack, for the tasks that drive the app over HTTP.
  require-app:
    internal: true
    cmds:
      - "{{.COMPOSE}} ps --status running --services 2>/dev/null | grep -qx app
         || {{.COMPOSE}} up -d --wait"

  build:
    desc: Build the server and the operator CLI
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}}/ ./cmd/...

  # Against the instance's database and Redis, on the instance's port, with the
  # instance's configuration — not `.env`, whose DSN and Redis URL name compose
  # network hosts that do not resolve here. Stop that instance's app container
  # first; both cannot hold the same port.
  run:
    desc: Run the server from source against the instance's data
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    dotenv: ['{{.ENV_FILE}}']
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/linkctrl
    env:
      LINKCTRL_APP_ENV: development
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"
      LINKCTRL_REDIS_URL: "{{.DEV_REDIS_URL}}"
      LINKCTRL_HTTP_ADDR: ":{{.HTTP_PORT}}"

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.BIN}} {{.DIST}} cover.out coverage.html

  test:
    desc: Unit tests with the race detector
    cmds:
      - go test -race -covermode=atomic -coverprofile=cover.out ./...

  # LINKCTRL_REDIS_URL matters as much as the DSN: without it the Redis tier tests
  # fall back to localhost:6379, find nothing there and *skip*. The suite stays
  # green while tests that never ran claim to cover the cache.
  test-integration:
    desc: Integration tests (needs Postgres and Redis)
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} test-integration
      # cmd/lctl carries one integration test of its own: the demo coverage list
      # (M33.5), which has to seed a database to know whether the demo shows
      # anything. It cannot live in test/integration, because that package cannot
      # import package main.
      - go test -race -tags=integration ./test/integration/... ./cmd/lctl/...
    env:
      TEST_DATABASE_URL: "{{.DEV_DATABASE_URL}}"
      LINKCTRL_REDIS_URL: "{{.DEV_REDIS_URL}}"

  cover:
    desc: Open the coverage report
    deps: [test]
    cmds:
      - go tool cover -html=cover.out -o coverage.html

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  check-links:
    desc: Verify every relative link and anchor in tracked markdown
    cmds:
      - bash scripts/check-links.sh

  shellcheck:
    desc: Lint every shell script
    cmds:
      - shellcheck scripts/*.sh

  # Not a gate. The operating contract is documentation and documentation is read
  # into a context window on every task, so its size is a cost that recurs and
  # compounds; this measures it before it is large enough to hurt. Regenerating on
  # an unchanged tree produces no diff, so every diff in the report is real growth.
  doc-cost:
    desc: What the always-read docs cost — predicted vs realized
    cmds:
      - bash scripts/doc-cost.sh > docs/build-notes/doc-cost.md
      - echo "wrote docs/build-notes/doc-cost.md"

  vuln:
    desc: Check for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  tidy:
    desc: Tidy and verify modules
    cmds:
      - go mod tidy
      - go mod verify

  check:
    desc: Everything CI runs, short of integration tests
    cmds:
      - task: tidy
      - task: lint
      - task: shellcheck
      - task: test

  generate:
    desc: Regenerate all generated code
    cmds:
      - task: sqlc
      - task: openapi

  sqlc:
    cmds: [sqlc generate]

  sqlc-vet:
    desc: Prepare every query against a live database
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - sqlc vet -f sqlc-vet.yaml
    env:
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"

  # LINKCTRL_APP_ENV must be in the environment, not only in a file: config.Load
  # consults it before reading one, so without it the file is ignored and these
  # tasks fail on the three required secrets rather than on anything to do with
  # the database. LINKCTRL_DATABASE_URL is then overridden because the value
  # compose passes the container names the compose network host, which does not
  # resolve from here.
  #
  # `dotenv` loads the instance's own file, and that is not decoration: lctl runs
  # on the host, where config.Load reads `.env` — the operator quickstart file,
  # not the instance's. Overriding the DSN alone was enough to write to the right
  # database while every other value came from the wrong instance. Task's `env`
  # wins over `dotenv`, and godotenv inside lctl overwrites neither.
  migrate-up:
    desc: Apply all migrations
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    dotenv: ['{{.ENV_FILE}}']
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - go run ./cmd/lctl migrate up
    env:
      LINKCTRL_APP_ENV: development
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"

  migrate-down:
    desc: Roll back one migration
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    dotenv: ['{{.ENV_FILE}}']
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} migrate-down
      - go run ./cmd/lctl migrate down
    env:
      LINKCTRL_APP_ENV: development
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"

  migrate-status:
    desc: Show applied and pending migrations
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    dotenv: ['{{.ENV_FILE}}']
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - go run ./cmd/lctl migrate status
    env:
      LINKCTRL_APP_ENV: development
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"

  db-reset:
    desc: Drop and recreate the dev database, then migrate
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} db-reset
      - "{{.COMPOSE}} exec -T postgres psql -U {{.POSTGRES_USER}} -d postgres
        -c \"DROP DATABASE IF EXISTS {{.POSTGRES_DB}} WITH (FORCE);\"
        -c \"CREATE DATABASE {{.POSTGRES_DB}};\""
      - task: migrate-up
        vars: {INSTANCE: '{{.INSTANCE}}'}

  seed:
    desc: Seed development data
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    dotenv: ['{{.ENV_FILE}}']
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} seed
      - go run ./cmd/lctl seed --links 1000 --clicks 20000
    env:
      LINKCTRL_APP_ENV: development
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"

  demo:
    desc: Fill the instance with demo data worth looking at
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    dotenv: ['{{.ENV_FILE}}']
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} demo
      - go run ./cmd/lctl demo --reset
    env:
      LINKCTRL_APP_ENV: development
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"

  seed-slo:
    desc: Seed the dataset the SLO is defined against (100k links, 5M clicks)
    deps:
      - task: require-stack
        vars: {INSTANCE: '{{.INSTANCE}}'}
    dotenv: ['{{.ENV_FILE}}']
    preconditions:
      - sh: 'test -n "{{.DB_PASSWORD}}"'
        msg: "POSTGRES_PASSWORD is empty. Run: task env INSTANCE={{.INSTANCE}}"
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} seed-slo
      - go run ./cmd/lctl seed --reset --links 100000 --clicks 5000000
    env:
      LINKCTRL_APP_ENV: development
      LINKCTRL_DATABASE_URL: "{{.DEV_DATABASE_URL}}"

  # Guarded even though a load test only reads: it writes several hundred thousand
  # click events on the way, and the demo's analytics are meant to look like a
  # workspace rather than like a benchmark.
  load:
    desc: Measure the cached redirect SLO against a running stack
    deps:
      - task: require-app
        vars: {INSTANCE: '{{.INSTANCE}}'}
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} load
      - bash scripts/load-test.sh cached 2000 2m

  load-uncached:
    desc: Same, spread across the whole dataset so the cache cannot answer
    deps:
      - task: require-app
        vars: {INSTANCE: '{{.INSTANCE}}'}
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} load-uncached
      - bash scripts/load-test.sh uncached 500 1m

  tailwind:
    desc: Download the pinned Tailwind standalone CLI
    cmds:
      - sh scripts/get-tailwind.sh "{{.TAILWIND_VERSION}}" "{{.BIN}}"
    status:
      - test -x {{.BIN}}/tailwindcss.exe

  css:
    desc: Build the stylesheet
    deps: [tailwind]
    cmds:
      - "{{.BIN}}/tailwindcss -i internal/ui/static/css/input.css -o internal/ui/static/css/app.css --minify"

  css-watch:
    desc: Rebuild the stylesheet on change
    deps: [tailwind]
    cmds:
      - "{{.BIN}}/tailwindcss -i internal/ui/static/css/input.css -o internal/ui/static/css/app.css --watch"

  htmx:
    desc: Verify (or restore) the vendored htmx against its pinned checksum
    cmds:
      - sh scripts/get-htmx.sh "{{.HTMX_VERSION}}" "{{.HTMX_SHA256}}" internal/ui/static/js/htmx.min.js

  swagger-ui:
    desc: Verify (or restore) the vendored Swagger UI against its pinned checksums
    cmds:
      - sh scripts/get-swagger.sh "{{.SWAGGER_UI_VERSION}}" "{{.SWAGGER_CSS_SHA256}}" "{{.SWAGGER_JS_SHA256}}" internal/ui/static/vendor

  worldmap:
    desc: Verify (or restore) the vendored world map against its pinned checksum
    cmds:
      - sh scripts/get-worldmap.sh "{{.WORLDMAP_VERSION}}" "{{.WORLDMAP_SHA256}}" "{{.WORLDMAP_FILE}}"

  # Generated output, committed like sqlc's dbgen. Re-running it on an unchanged
  # tree must produce no diff, which is the same property `task sqlc` is held to.
  mapgen:
    desc: Regenerate the world-map SVG paths from the vendored TopoJSON
    deps: [worldmap]
    cmds:
      - go run ./internal/ui/geo/mapgen "{{.WORLDMAP_FILE}}" internal/ui/geo/countries_gen.go

  # What CI runs instead of `task htmx swagger-ui worldmap`. Those tasks repair a
  # stale copy, which is right for a developer and wrong for a gate: a gate that
  # fixes what it finds reports success on a tampered blob. VERIFY_ONLY makes the
  # mismatch fatal instead.
  verify-assets:
    desc: Fail if a vendored asset does not match its pinned checksum
    cmds:
      - sh scripts/get-htmx.sh "{{.HTMX_VERSION}}" "{{.HTMX_SHA256}}" internal/ui/static/js/htmx.min.js
      - sh scripts/get-swagger.sh "{{.SWAGGER_UI_VERSION}}" "{{.SWAGGER_CSS_SHA256}}" "{{.SWAGGER_JS_SHA256}}" internal/ui/static/vendor
      - sh scripts/get-worldmap.sh "{{.WORLDMAP_VERSION}}" "{{.WORLDMAP_SHA256}}" "{{.WORLDMAP_FILE}}"
    env:
      VERIFY_ONLY: "1"

  openapi:
    desc: Validate the OpenAPI document against the implementation
    cmds:
      - go test ./internal/httpx/ -run TestOpenAPI -count=1

  assets:
    desc: Everything `go build` embeds
    cmds:
      - task: htmx
      - task: swagger-ui
      - task: css

  env:
    desc: Create the instance's env file if it does not exist
    cmds:
      - bash scripts/instance.sh init {{.INSTANCE}}

  instances:
    desc: Both development instances and whether they are running
    cmds:
      - bash scripts/instance.sh list

  up:
    desc: Start the full stack
    cmds:
      - test -f {{.ENV_FILE}} || bash scripts/instance.sh init {{.INSTANCE}}
      - "{{.COMPOSE}} up -d --wait"

  down:
    desc: Stop the stack and remove volumes
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} down
      - "{{.COMPOSE}} down -v"

  stop:
    desc: Stop the stack, keeping its volumes
    cmds:
      - "{{.COMPOSE}} stop"

  # What the systemd timer runs every five minutes. Here so the decision can be
  # inspected without reading the journal — it reports what it sees and why.
  idle-stop:
    desc: Stop the test instance if nothing has used it (IDLE_MINUTES=30)
    cmds:
      - bash scripts/idle-stop.sh test {{.IDLE_MINUTES | default 30}}

  logs:
    desc: Follow application logs
    cmds:
      - "{{.COMPOSE}} logs -f app"

  rebuild:
    desc: Recreate the instance from scratch and migrate
    cmds:
      - CONFIRM={{.CONFIRM}} bash scripts/instance.sh guard {{.INSTANCE}} rebuild
      - "{{.COMPOSE}} down -v"
      - test -f {{.ENV_FILE}} || bash scripts/instance.sh init {{.INSTANCE}}
      - "{{.COMPOSE}} up -d --build --force-recreate --wait"
      - task: migrate-up
        vars: {INSTANCE: '{{.INSTANCE}}'}

  # The milestone refresh, and the only thing that should write to the demo. The
  # clean-tree check is the enforcement: the demo shows the last validated
  # milestone, and a build carrying uncommitted work is not one. FORCE=1
  # overrides it, for deliberately demoing work in progress.
  demo-update:
    desc: Rebuild the demo from the current commit and refresh its data
    preconditions:
      - sh: '[ -n "{{.FORCE}}" ] || [ -z "$(git status --porcelain)" ]'
        msg: "The working tree is dirty, so this build is not the validated milestone. Commit first, or pass FORCE=1."
    cmds:
      - test -f .env.demo || bash scripts/instance.sh init demo
      - docker compose -p linkctrl-demo --env-file .env.demo up -d --build --force-recreate --wait
      - task: demo
        vars: {INSTANCE: demo, CONFIRM: demo}

  docker-build:
    desc: Build the production image
    cmds:
      - docker build -t linkctrl:{{.VERSION}} -t linkctrl:dev
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        --build-arg DATE={{.DATE}} .

  # One archive format for every platform, tar.gz included for Windows. Windows
  # 10 and later ship tar, so the format costs a Windows user nothing — while
  # shipping .zip would mean either a zip tool on every build host or an artifact
  # whose format depends on where it was built, and neither is worth it.
  #
  # A plain shell loop rather than Task's `for:`, so this stays a line-for-line
  # reading of the Makefile recipe it mirrors — including the explicit
  # `|| exit 1` per step, since `set -e` would abort on the ext assignment for
  # every platform that is not windows.
  dist:
    desc: Cross-compile release binaries with checksums into dist/
    deps: [assets]
    cmds:
      - |
        rm -rf {{.DIST}} && mkdir -p {{.DIST}} || exit 1
        for platform in {{.RELEASE_PLATFORMS}}; do
          os=${platform%/*}; arch=${platform#*/}; ext=""
          [ "$os" = windows ] && ext=".exe"
          echo "  $os/$arch"
          name="linkctrl_{{.VERSION}}_${os}_${arch}"
          mkdir -p "{{.DIST}}/$name" || exit 1
          for cmd in linkctrl lctl; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "{{.LDFLAGS}}" \
              -o "{{.DIST}}/$name/$cmd$ext" ./cmd/$cmd || exit 1
          done
          cp LICENSE README.md CHANGELOG.md .env.example "{{.DIST}}/$name/" || exit 1
          ( cd {{.DIST}} && tar czf "$name.tar.gz" "$name" ) || exit 1
          rm -rf "{{.DIST}}/$name"
        done
        cd {{.DIST}} && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

  release-check:
    desc: Everything that must hold before tagging a release
    cmds:
      - bash scripts/release-check.sh
