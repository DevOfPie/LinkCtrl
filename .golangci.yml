# golangci-lint v2 configuration.
#
# Note the nesting: in v2, linter settings and exclusions belong under `linters`,
# and formatter settings under `formatters`. Top-level `settings:` and
# `exclusions:` blocks are accepted and then ignored, so the symptom of getting
# this wrong is a lint run reporting rules the file believes it disabled.
version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose        # a leaked response body is a slow resource leak
    - sqlclosecheck    # same for rows
    - rowserrcheck
    - nilerr           # "return nil" after checking err != nil
    - noctx            # HTTP requests without a context
    - contextcheck
    - containedctx     # a context stored in a struct field
    - errorlint        # %v on an error instead of %w, bad type assertions
    - makezero
    - durationcheck
    - exhaustive       # unhandled enum cases in a switch

    # Security
    - gosec

    # Style, kept light
    - revive
    - misspell
    - unconvert
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        # Writes to an http.ResponseWriter after the header is sent cannot be
        # meaningfully handled; the request is already on the wire.
        - (net/http.ResponseWriter).Write
        # Diagnostics on their way to a terminal. If stderr is broken there is
        # nowhere left to report that stderr is broken.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    exhaustive:
      default-signifies-exhaustive: true

    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104

    revive:
      rules:
        - name: exported
          disabled: true   # doc.go covers packages; per-symbol comments are noise
        - name: package-comments
          disabled: true

    staticcheck:
      checks:
        - all
        - -ST1000   # package comment formatting, covered by doc.go

  exclusions:
    paths:
      - internal/store/dbgen   # generated by sqlc
    rules:
      - path: _test\.go$
        linters:
          - gosec         # hardcoded test credentials are fine
          - containedctx
          - noctx
          # A test helper closes the body after decoding it, which bodyclose
          # cannot see through. Still enabled everywhere else, where a leaked
          # body outlives the test that caused it.
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DevOfPie/LinkCtrl

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
