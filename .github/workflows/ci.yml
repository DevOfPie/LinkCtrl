# The checks every change has to pass.
#
# `make check` is the local equivalent for the parts that need no services. This
# file adds the parts that do: integration tests against a real Postgres and Redis,
# and a container build. If the two ever disagree, this file is what gates a merge,
# so keep the Makefile in step with it rather than the other way round.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # So a scheduled run catches a dependency or base-image problem that no commit
  # introduced. Nothing is more confusing than a release build failing on code
  # that has not changed in weeks.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps a version from git describe, which needs history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify the vendored assets against their pinned checksums
        # verify-assets, not `make htmx swagger-ui`: those repair a mismatch and
        # exit 0, so this step passed on any tampered blob it could re-download.
        run: make verify-assets

      - name: Build the stylesheet
        run: make css

      - name: Build
        run: make build

      - name: Confirm the binaries report the version they were built with
        run: |
          set -eux
          ./bin/linkctrl version
          ./bin/lctl version
          # A stamped build reporting "commit unknown" means the ldflags path is
          # broken, which is invisible until someone needs the version.
          for bin in ./bin/linkctrl ./bin/lctl; do
            if "$bin" version | grep -q 'commit unknown'; then
              echo "$bin was built without its version stamp" >&2
              exit 1
            fi
          done

      - name: Vet
        run: go vet ./...

      - name: Unit tests with the race detector
        run: go test -race -count=1 ./...

      - name: OpenAPI document matches the registered routes
        run: go test -count=1 -run TestOpenAPI ./internal/httpx/

      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generated code matches its source
        # Must match the version stamped into internal/store/dbgen, which sqlc
        # writes into every file it emits. A mismatch fails this step on the
        # comment alone, with the rest of the diff empty — which is what it did
        # the first time this workflow ever ran, having been pinned a minor
        # version behind the committed output since it was written.
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/store/dbgen

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # The stylesheet is embedded, so the package does not compile without it and
      # the linter cannot type-check anything that imports internal/ui.
      - name: Build the stylesheet
        run: make htmx swagger-ui css
      # Action major matters here: v6 and earlier run only golangci-lint v1.x and
      # refuse the v2 config schema this repository uses — the job would fail on
      # every run. v7 is where the action gained v2 support.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: a linter that updates itself turns an unrelated release into a
          # red build, which is how nolint comments accumulate for the wrong reason.
          version: v2.12.2

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkctrl
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: linkctrl
          TZ: UTC
        options: >-
          --health-cmd "pg_isready -U linkctrl -d linkctrl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build the stylesheet
        run: make htmx swagger-ui css

      - name: The database session really is UTC
        # Partition bounds on a timestamptz resolve against the session timezone at
        # DDL time, so a non-UTC session silently creates partitions offset by its
        # own offset and leaves gaps that swallow rows. The application refuses to
        # start in that state; asserting it here means a CI-only difference cannot
        # produce a green run that hides it.
        run: |
          set -eu
          tz=$(psql "$DSN" -tAc "SHOW timezone" | tr -d '[:space:]')
          test "$tz" = "UTC" || { echo "session timezone is '$tz', not UTC" >&2; exit 1; }
        env:
          DSN: postgres://linkctrl:ci-password@localhost:5432/linkctrl?sslmode=disable
          PGPASSWORD: ci-password

      - name: Integration tests with the race detector
        run: go test -tags=integration -race -count=1 ./test/integration/
        env:
          TEST_DATABASE_URL: postgres://linkctrl:ci-password@localhost:5432/linkctrl?sslmode=disable
          LINKCTRL_REDIS_URL: redis://localhost:6379/0

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Third-party actions are pinned to commit SHAs, not tags, matching the
      # project's bar for third-party build inputs (the Tailwind, htmx and
      # Swagger downloads are all checksum-verified): a tag is a moving
      # reference its owner can repoint under a workflow's token. GitHub-owned
      # actions/* stay on tags.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Both release platforms, because the Dockerfile selects a Tailwind asset by
      # TARGETARCH and an arm64-only failure would otherwise surface for the first
      # time during a release.
      - name: Build for both release platforms
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the amd64 image and check it starts and reports itself
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: linkctrl:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: The image answers for itself
        run: |
          set -eux
          docker run --rm linkctrl:ci version
          docker run --rm --entrypoint /lctl linkctrl:ci version
          # A stamped image reporting "dev" means the build args did not reach the
          # ldflags, which nothing else in CI would notice.
          docker run --rm linkctrl:ci version | grep -q 'linkctrl ci'
