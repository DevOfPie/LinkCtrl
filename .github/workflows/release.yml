# Publishes a release: a multi-architecture image, checksummed binaries, and notes.
#
# Triggered by a tag, because the tag is the thing being released — the version the
# binaries report comes from it, so a release built from anything else would report
# a version that does not exist. scripts/release-check.sh is the local gate that
# should pass before the tag is pushed; this workflow re-runs the parts of it that
# a machine can be trusted to run.
#
# Nothing here is destructive to a previous release: tags are immutable, the image
# is pushed under the version and under `latest`, and `latest` moving is the only
# mutation.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  # So the artifact path can be exercised without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v1.2.3). Nothing is published."
        required: true
        default: v0.0.0-test

# Least privilege at the workflow level; the two jobs that publish escalate for
# themselves. The verify and binaries jobs run the test suite and third-party
# actions, and neither needs a token that can write anywhere.
permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkctrl
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: linkctrl
          TZ: UTC
        options: >-
          --health-cmd "pg_isready -U linkctrl -d linkctrl"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - id: version
        name: Resolve the version being released
        # The dispatch input and the tag name are both untrusted text. They reach
        # the shell through env — never through ${{ }} interpolation into script
        # text, where a quote in the value rewrites the script — and the shape
        # check is an anchored regex, not a glob: `v[0-9]*.[0-9]*.[0-9]*` matches
        # 'v1.2.3;rm -rf .', and git refnames permit ; $ | quotes and backticks.
        # Everything downstream may then interpolate the OUTPUT freely, because
        # only a value matching the regex ever becomes the output.
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -eu
          if ! printf '%s' "$RAW_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "version must look like v1.2.3 (optionally -prerelease), got '$RAW_VERSION'" >&2
            exit 1
          fi
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $RAW_VERSION"

      - name: The changelog documents this version
        # A release with no notes is a release nobody can decide whether to take.
        # Dispatch runs are dry runs that publish nothing, so they skip this —
        # otherwise the documented default input (v0.0.0-test) could never pass.
        if: github.event_name == 'push'
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          grep -qF "## [${v#v}]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## [${v#v}]' section" >&2; exit 1; }

      - name: Assets, build and tests
        run: |
          set -eux
          make verify-assets
          make css
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
          go test -count=1 -run TestOpenAPI ./internal/httpx/

      # ci.yml triggers on `push: branches`, which does not match a tag push, so
      # nothing else on the release path checks these. A tag could otherwise
      # publish a binary built from SQL whose generated code was never
      # regenerated — the one class of drift this project cannot see by reading.
      - name: Generated code matches its source
        run: |
          set -eux
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/store/dbgen

      - name: Modules are tidy
        run: |
          set -eux
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Same pin as ci.yml's lint job; the two must not drift.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Integration tests
        run: go test -tags=integration -race -count=1 ./test/integration/
        env:
          TEST_DATABASE_URL: postgres://linkctrl:ci-password@localhost:5432/linkctrl?sslmode=disable
          LINKCTRL_REDIS_URL: redis://localhost:6379/0

  image:
    name: Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Third-party actions pinned by commit SHA — the project's bar for
      # third-party build inputs; see ci.yml for the rationale.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        name: Build date, from the commit rather than the clock
        # The tagged commit's own timestamp, so the stamp is reproducible from the
        # tag. github.event.repository.updated_at is repository metadata and
        # changes for reasons that have nothing to do with this build.
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # Semver tags plus latest: an operator pins the exact version, and
          # `latest` exists for the quick-start compose file.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Nothing is published by a manual run; the build still has to succeed.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build the stylesheet the binaries embed
        run: make htmx swagger-ui css

      - name: Cross-compile with checksums
        run: make dist VERSION=${{ needs.verify.outputs.version }} COMMIT=${{ github.sha }}

      - name: The artifacts report the version they claim
        run: |
          set -eux
          tar xzf dist/linkctrl_${{ needs.verify.outputs.version }}_linux_amd64.tar.gz \
            -C /tmp --strip-components=1 --wildcards '*/linkctrl' '*/lctl'
          /tmp/linkctrl version | grep -q "linkctrl ${{ needs.verify.outputs.version }}"
          /tmp/lctl version     | grep -q "linkctrl ${{ needs.verify.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [verify, image, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract this version's changelog section
        run: |
          set -eu
          v="${{ needs.verify.outputs.version }}"
          # Lowercased to match what was actually pushed: registries reject
          # mixed-case references, and metadata-action lowercases the repository
          # name — notes printing ghcr.io/DevOfPie/LinkCtrl would tell readers to
          # pull an image that does not exist.
          image=$(printf '%s' "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          # From this version's heading to the next one, exclusive — and
          # stopping at the link-reference block, which is the second exit (F1).
          #
          # The newest version is always the *last* section in CHANGELOG.md, so
          # "to the next ## [ heading" runs off the end of the file and sweeps
          # up the trailing `[Unreleased]: https://…` definitions. The published
          # v0.1.0 body carries them, immediately before its Container image
          # section — confirmed against the live release rather than inferred.
          #
          # It survived a release because a reference definition renders as
          # nothing: invisible on the release page, present in the raw body, and
          # so reported by nobody.
          awk -v ver="## [${v#v}]" '
            index($0, ver) == 1  { inside = 1; next }
            inside && /^## \[/    { exit }
            inside && /^\[[^]]+\]: / { exit }
            inside                { print }
          ' CHANGELOG.md > notes.md
          # Drop the blank lines the exit above leaves behind, so the notes do
          # not end in whitespace that was only ever a separator.
          printf '%s\n' "$(cat notes.md)" > notes.md
          {
            echo
            echo "### Container image"
            echo
            echo '```'
            echo "${image}:${v#v}"
            echo "${image}@${{ needs.image.outputs.digest }}"
            echo '```'
            echo
            echo "Pin the digest for a deployment you want to be reproducible; the"
            echo "tag is convenient and the digest is exact."
            echo
            echo "### Verifying a download"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ needs.verify.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          # Every release is a real one until someone decides otherwise; a
          # pre-release tag is the way to say otherwise.
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
