# The identity provider the integration suite signs a person in through (M69).
#
# It is a **separate file from docker-compose.yml on purpose**. That file is the
# "try it on localhost" stack and the base for a real deployment, so anything
# added to it is something an operator runs; an identity provider with a password
# written into a tracked file is not. Compose applies `docker-compose.override.yml`
# automatically on top of the default file and does *not* apply it under an
# explicit `-f`, so this file is reached only by `make idp-up` and by the CI target
# that takes it, and never by `make up`.
#
# What it is for: M69 requires the OIDC add-on's flow to be driven against a real
# implementation of the protocol rather than a mock of it. dex is the smallest
# thing that is one — real discovery, real PKCE, real RS256 ID tokens, real key
# set — and the *connector* behind it is a static password list, which is the
# upstream identity source and not the protocol.
#
# **The image is pinned by digest, not by tag** (m69.md's second risk). A tag is a
# moving reference, and the browser leg of the test reads dex's own login form: a
# form that changes shape under a tag that did not move is exactly the flake this
# milestone was told to design against. The digest below is v2.44.0.
#
# **The port is fixed at 5554 and cannot be parameterized.** An OpenID Provider's
# issuer is a string compared byte for byte against the `iss` claim, and it carries
# the port — so the port lives in test/integration/testdata/idp/config.yaml, in the
# certificate's SAN, and here, and the three have to agree. Published on loopback
# only.

name: linkctrl-idp

services:
  idp:
    # dex v2.44.0. See the note above before changing this to a tag.
    image: ghcr.io/dexidp/dex@sha256:5d0656fce7d453c0e3b2706abf40c0d0ce5b371fb0b73b3cf714d05f35fa5f86
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    restart: "no"
    volumes:
      - ./test/integration/testdata/idp/config.yaml:/etc/dex/config.yaml:ro
      # Generated by scripts/idp.sh, not committed: a private key in a public
      # repository is a private key nobody may reuse, and this one is trusted by
      # the suite that generated it and by nothing else.
      - ./test/integration/testdata/idp/tls:/etc/dex/tls:ro
    ports:
      - "127.0.0.1:5554:5554"
    healthcheck:
      # dex's own telemetry listener, which is plain HTTP and therefore needs no
      # certificate inside the container. It answers only once the HTTPS listener
      # is up, which is what `--wait` is waiting for.
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:5558/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
