# Three replicas behind a load balancer, for M57's rolling-deploy measurement.
#
# **A measurement harness, not a deployment topology.** docs/deployment.md is
# where an operator is told how to run several replicas; this file exists so the
# claims that section makes can be measured on a machine rather than argued from
# the shape of the code. Nothing here ships, and nothing here is a
# recommendation.
#
# Used as an overlay on the base file, with the developer override deliberately
# *not* applied — naming both files explicitly is what skips it, and its
# published ports are exactly what three replicas of one service cannot have:
#
#   docker compose -p linkctrl-test --env-file .env.test \
#     -f docker-compose.yml -f test/ha/compose.yml up -d ...
#
# scripts/rolling-deploy.sh is the only thing that runs it. Read that script
# before this file; it is where the method is.
#
# ## Why three services rather than `--scale app=3`
#
# A scaled service's containers have no stable names, so a rolling replacement
# cannot say *which* replica to replace, and the base file's published
# `${LINKCTRL_HTTP_PORT}:8080` collides on the second replica anyway. Three
# services named app1..app3 give the load balancer three stable hostnames to
# resolve and give the script one container per step to recreate. The cost is
# that the replica definition is written once and anchored, rather than being
# the `app` service the rest of the repository uses — so a change to that
# service's environment has to be made here too. The measurement's own preflight
# guards the part of that which would silently invalidate a run: it refuses to
# measure an image older than the working tree.
#
# The base file's `app` service is stopped by the script before these start. Four
# replicas against one database is not the thing being measured, and the fourth
# would hold job leadership throughout.

x-replica: &replica
  image: ${LINKCTRL_IMAGE:-ghcr.io/devofpie/linkctrl}:${LINKCTRL_TAG:-latest}
  # Repository root, and it is written as `.` rather than `../..` on purpose:
  # Compose resolves a relative path in an overlay against the **project
  # directory**, which is the directory of the *first* `-f` file, not the
  # directory this file is in. Every relative path below follows the same rule,
  # which is why the haproxy config is mounted as `./test/ha/haproxy.cfg` from a
  # file that sits beside it.
  build:
    context: .
    args:
      VERSION: ${LINKCTRL_TAG:-dev}
  # `no`, whatever the instance's policy is: a replica the script has just
  # killed on purpose must stay dead until the script replaces it.
  restart: "no"
  env_file:
    - path: ${LINKCTRL_ENV_PATH:-.env}
      required: false
  environment:
    TZ: UTC
    LINKCTRL_APP_ENV: ${LINKCTRL_APP_ENV:-production}
    LINKCTRL_BASE_URL: ${LINKCTRL_BASE_URL:?LINKCTRL_BASE_URL is required}
    LINKCTRL_HTTP_ADDR: ":8080"
    LINKCTRL_METRICS_ADDR: ":9090"
    LINKCTRL_API_KEY_PEPPER: ${LINKCTRL_API_KEY_PEPPER:?LINKCTRL_API_KEY_PEPPER is required}
    LINKCTRL_DATABASE_URL: postgres://${POSTGRES_USER:-linkctrl}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-linkctrl}?sslmode=disable
    LINKCTRL_REDIS_URL: redis://redis:6379/0
    LINKCTRL_LOG_LEVEL: ${LINKCTRL_LOG_LEVEL:-info}
    LINKCTRL_LOG_FORMAT: ${LINKCTRL_LOG_FORMAT:-json}
    LINKCTRL_SECURE_COOKIES: ${LINKCTRL_SECURE_COOKIES:-false}
    # Every family takes its advisory lock, including the update check, which is
    # the point: the two-leader poll in the script counts holders per key, and a
    # family whose service is nil never reaches `withLeadership` at all. Nothing
    # leaves the deployment even so — the instance is claimed with
    # `update_check: false`, and that row is what `Run` consults.
    LINKCTRL_UPDATE_CHECK: "true"
    # Three replicas booting at once against one database. Migration takes its
    # own lock, so this is safe; it is left on because a rolling deploy of a
    # release that carries a migration is the case worth being faithful to.
    LINKCTRL_MIGRATE_ON_START: ${LINKCTRL_MIGRATE_ON_START:-true}
  healthcheck:
    # The shipped healthcheck, unchanged. `docker compose up --wait` uses it to
    # decide a replacement replica has arrived, so weakening it here would make
    # the deploy look faster than the shipped configuration deploys.
    test: ["CMD", "/linkctrl", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s
  # Must exceed SHUTDOWN_DRAIN_DELAY + SHUTDOWN_TIMEOUT, as the base file says.
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app1:
    <<: *replica
  app2:
    <<: *replica
  app3:
    <<: *replica

  haproxy:
    image: haproxy:3.1-alpine
    restart: "no"
    volumes:
      # Beside this file on disk, named from the repository root because that is
      # the project directory — see the comment on the replica's build context.
      - ./test/ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # Nothing is published. The generator runs on this network, the way
    # docs/slo.md requires of every figure it records — a published port would
    # measure the host's bridge.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8404/stats || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
