# The load balancer M56's contract is written for, configured to obey it.
#
# This is a measurement harness, not a shipped artefact and not a recommended
# configuration. It exists so that "a rolling deploy drops no requests" is a
# claim about the product's *contract* rather than about whatever a DNS client
# happened to cache. Read it as the operator side of
# docs/operations.md#the-load-balancer-contract, written out in one vendor's
# syntax so the arithmetic there can be checked against a running thing.
#
# The two numbers that make the whole measurement mean something:
#
#   inter 1s, fall 2   -> a replica leaves rotation ~2s after /readyz turns 503
#   SHUTDOWN_DRAIN_DELAY = 5s (the shipped default)
#
# 5s > 2s, which is exactly the inequality operations.md asks an operator to
# satisfy. If it did not hold, the listener would close while this proxy still
# believed the replica was serving, and the graceful column of the measurement
# would look like the killed one.

global
    log stdout format raw local0 info
    maxconn 8192

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    # Retry a request whose connection never got anywhere, and send the retry to
    # a *different* server. Without redispatch a retry goes back to the replica
    # that just vanished, three times, and then answers 503.
    #
    # `retries` is what the measurement counts as "requests retried": HAProxy's
    # own wretr/wredis counters, read out of the stats CSV, rather than inferred
    # from the generator's view.
    retries 3
    option redispatch
    # M56's contract, as the health check it was written for. 200 keeps a replica
    # in rotation and 503 removes it — which means `degraded` (200, Redis gone)
    # keeps serving and `draining`/`unavailable` (503) do not. An operator who
    # writes `http-check expect status 200 !503` here has the same rule; one who
    # matches on the *word* in the body takes the whole deployment out during a
    # Redis outage.
    option httpchk GET /readyz
    http-check expect status 200

# Docker's embedded DNS, so a replaced container's new address is picked up.
# Without this HAProxy resolves each server once at startup and keeps dialling
# the address of a container that no longer exists — which is the failure mode a
# naive DNS-round-robin client has, measured by accident instead of on purpose.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold nx 1s
    hold other 1s
    hold refused 1s
    hold timeout 1s

frontend fe
    bind :8080
    default_backend app

backend app
    balance roundrobin
    server app1 app1:8080 check inter 1s fall 2 rise 1 resolvers docker init-addr none
    server app2 app2:8080 check inter 1s fall 2 rise 1 resolvers docker init-addr none
    server app3 app3:8080 check inter 1s fall 2 rise 1 resolvers docker init-addr none

# Counters, in CSV, on a port of their own. scripts/rolling-deploy.sh reads
# stot/wretr/wredis/econ/eresp/hrsp_5xx before and after the run and reports the
# deltas; the HTML page is there for a human watching a run happen.
frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
